<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>소환사의 협곡</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
/* 레이아웃: LCK 중계 그래픽 — 블루/레드 진영 대비, 금빛 강조, 각진 스코어 바 */
:root{
  color-scheme:dark;
  --bg:#0a0f1c; --bg2:#0e1526; --panel:#131c31; --panel2:#18233d; --line:#25314f; --line2:#33426a;
  --text:#e9edf6; --mute:#8d98b3; --dim:#5c6785;
  --gold:#e9c46a; --gold2:#b8913a; --blue:#3f8cff; --red:#ff4f61; --good:#41d68b; --warn:#ffb547; --bad:#ff5d6c;
  --f-display:'Black Han Sans','IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --f-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --f-num:'Chakra Petch','IBM Plex Sans KR',ui-monospace,monospace;
  --cut:10px;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(1200px 500px at 10% -10%,rgba(63,140,255,.10),transparent 60%),radial-gradient(900px 500px at 110% 0%,rgba(255,79,97,.08),transparent 60%);background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:50;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
.mute{color:var(--mute)} .dim{color:var(--dim)} .gold{color:var(--gold)} .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}
h1,h2,h3{margin:0;text-wrap:balance}
.disp{font-family:var(--f-display);font-weight:400;letter-spacing:.01em}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);font-weight:600}

/* 버튼 */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line2);background:var(--panel2);padding:10px 16px;border-radius:6px;font-weight:600;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:#1f2c4c;border-color:#4a5c8c}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.primary{background:linear-gradient(180deg,#f1d083,#d4a94a);color:#1a1405;border-color:#f3d58e;clip-path:polygon(var(--cut) 0,100% 0,calc(100% - var(--cut)) 100%,0 100%);padding:12px 26px;border-radius:0}
.btn.primary:hover{background:linear-gradient(180deg,#f6dc9c,#dfb65a)}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn.on{border-color:var(--gold);color:var(--gold);background:rgba(233,196,106,.08)}
.btn.danger{border-color:#6b2a35;color:#ff8e99}

/* 상단바 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(10,15,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:14px;padding-block:10px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-size:19px;color:var(--gold);white-space:nowrap}
.top .meta{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-left:auto;font-size:12.5px}
.top .meta b{font-family:var(--f-num);font-size:14px}
.trust{display:flex;align-items:center;gap:6px}
.trust .track{width:70px;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.trust .fill{height:100%;background:var(--gold)}
.nav{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-top:1px solid var(--line)}
.nav::-webkit-scrollbar{display:none}
.nav button{background:none;border:0;padding:11px 16px;color:var(--mute);font-weight:600;white-space:nowrap;border-bottom:2px solid transparent}
.nav button.on{color:var(--text);border-bottom-color:var(--gold)}

/* 팀 배지 */
.tb{display:inline-grid;place-items:center;min-width:44px;height:26px;padding:0 7px;font-family:var(--f-num);font-weight:700;font-size:12.5px;letter-spacing:.04em;color:#0a0f1c;background:var(--tc);clip-path:polygon(5px 0,100% 0,calc(100% - 5px) 100%,0 100%)}
.tb.lg{min-width:76px;height:44px;font-size:20px;clip-path:polygon(9px 0,100% 0,calc(100% - 9px) 100%,0 100%)}
.tb.xl{min-width:110px;height:64px;font-size:30px;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}

/* 패널 */
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.grid>.grid{align-content:start}
.roster-grid{grid-template-columns:repeat(auto-fill,minmax(min(100%,212px),1fr))}
.gticks{position:relative;height:14px;font:500 10px var(--f-num);color:var(--dim)}
.gticks span{position:absolute;top:0;transform:translateX(-50%)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.panel h3{font-size:15px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.panel h3 .eyebrow{margin-left:auto}
.section{margin-top:18px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2);font-size:11.5px;color:var(--mute);white-space:nowrap}
.chip.gold{color:var(--gold);border-color:rgba(233,196,106,.4)}
.chip.trait{color:#cfd8ff;border-color:#3d4f86;background:#18224a}
.tier{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:4px;font:700 11px var(--f-num)}
.tier.S{background:#ff4f61;color:#fff}.tier.A{background:#ffb547;color:#1a1100}.tier.B{background:#3d4a6e;color:#d6ddf0}.tier.C{background:#232c45;color:#7a85a3}
.ci{display:inline-flex;align-items:center;justify-content:center;height:28px;min-width:28px;padding:0 9px;border-radius:999px;white-space:nowrap;letter-spacing:-.02em;max-width:100%;overflow:hidden;text-overflow:ellipsis;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--cc) 70%,#fff 30%),var(--cc) 55%,color-mix(in srgb,var(--cc) 50%,#000 50%));color:#0a0f1c;font-weight:700;font-size:12px;flex:none;box-shadow:inset 0 0 0 2px rgba(0,0,0,.25)}
.ci.sm{height:22px;min-width:22px;padding:0 7px;font-size:11px}
.ci.lg{height:40px;min-width:40px;padding:0 14px;font-size:16px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--gold)}
.bar.cond>i{background:var(--good)}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-size:11px;letter-spacing:.08em;color:var(--mute);font-weight:600;text-align:left;padding:8px 8px;border-bottom:1px solid var(--line2);white-space:nowrap}
.tbl td{padding:8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr.me td{background:rgba(233,196,106,.07)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}

/* 타이틀 */
.title-hero{padding:56px 0 24px;display:grid;gap:10px}
.title-hero h1{font-family:var(--f-display);font-size:clamp(46px,9vw,96px);line-height:.95;color:var(--text)}
.title-hero h1 em{font-style:normal;color:var(--gold)}
.title-hero p{color:var(--mute);max-width:60ch;margin:0}
.team-pick{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:10px}
.tp{position:relative;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:8px;overflow:hidden;transition:border-color .15s,transform .15s}
.tp::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:var(--tc)}
.tp:hover{border-color:var(--tc);transform:translateY(-2px)}
.tp.on{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc),0 10px 30px -10px color-mix(in srgb,var(--tc) 60%,transparent)}
.tp .nm{font-weight:700}
.tp .stars{font-size:12px;color:var(--mute)}
.ovr-big{font:700 28px/1 var(--f-num)}
.opts{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:18px 0}

/* 홈: 다음 경기 */
.match-hero{position:relative;overflow:hidden;background:linear-gradient(105deg,color-mix(in srgb,var(--ta) 22%,var(--panel)) 0%,var(--panel) 42%,var(--panel) 58%,color-mix(in srgb,var(--tb2) 22%,var(--panel)) 100%);border:1px solid var(--line2);border-radius:10px;padding:22px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:16px}
.vs .side{display:grid;gap:6px;justify-items:start}
.vs .side.r{justify-items:end;text-align:right}
.vs .mid{font:700 15px var(--f-num);color:var(--mute);text-align:center}
.vs .tn{font-weight:700;font-size:15px}
.cmp{display:grid;grid-template-columns:40px 1fr 40px;gap:8px;align-items:center;font-size:12px;margin-top:6px}
.cmp .dual{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--line)}
.cmp .dual i{display:block;height:100%}
.train-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr));gap:8px}
.tcard{text-align:left;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;padding:10px;display:grid;gap:3px}
.tcard b{font-size:13.5px}.tcard span{font-size:11.5px;color:var(--mute)}
.tcard:hover{border-color:var(--gold2)}
.tcard.on{border-color:var(--gold);background:rgba(233,196,106,.08)}
.tcard[disabled]{opacity:.45;cursor:default}
.news{display:grid;gap:0}
.news .n{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.news .n:last-child{border-bottom:0}
.news .tag{font:700 10.5px var(--f-num);padding:2px 6px;border-radius:3px;background:var(--panel2);color:var(--mute);height:max-content;min-width:44px;text-align:center}
.news .tag.win{background:rgba(65,214,139,.15);color:var(--good)}.news .tag.loss{background:rgba(255,93,108,.14);color:var(--bad)}
.news .tag.big{background:rgba(233,196,106,.15);color:var(--gold)}.news .tag.patch{background:rgba(63,140,255,.15);color:#8ab8ff}
.event{border:1px solid rgba(233,196,106,.35);background:linear-gradient(180deg,rgba(233,196,106,.07),transparent);border-radius:8px;padding:14px;display:grid;gap:10px}
.event .eo{display:grid;gap:8px}
.event .eo button{text-align:left;padding:10px 12px;border-radius:6px;border:1px solid var(--line2);background:var(--panel2);display:grid;gap:2px}
.event .eo button:hover{border-color:var(--gold)}
.event .eo span{font-size:12px;color:var(--mute)}

/* 로스터 */
.pcard{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;display:grid;gap:10px;min-width:0}
.pcard.bench{opacity:.78;border-style:dashed}
.pcard .hd{display:flex;gap:12px;align-items:center}
.pcard .role{font:700 11px var(--f-num);color:var(--mute);letter-spacing:.1em}
.pcard .nm{font-weight:700;font-size:17px}
.pcard .ovr{margin-left:auto;text-align:right}
.pcard .ovr b{font:700 30px/1 var(--f-num)}
.pcard .ovr small{display:block;color:var(--mute);font-size:11px}
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px 10px}
.stat{display:grid;gap:3px;font-size:11.5px;color:var(--mute)}
.stat div{display:flex;justify-content:space-between}
.stat b{color:var(--text);font-family:var(--f-num)}
.sigs{display:flex;gap:6px;flex-wrap:wrap}
.sig{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 8px 3px 3px;border-radius:999px;background:var(--panel2);border:1px solid var(--line2)}
.chem-tbl td,.chem-tbl th{text-align:center}
.chem-cell{display:inline-block;min-width:34px;padding:3px 0;border-radius:4px;font:600 12px var(--f-num)}

/* 경기 공통 */
.mbar{display:flex;align-items:center;gap:12px;padding-block:12px;flex-wrap:wrap}
.pips{display:flex;gap:3px;flex-wrap:wrap}
.pip{width:14px;height:6px;border-radius:2px;background:var(--line)}
.pip.b{background:color-mix(in srgb,var(--blue) 40%,var(--line))}.pip.r{background:color-mix(in srgb,var(--red) 40%,var(--line))}
.pip.done.b{background:var(--blue)}.pip.done.r{background:var(--red)}
.pip.now{outline:2px solid var(--gold);outline-offset:1px}
.pip.ban{height:4px;margin-top:1px}

/* 밴픽 */
.draft{display:grid;grid-template-columns:230px 1fr 230px;gap:14px;align-items:start}
.dside{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.dside .dh{padding:10px 12px;display:flex;align-items:center;gap:8px;font-weight:700}
.dside.blue .dh{background:linear-gradient(90deg,rgba(63,140,255,.35),transparent)}
.dside.red .dh{background:linear-gradient(270deg,rgba(255,79,97,.35),transparent);flex-direction:row-reverse}
.bans{display:flex;flex-wrap:wrap;gap:4px;padding:8px 12px;border-bottom:1px solid var(--line)}
.dside.red .bans{flex-direction:row-reverse}
.bans .bs{min-width:30px;height:30px;padding:0 1px;border-radius:4px;background:var(--bg2);border:1px dashed var(--line2);display:grid;place-items:center;position:relative;overflow:hidden}
.bans .bs .ci{height:26px;font-size:10.5px;padding:0 6px;filter:grayscale(1) brightness(.6)}
.bans .bs.on{border:1px solid var(--gold)}
.bans .bs .ci::after{content:"";position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,var(--red) 46%,var(--red) 54%,transparent 54%)}
.pk{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line);min-height:58px}
.dside.red .pk{grid-template-columns:1fr auto;text-align:right}
.dside.red .pk>.ci,.dside.red .pk>.ph{order:2}
.pk .ph{width:34px;height:34px;border-radius:50%;border:1px dashed var(--line2)}
.pk .ci{height:32px;font-size:12.5px;max-width:92px}
.pk.on{background:rgba(233,196,106,.08);box-shadow:inset 3px 0 0 var(--gold)}
.dside.red .pk.on{box-shadow:inset -3px 0 0 var(--gold)}
.pk .pn{font-size:12px;color:var(--mute)}
.pk .cn{font-weight:700;font-size:14px}
.pk .cn.empty{color:var(--dim);font-weight:500}
.pk.flash{animation:flash .6s ease}
@keyframes flash{0%{background:rgba(233,196,106,.35)}100%{background:transparent}}
.dcenter{display:grid;gap:10px;min-width:0}
.turn{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.turn .who{font-family:var(--f-display);font-size:20px}
.wbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.wbar i{display:block;height:100%;transition:width .5s}
.rtabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.rtabs button{padding:7px 12px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:12.5px;white-space:nowrap}
.rtabs button.on{border-color:var(--gold);color:var(--gold)}
.rtabs button.open::after{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--gold);margin-left:6px;vertical-align:middle}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:6px;max-height:430px;overflow:auto;padding:2px;align-content:start}
.ct{position:relative;display:grid;justify-items:center;gap:4px;padding:9px 4px 7px;border-radius:6px;background:var(--panel);border:1px solid var(--line);font-size:12px;text-align:center}
.ct:hover{border-color:var(--line2);background:var(--panel2)}
.ct.sel{border-color:var(--gold);background:rgba(233,196,106,.1)}
.ct.rec{box-shadow:0 0 0 1px var(--good)}
.ct .tier{position:absolute;top:4px;left:4px;width:16px;height:16px;font-size:9.5px}
.ct .mst{font:600 10.5px var(--f-num);color:var(--mute)}
.ct .mst.hi{color:var(--gold)}
.ct .thr{position:absolute;top:5px;right:5px;width:7px;height:7px;border-radius:50%;background:var(--red)}
.ct.x{opacity:.28;pointer-events:none}
.ct.x .fl{position:absolute;bottom:3px;font-size:9.5px;color:var(--warn)}
.ct .cn{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 12px;border-radius:8px;background:var(--panel2);border:1px solid var(--line2)}
.comp{display:grid;gap:8px}
.cbar{display:grid;grid-template-columns:52px 1fr 52px;gap:10px;align-items:center;font-size:12.5px}
.cbar .lbl{text-align:center;color:var(--mute);font-size:11.5px;margin-bottom:2px}
.tact{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,170px),1fr));gap:8px}

/* 라이브 */
.score{display:grid;grid-template-columns:1fr auto 1fr;align-items:stretch;background:var(--bg2);border:1px solid var(--line2);border-radius:8px;overflow:hidden}
.score .sd{display:flex;align-items:center;gap:12px;padding:10px 14px;min-width:0}
.score .sd.b{background:linear-gradient(90deg,rgba(63,140,255,.28),transparent 80%)}
.score .sd.r{background:linear-gradient(270deg,rgba(255,79,97,.28),transparent 80%);flex-direction:row-reverse;text-align:right}
.score .k{font:700 34px/1 var(--f-num)}
.score .info{display:grid;gap:3px;font-size:12px;color:var(--mute);min-width:0}
.score .info b{color:var(--text);font-family:var(--f-num)}
.score .clock{display:grid;place-items:center;padding:6px 18px;background:var(--panel);border-inline:1px solid var(--line2);text-align:center}
.score .clock b{font:700 24px/1 var(--f-num);color:var(--gold)}
.score .clock span{font-size:10.5px;color:var(--mute);letter-spacing:.1em}
.drk{display:inline-flex;gap:3px}
.drk i{width:10px;height:10px;transform:rotate(45deg);border-radius:2px;display:inline-block}
.live{display:grid;grid-template-columns:minmax(0,300px) minmax(0,1fr) minmax(0,340px);gap:14px;margin-top:14px;align-items:start}
.mm{background:#0b1322;border:1px solid var(--line2);border-radius:8px;padding:8px;aspect-ratio:1;max-width:100%}
.mm svg{width:100%;height:100%;display:block}
.ping{animation:ping 1.2s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes ping{0%{transform:scale(.3);opacity:1}100%{transform:scale(2.4);opacity:0}}
.gold-graph{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 10px 4px}
.gold-graph svg{width:100%;height:120px;display:block}
.feed{display:grid;gap:6px;max-height:520px;overflow:auto;padding-right:4px}
.fe{display:grid;grid-template-columns:42px 1fr;gap:8px;padding:8px 10px;border-radius:6px;background:var(--panel);border-left:3px solid var(--line2);font-size:13px;animation:slidein .35s ease}
.fe.s0{border-left-color:var(--blue)}.fe.s1{border-left-color:var(--red)}
.fe .tm{font:600 12px var(--f-num);color:var(--mute)}
.fe.big{background:linear-gradient(90deg,rgba(233,196,106,.14),var(--panel));font-weight:600}
.fe.call{background:var(--panel2);color:var(--gold)}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.ptbl{width:100%;border-collapse:collapse;font-size:12.5px}
.ptbl td{padding:5px 4px;border-bottom:1px solid var(--line);white-space:nowrap}
.ptbl .kda{font-family:var(--f-num);text-align:right}
.ptbl .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis}
.ptbl tr.hdr td{font-size:11px;color:var(--mute);letter-spacing:.08em;padding-top:10px}
.speed{display:flex;gap:4px;flex-wrap:wrap}

/* 세이브 */

.spb{font-size:10.5px;padding:1px 7px;border-radius:999px;background:#ff9a3c;color:#1a1206;font-weight:800;vertical-align:middle}
.ts{display:inline-block;font-size:11.5px;color:var(--mute);margin-right:8px;white-space:nowrap}.ts b{color:var(--gold)}

/* ===== FM 스타일 셸 ===== */
.shell{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100vh}
.sidebar{position:sticky;top:0;height:100vh;overflow:auto;background:linear-gradient(180deg,#0d1424,#0a0f1c);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:16px 12px;gap:14px}
.sbrand{font-family:var(--f-display);font-size:20px;color:var(--gold);padding:0 6px}
.steam{display:flex;gap:10px;align-items:center;padding:10px;border-radius:10px;background:linear-gradient(120deg,color-mix(in srgb,var(--tc) 22%,var(--panel)),var(--panel));border:1px solid var(--line2)}
.steam b{display:block;font-size:14px}.steam small{color:var(--mute);font-size:12px}
.snav{display:grid;gap:2px}

.snav button .g{width:20px;text-align:center;font-size:15px}

.snav button.on{background:rgba(233,196,106,.12);color:var(--gold)}

.bdg{margin-left:auto;font-style:normal;font-size:10.5px;font-weight:800;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--red);color:#fff;display:inline-grid;place-items:center;font-family:var(--f-num)}
.sfoot{margin-top:auto;font-size:12.5px;display:grid;gap:4px;padding:10px;border-radius:10px;background:var(--panel);border:1px solid var(--line)}
.mainc{min-width:0}
.top2{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:rgba(10,15,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}

.m-only{display:none}
.mainc .wrap{max-width:1240px;padding-top:16px}
/* 대시보드 */
.dash{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:14px;align-items:start}
.d-side{display:grid;gap:14px}

.tile h3{display:flex;align-items:center;gap:8px}
.lnk{margin-left:auto;background:none;border:0;color:var(--gold);font-size:12.5px;font-weight:600}
.todo{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.todo i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line2);flex:0 0 auto}
.todo.done{color:var(--mute)}.todo.done i{background:var(--good);border-color:var(--good)}
.kv{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}.kv span{color:var(--mute)}
.mt{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px}.mt.me{color:var(--gold)}
/* 받은 소식 */
.msgs{display:grid;gap:4px;margin-top:8px}
.msg{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;padding:9px 10px;border-radius:8px;background:var(--panel2);border-left:3px solid transparent;font-size:13.5px}
.msg.new{border-left-color:var(--gold);background:linear-gradient(90deg,rgba(233,196,106,.08),var(--panel2))}
.msg small{font-size:11px}
.msgs.sm .msg{padding:7px 9px;font-size:12.5px}
.tag.league{background:rgba(138,184,255,.16);color:#8ab8ff}
/* 등급 */
.grd{display:inline-grid;place-items:center;min-width:28px;height:22px;padding:0 6px;border-radius:5px;font:800 12px var(--f-num);color:#0a0f1c;background:#8d98b3}

.grd.g-Bp{background:#8ab8ff}.grd.g-B{background:#62d3ff}.grd.g-C{background:#7fe0a0}.grd.g-D{background:#5c6785;color:#e9edf6}

/* 선수 이름 링크 */
.pl{background:none;border:0;padding:0;color:var(--text);font-weight:700;text-decoration:underline;text-decoration-color:rgba(233,196,106,.35);text-underline-offset:3px;cursor:pointer}
.pl:hover{color:var(--gold)}
.squad tr[data-a]{cursor:pointer}.squad tr[data-a]:hover td{background:rgba(255,255,255,.03)}.squad tr.bench td{opacity:.78}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:8px;overflow:hidden}.seg button{padding:7px 12px;background:var(--panel);border:0;color:var(--mute);font-size:12.5px}.seg button.on{background:rgba(233,196,106,.14);color:var(--gold)}
.cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-color:rgba(233,196,106,.35)}
.teamhead{background:linear-gradient(110deg,color-mix(in srgb,var(--tc) 20%,var(--panel)),var(--panel) 60%)}
.teamhead .wl{display:flex;gap:3px}.teamhead .wl i{font-style:normal;font-size:11px;font-weight:700;width:20px;height:20px;border-radius:4px;display:grid;place-items:center}
.teamhead .wl i.w{background:rgba(65,214,139,.18);color:var(--good)}.teamhead .wl i.l{background:rgba(255,93,108,.18);color:var(--bad)}
/* 선수 프로필 모달 */
.pmodal{position:fixed;inset:0;z-index:70;background:rgba(5,8,16,.72);display:grid;place-items:center;padding:16px;overflow:auto}
.pm{width:min(860px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:14px;box-shadow:0 30px 90px rgba(0,0,0,.6)}
.pmh{position:relative;display:flex;gap:16px;align-items:flex-start;justify-content:space-between;padding:18px 20px;background:linear-gradient(110deg,color-mix(in srgb,var(--tc) 26%,var(--panel)),var(--panel) 65%);border-bottom:1px solid var(--line)}
.pmg{display:grid;justify-items:end;gap:6px;padding-right:34px}
.pmx{position:absolute;top:12px;right:12px;width:30px;height:30px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--mute)}
.pmb{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;padding:16px 20px;align-items:start}
.pmf{padding:0 20px 20px}
.radar{width:100%;max-width:260px;display:block;margin:0 auto}
.radar .rl{fill:#8d98b3;font-size:11px;font-weight:600}.radar .rv{fill:#e9edf6;font:700 12px var(--f-num)}
.rleg{display:flex;gap:12px;justify-content:center;font-size:11px;color:var(--mute);flex-wrap:wrap}.rleg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
@media (max-width:1100px){.dash3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:900px){
  .shell{grid-template-columns:1fr}.sidebar{display:none}.m-only{display:inline}
  .bnav{display:flex!important;overflow-x:auto;scrollbar-width:none;position:fixed;left:0;right:0;bottom:0;z-index:45;background:rgba(10,15,28,.96);backdrop-filter:blur(8px);border-top:1px solid var(--line2);padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px))}
  .bnav button{flex:1 0 64px;background:none;border:0;display:grid;justify-items:center;gap:1px;padding:6px 2px;color:var(--mute);font-size:11px;font-weight:600}
  .bnav button .g{font-size:17px;line-height:1;position:relative}.bnav .bdg{position:absolute;top:-6px;right:-14px;min-width:16px;height:16px;font-size:9.5px}
  .bnav button.on{color:var(--gold)}
  .wrap.has-bnav{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .dash,.dash3{grid-template-columns:1fr}
  .pmb{grid-template-columns:1fr}
  .tb2{padding:8px 14px;gap:8px}.tb2 .phase{font-size:12.5px;flex-basis:100%;order:5}
}
/* 톱니바퀴 메뉴 */
.gearb{width:34px;height:34px;border-radius:50%;border:1px solid var(--line2);background:var(--panel2);color:var(--mute);display:inline-grid;place-items:center;flex:0 0 auto}
.gearb:hover{color:var(--gold);border-color:var(--gold)}
.title-gear{display:flex;justify-content:flex-end;padding-top:14px;margin-bottom:-34px;position:relative;z-index:2}
.gearbg{position:fixed;inset:0;z-index:75;background:rgba(5,8,16,.55)}
.gearm{position:absolute;top:58px;right:16px;width:min(380px,calc(100vw - 32px));max-height:calc(100vh - 80px);overflow:auto;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:14px;display:grid;gap:8px;box-shadow:0 24px 70px rgba(0,0,0,.6)}
.gi{display:flex;gap:12px;align-items:flex-start;text-align:left;padding:10px;border-radius:9px;background:var(--panel2);border:1px solid var(--line);color:var(--text);width:100%}
.gi:hover{border-color:var(--gold)}.gi>span{width:22px;text-align:center;font-size:16px}.gi b{display:block;font-size:14px}.gi small{color:var(--mute);font-size:12px}
.gi.warnbox{border-color:rgba(255,93,108,.45);background:rgba(255,93,108,.06)}
.slot{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:8px;border:1px dashed var(--line2)}
.slot .btn{white-space:nowrap;flex:0 0 auto}
.grd.sm{min-width:22px;height:17px;font-size:10.5px;padding:0 4px;margin-left:3px;vertical-align:middle}

.found{border-color:rgba(233,196,106,.4)}
.fmodes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,210px),1fr));gap:8px}
.fin{padding:9px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--bg);color:var(--text);font:inherit;font-size:14px;min-width:0;flex:1 1 200px}
.fin.sm{flex:0 0 90px;text-transform:uppercase}
.swatches{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.swc{width:30px;height:30px;border-radius:50%;border:2px solid rgba(255,255,255,.08);padding:0}.swc.on{border-color:#fff;box-shadow:0 0 0 2px var(--gold)}
/* 타이틀 모드 탭 */
.tmode{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line2);border-radius:10px;overflow:hidden;margin-bottom:16px;background:var(--panel)}
.tmode button{border:0;background:transparent;padding:14px 16px;text-align:left;display:grid;gap:2px;border-bottom:3px solid transparent;color:var(--mute)}
.tmode button b{font-size:15px;color:var(--text)}.tmode button span{font-size:12px}
.tmode button.on{background:rgba(233,196,106,.08);border-bottom-color:var(--gold)}.tmode button.on b{color:var(--gold)}
.tmode button+button{border-left:1px solid var(--line2)}
/* 창단 */
.found2{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:16px;align-items:start}
.fsteps{display:grid;gap:12px;min-width:0}
.fstep{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}

.fopt b{font-size:14px}.fopt span{font-size:12px;color:var(--mute);line-height:1.45}.fopt .fic{font-size:18px;color:var(--gold);line-height:1}

.fopt:hover{border-color:var(--gold2)}.fopt.on{border-color:var(--gold);background:rgba(233,196,106,.08);box-shadow:0 0 0 1px var(--gold)}
.fslots{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.fslot{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:6px;background:var(--panel2);border:1px solid var(--line2);font-size:12.5px;text-align:left;min-width:0}

.ftabs button.on{background:rgba(233,196,106,.14);color:var(--gold);font-weight:600}

.fteam .nm{font-size:13.5px}.fteam .ros{font-size:11.5px;color:var(--mute);line-height:1.4}
.fteam:hover{border-color:var(--tc)}.fteam.on{border-color:var(--tc);box-shadow:0 0 0 1px var(--tc);background:color-mix(in srgb,var(--tc) 10%,var(--panel2))}

.fpv-top{display:flex;gap:12px;align-items:center}.fpv-top small{display:block;color:var(--mute);font-size:12px}
.fbadge{flex:0 0 56px;height:56px;border-radius:12px;display:grid;place-items:center;background:var(--tc);color:#fff;font-family:var(--f-display);font-size:18px;text-shadow:0 1px 2px rgba(0,0,0,.5);box-shadow:0 8px 20px -8px var(--tc)}

.bye{border-color:rgba(233,196,106,.35)}.byeg{display:flex;flex-wrap:wrap;gap:8px 18px}
@media (max-width:860px){.found2{grid-template-columns:1fr}.fprev{position:static}}

const U = {
  r:(a=0,b=1)=>a+Math.random()*(b-a),
  ri:(a,b)=>Math.floor(a+Math.random()*(b-a+1)),
  pick:a=>a[Math.floor(Math.random()*a.length)],
  clamp:(v,a,b)=>Math.max(a,Math.min(b,v)),
  gauss:()=>{let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)},
  shuffle:a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a},
  wpick:(items,w)=>{const s=w.reduce((x,y)=>x+y,0);let r=Math.random()*s;for(let i=0;i<items.length;i++){r-=w[i];if(r<=0)return items[i]}return items[items.length-1]},
  logi:x=>1/(1+Math.exp(-x)),
  avg:a=>a.reduce((x,y)=>x+y,0)/Math.max(1,a.length)
};

function josa(word,a,b){const c=word.charCodeAt(word.length-1);if(c<0xAC00||c>0xD7A3)return word+b;return word+(((c-0xAC00)%28)?a:b)}

function deriveTrait(name,st,ovrv,pot){
  if(FIXED_TRAITS[name])return FIXED_TRAITS[name];
  if(pot-ovrv>=6)return 'prospect';
  const best=['laning','teamfight','macro'].sort((a,b)=>st[b]-st[a])[0];
  if(st.mental<=80)return 'streaky';
  if(st.pool>=94)return 'pool';
  if(st.mental>=95)return 'iron';
  if(best==='laning'&&st.laning>=90)return 'laner';
  if(best==='teamfight'&&st.teamfight>=90)return 'fighter';
  if(best==='macro'&&st.macro>=94)return 'brain';
  return 'steady';
}
function initMastery(p){
  p.mastery={};
  const champs=CHAMP_LIST.filter(c=>CHAMPS[c].roles.includes(p.pos));
  champs.forEach(c=>{p.mastery[c]=Math.round(U.clamp(50+(p.st.pool-75)*0.9+U.r(-8,12)+(p.trait==='pool'?8:0),35,88))});
  let sig=(SIGNATURES[p.name]||[]).filter(c=>CHAMPS[c]&&CHAMPS[c].roles.includes(p.pos));
  if(sig.length<2){sig=sig.concat(U.shuffle(champs.filter(c=>!sig.includes(c))).slice(0,3-sig.length))}
  p.sig=sig;
  sig.forEach((c,i)=>{p.mastery[c]=Math.round(U.clamp(97-i*2+U.r(-3,2),86,99))});
}
function makePlayer(team,name,pos,o,pot,st,opts={}){
  const p={id:S.nextId++,name,team,pos,pot,st:{...st},baseOvr:o,baseSum:0,exp:{},form:0,cond:90,morale:70,
    trait:null,mastery:{},sig:[],contract:U.ri(1,3),salary:salaryFor(o),
    season:{g:0,k:0,d:0,a:0,pog:0,rs:0,solo:0,low:0,high:0,ppog:0,cb:0},career:{g:0,k:0,d:0,a:0,pog:0,titles:0,mvp:0},rookie:!!opts.rookie,joined:S.year};
  p.baseSum=statSum(p);
  p.trait=opts.trait||deriveTrait(name,st,o,pot);
  initMastery(p);
  S.players[p.id]=p;
  migratePlayer(p);
  return p;
}
function makeRookie(pos,quality=0){
  const used=new Set(Object.values(S.players).map(p=>p.name));
  let name=U.pick(ROOKIE_NAMES.filter(n=>!used.has(n)))||(typeof proLikeId==='function'?proLikeId():'Rookie'+S.nextId);
  const o=U.ri(70,79)+quality; const pot=typeof s2Pot==='function'?s2Pot(o,'rookie'):U.clamp(o+U.ri(8,18),80,97);
  const b=()=>U.clamp(o+U.ri(-5,5),55,95);
  const st={laning:b(),mechanics:b()+2,teamfight:b(),macro:b()-3,pool:b()-4,mental:b()};
  const p=makePlayer(null,name,pos,o,pot,st,{rookie:true,trait:Math.random()<0.45?'prospect':U.pick(['laner','fighter','brain','streaky','steady','iron'])});
  p.contract=2;p.salary=Math.max(1,salaryFor(o)-1);
  return p;
}

function T(code){return S.teams[code]}
function isLCK(code){const ex=typeof S!=='undefined'&&S&&S.excluded;if(ex&&ex.includes(code))return false;return LCK_CODES.includes(code)||!!(typeof S!=='undefined'&&S&&S.expansion&&S.expansion.includes(code))}
function lckCodes(){const ex=(S&&S.excluded)||[];return LCK_CODES.concat((S&&S.expansion)||[]).filter(c=>S.teams[c]&&!ex.includes(c))}
function regionOf(code){return (TEAM_META[code]&&TEAM_META[code].region)||'LCK'}
function abv(c){return (typeof TEAM_ABBR!=='undefined'&&TEAM_ABBR[c])||c}
function teamName(code){return TEAM_META[code]?TEAM_META[code].name:code}
function roster(code){return T(code).roster.map(P)}
function starters(code){
  const t=T(code),out={};
  ROLES.forEach(r=>{
    const lid=t.lineup&&t.lineup[r];
    let p=lid&&t.roster.includes(lid)&&P(lid).pos===r?P(lid):null;
    if(!p){const c=t.roster.map(P).filter(x=>x.pos===r).sort((a,b)=>ovr(b)-ovr(a));p=c[0]||null;
      // 교체는 감독 선택. AI 구단만 주전이 심한 슬럼프일 때 가끔 식스맨을 기용
      if(p&&code!==S.myTeam&&(p.form<=-6||p.arrow===-2)){const alt=c.find(x=>x!==p&&x.form>=0&&(x.arrow||0)>=0&&ovr(x)>=ovr(p)-(p.arrow===-2?4:3));if(alt)p=alt}}
    out[r]=p;
  });
  return out;
}
function teamOvr(code){const s=starters(code);return Math.round(U.avg(ROLES.map(r=>s[r]?ovr(s[r]):60)))}

    const list=CHAMP_LIST.filter(c=>CHAMPS[c].roles[0]===r).sort((a,b)=>score[b]-score[a]);

function compTags(picks){
  const c={E:0,S:0,G:0,T:0,D:0,P:0,K:0,L:0,AD:0,AP:0};
  ROLES.forEach(r=>{const ch=picks[r]&&CHAMPS[picks[r]];if(!ch)return;ch.tags.forEach(t=>c[t]++);c[ch.dmg]++});

}
function mastery(p,c){if(!p||!c)return 60;const fits=CHAMPS[c]&&(CHAMPS[c].roles.includes(p.pos)||isFlex(c,p.pos));const floor=fits?Math.round(38+(p.st.pool-70)*0.9):40;const m=p.mastery[c];return Math.max(m!=null?m:(fits?55:40),floor)}
const ROLE_W={early:{TOP:1,JUG:1.3,MID:1.1,ADC:0.9,SUP:0.9},mid:{TOP:1,JUG:1.1,MID:1.1,ADC:1,SUP:1},late:{TOP:0.9,JUG:0.9,MID:1.15,ADC:1.25,SUP:0.85}};
function playerPhase(p,c,ph,ctx){
  const s=p.st;let v=ph==='early'?s.laning*.5+s.mechanics*.35+s.macro*.15:ph==='mid'?s.teamfight*.35+s.macro*.4+s.mechanics*.25:s.teamfight*.45+s.mechanics*.3+s.mental*.25;
  let m=mastery(p,c);const pl=tLv(p,'pool');if(pl&&m<80)m+=(80-m)*0.3*pl;if(c&&isFlex(c,p.pos)&&m<85)m-=4;
  v+=(m-80)*0.11;
  v+=c?TIER_BONUS[tierLetter(c)]:0;
  v+=p.form*0.25+(p.cond-75)*0.05+(p.morale-60)*0.025;
  // 경기 컨디션 화살표 · 세부 능력치 편차
  v+=(p.arrow||0)*ARROW_FX;const o=p.off||{};
  if(ph==='early')v+=((o.cs||0)+(o.trade||0)+(o.prio||0)*0.6)*0.06;
  else if(ph==='mid')v+=((o.rotate||0)+(o.objective||0)+(o.engage||0)*0.6)*0.05;
  else v+=((o.posi||0)+(o.target||0)+(o.dps||0)*0.8+(o.peel||0)*0.5+(o.tank||0)*0.5)*0.05;
  if(ctx.playoff)v+=(sub(p,'clutch')-80)*0.04;
  if(ctx.bo5)v+=1.5*tMul(p,'legend');
  if(ctx.playoff)v+=1.8*tMul(p,'clutch');
  if(ph==='early')v+=2*tMul(p,'laner');
  if(ph!=='early')v+=1.5*tMul(p,'fighter');
  if(ctx.setNo>=4)v+=(s.mental-85)*0.08;
  if(typeof roleFx==='function')v+=roleFx(p,ph);
  if(ctx.playoff&&p.hid)v+=(p.hid.prs-11)*0.08;
  return v;
}
function sideProfile(code,picks,tactic,focusId,ctx){
  const lineup=starters(code);const ph={};

    let s=0,w=0;ROLES.forEach(r=>{const p=lineup[r];if(ctx.compOnly){s+=(80+(picks[r]?TIER_BONUS[tierLetter(picks[r])]*2.5:0))*ROLE_W[k][r];w+=ROLE_W[k][r];return}if(!p){s+=60;w+=1;return}
      let v=playerPhase(p,picks[r],k,ctx);
      if(focusId){v+=p.id===focusId?2.6:-0.45}
      s+=v*ROLE_W[k][r];w+=ROLE_W[k][r]});
    ph[k]=80+(s/w-80)*STAT_COMP;
  });
  if(!ctx.compOnly){const ar=U.clamp(ROLES.reduce((s,r)=>s+(lineup[r]?(lineup[r].arrow||0):0),0),-6,6);['early','mid','late'].forEach(k=>ph[k]+=ar*ARROW_TEAM)}
  const tg=compTags(picks);
  ph.early+=(tg.E*0.9-tg.S*0.45+tg.K*0.25)*0.7;
  ph.mid+=(tg.G*0.5+tg.T*0.45+tg.K*0.3+tg.P*0.25+tg.L*0.2)*0.6;
  ph.late+=(tg.S*0.9+tg.T*0.4+tg.D*0.35-tg.E*0.35)*0.7;
  if(tg.AD>=4||tg.AP>=4){ph.mid-=1.5;ph.late-=1.5}
  if(tg.G===0){ph.mid-=1;ph.late-=1}
  const meta=metaObj();const mc=meta.tags.reduce((s,t)=>s+tg[t],0);
  const chem=teamChem(code,lineup);const coh=ctx.compOnly?75:cohesion(code,lineup);
  const macro=U.avg(ROLES.map(r=>lineup[r]?lineup[r].st.macro:70));

  const metaFit={early:'early',teamfight:'fight',scale:'scale',split:'poke'}[tactic]===meta.k?0.8:0;
  ['early','mid','late'].forEach(k=>{ph[k]+=mc*0.3+(coh-75)*0.05});
  if(!ctx.compOnly&&typeof tacFam==='function'){const tf=tacFam(code,tactic);['early','mid','late'].forEach(k=>ph[k]+=tf)}
  if(tactic==='early'){ph.early+=2+tb+metaFit;ph.mid+=0.5;ph.late-=1.5}
  if(tactic==='teamfight'){const f=(tg.G+tg.T)*0.35;ph.early-=1;ph.mid+=0.8+f+tb+metaFit;ph.late+=0.6+f}
  if(tactic==='scale'){ph.early-=1.5;ph.mid+=0;ph.late+=2.2+tb+metaFit+tg.S*0.2}
  if(tactic==='split'){const f=(macro-85)*0.12+tg.L*0.6;ph.mid+=f+tb+metaFit;ph.late+=f*0.7;ph.early-=0.3}
  const mu=matchupInfo(picks,ctx.enemy);

  mu.syn.forEach(([a,b])=>{ph.mid+=0.6;ph.late+=0.6;const ra=ROLES.find(r=>picks[r]===a),rb=ROLES.find(r=>picks[r]===b);if(['ADC','SUP'].includes(ra)&&['ADC','SUP'].includes(rb))ph.early+=0.4});
  mu.comp.forEach(n=>{ph[n.ph]+=n.v});
  return {code,lineup,picks,ph,tags:tg,chem,coh,macro,tactic,focusId,mu};
}

const DRAFT_ORDER=[

function aiBan(d,side){
  const enemy=d.codes[1-side];const lu=starters(enemy);const tk=draftTaken(d);const eo=openRoles(d,1-side);const memo=d.ser;
  const key=ROLES.map(r=>lu[r]).filter(Boolean).sort((a,b)=>ovr(b)-ovr(a))[0];

  CHAMP_LIST.forEach(c=>{if(tk.has(c))return;const ch=CHAMPS[c];
    const bm=enemy===S.myTeam?(typeof diff==='function'?diff().ban||1:1):1;let threat=-5;
    ch.roles.forEach(r=>{const p=lu[r];if(!eo.includes(r)||!p)return;let v=(mastery(p,c)-78)*0.16*bm;
      // 핵심 선수 겨냥: 상대 최고 선수 · 그 선수의 주력(시그니처) 챔피언은 우선 순위가 올라감

function pickScore(d,side,c,r){

  let sc=TIER_SCORE[tierLetter(c)]*2.1+(mastery(lu[r],c)-75)*0.13;if(isFlex(c,r)&&mastery(lu[r],c)<85)sc-=1.6;

  return sc;
}

  surprise(slot,i){
    const e=1-i;const a=this.prof[i].lineup,b=this.prof[e].lineup;const L=x=>U.logi(x/K_FIGHT);const nm=p=>p?p.name:'-';
    if(slot==='grubs'){const pd=sub(a.JUG,'path')-sub(b.JUG,'path'),sd=sub(a.JUG,'smite')-sub(b.JUG,'smite');
      if(pd>=2||sd>=4)return {id:'counterjg',name:'상대 정글 동선 역이용',sp:true,desc:`${nm(a.JUG)}의 정글 동선 ${sub(a.JUG,'path')}·강타 ${sub(a.JUG,'smite')} vs ${nm(b.JUG)} ${sub(b.JUG,'path')}·${sub(b.JUG,'smite')}. 상대 정글러를 노려 유충과 정글 주도권을 한 번에 가져옵니다.`,p:L(this.edge(i,'early')+pd*0.35+sd*0.12-0.3)}}
    if(slot==='mid'){const roam=sub(a.MID,'roam'),tp=sub(a.TOP,'tp');const wv=(sub(b.ADC,'wave')+sub(b.SUP,'vision'))/2;
      if(roam>=84&&roam-wv>=0)return {id:'roamdive',name:'미드 로밍으로 바텀 다이브',sp:true,desc:`${nm(a.MID)}의 로밍 ${roam} vs 상대 바텀 웨이브·시야 ${Math.round(wv)}. 미드를 비우고 바텀을 급습해 포탑과 드래곤을 노립니다.`,p:L(this.edge(i,'mid')+(roam-wv)*0.22+0.4)};
      if(tp>=84)return {id:'tpflank',name:'탑 텔레포트 측면 기습',sp:true,desc:`${nm(a.TOP)}의 텔레포트 판단 ${tp}. 드래곤 한타에 상대 뒤쪽으로 텔레포트해 합류합니다. 실패하면 탑 라인을 크게 손해 봅니다.`,p:L(this.edge(i,'mid')+(tp-80)*0.2+0.3)}}
    if(slot==='baron'){const vd=U.avg(ROLES.map(r=>sub(a[r],'vision')))-U.avg(ROLES.map(r=>sub(b[r],'vision')));const sc=U.avg(ROLES.map(r=>sub(a[r],'shotcall')));
      if(vd>=1.5)return {id:'bait',name:'바론 치는 척 유인',sp:true,desc:`팀 시야 장악 우위 ${vd>0?'+':''}${vd.toFixed(1)}, 오더 ${Math.round(sc)}. 바론을 치는 척 상대를 끌어들여 시야 밖에서 덮칩니다.`,p:L(this.edge(i,'late')+vd*0.45+(sc-82)*0.1+0.5)}}
    if(slot==='final'){const sup=sub(a.SUP,'hook'),bu=sub(a.MID,'burst');const att=Math.max(sup,bu);const sv=sub(b.ADC,'survive');
      if(att-sv>=4)return {id:'pickoff',name:'핵심 딜러 끊고 시작',sp:true,desc:`${sup>=bu?nm(a.SUP)+'의 CC 적중 '+sup:nm(a.MID)+'의 순간 화력 '+bu} vs 상대 원딜 ${nm(b.ADC)} 생존력 ${sv}. 한타 전에 원딜부터 지우고 들어갑니다.`,p:L(this.edge(i,'late')+(att-sv)*0.2+0.3)}}
    return null;
  }
  // 상황별 추가 선택지 (매 작전 타임마다 일부만 무작위로 등장)
  
  // 약팀의 도박수: 전력·골드가 밀릴수록 등장, 성공 확률은 전력과 무관하게 30~42%
  underdog(slot,i){
    const e=1-i;const pd=this.pow(i)-this.pow(e);const gd=(this.gold[i]-this.gold[e])/1000;const def=Math.max(0,-pd)+Math.max(0,-gd)*0.6;
    if(pd>-1&&gd>-1.2)return null;
    const used=(this.gambles||[0,0])[i];const p=U.clamp(0.3+def*0.012,0.3,0.42)-used*0.07;const a=this.prof[i].lineup;const nm=r=>a[r]?a[r].name:ROLE_KO[r];
    const O={grubs:{name:'3인 기습 갱킹 (도박수)',desc:`${nm('JUG')}·${nm('MID')}·${nm('SUP')} 선수가 동선을 숨기고 상대 바텀을 급습합니다. 상대가 방심한 틈을 노리는 한 수, 성공하면 초반 흐름이 뒤집힙니다. 실패하면 격차가 더 벌어집니다.`},
      mid:{name:'양 사이드 동시 다이브 (도박수)',desc:'드래곤을 미끼로 두고 탑·바텀 포탑을 동시에 다이브합니다. 상대가 드래곤에 모이면 대역전 발판, 읽히면 크게 무너집니다.'},
      baron:{name:'본진 우회 기습 (도박수)',desc:'상대가 바론을 치는 순간 정글을 돌아 뒤를 칩니다. 한 번에 경기를 뒤집을 수 있는 승부수입니다.'},
      final:{name:'캐리 한 명에 올인 (도박수)',desc:`${nm('ADC')}·${nm('MID')}에게 모든 걸 걸고 상대 핵심 딜러부터 지웁니다. 지면 끝, 이기면 역전입니다.`}}[slot];
    return O?{id:'gamble',...O,p,gamble:true,sp:true}:null;
  }
  // 스타 캐리 작전: 팀 최고 선수에게 이 순간을 맡김
  starOpt(slot,i){
    this.carryN=this.carryN||[0,0];if(this.carryN[i]>=1||Math.random()>0.55)return null;
    const e=1-i;const lu=this.prof[i].lineup;const cand=ROLES.map((r,k)=>({r,k,p:lu[r]})).filter(x=>x.p&&(isStar(x.p)||this.spark[i][x.k]||ovr(x.p)>=88));if(!cand.length)return null;
    const c=cand.sort((a,b)=>(this.spark[i][b.k]?5:0)+ovr(b.p)-((this.spark[i][a.k]?5:0)+ovr(a.p)))[0];const r=c.r;
    const key={early:{TOP:'trade',JUG:'gank',MID:'roam',ADC:'kite',SUP:'hook'},mid:{TOP:'tp',JUG:'smite',MID:'burst',ADC:'dps',SUP:'engage'},late:{TOP:'tank',JUG:'smite',MID:'burst',ADC:'dps',SUP:'engage'}}[slot==='grubs'||slot==='lane'?'early':slot==='mid'?'mid':'late'][r];
    const a=this.S(i,r,key),d=this.S(e,r,key);const op=this.prof[e].lineup[r];
    const what={grubs:'유충 싸움을 주도',lane:'라인을 터뜨리러',mid:'드래곤 앞 교전을 열어',baron:'바론 앞에서 경기를',final:'마지막 한타를'}[slot];
    return {id:'carry',name:`${c.p.name}에게 맡긴다`,sp:true,star:true,role:r,key,
      desc:`${c.p.name}의 ${SUB_KO[key]} ${sub(c.p,key)} vs ${op?op.name:'상대'} ${sub(op,key)}${this.spark[i][c.k]?' · 오늘 폼 최고조':''}. ${ROLE_KO[r]}에게 자원을 몰아주고 ${what} 맡깁니다. 막히면 핵심 선수가 잘립니다.`,
      p:U.clamp(duelP(a,d,0.5,9),0.22,0.75)};
  }
  options(slot,i){
    const pool=this._opt(slot,i).concat(this.extraOpts(slot,i));
    // 상황 변수: 전력 차가 확률을 전부 결정하지 않도록 압축 + 그때그때의 변수
    pool.forEach(x=>{if(!x.safe)x.p=U.clamp(0.5+(x.p-0.5)*0.4+U.r(-0.09,0.09),0.08,0.92)});
    const lu=this.prof[i].lineup;let b=0;ROLES.forEach(r=>{if(lu[r])b+=tLv(lu[r],'brain')*0.025});
    b=Math.min(0.08,b)+(this.prof[i].macro-88)*0.003+(U.avg(ROLES.map(r=>sub(lu[r],'shotcall')))-82)*0.003+(this.coh[i]-75)*0.003+(i===this.cfg.userSide&&typeof staffLv==='function'?staffLv('tactic')*0.01:0);
    const sp=[this.underdog(slot,i),this.surprise(slot,i),this.starOpt(slot,i)].filter(Boolean).slice(0,2);
    sp.forEach(x=>{if(!x.gamble)x.p=U.clamp(x.p+b,0.05,0.9)});
    pool.forEach(x=>{if(!x.safe)x.p=U.clamp(x.p+b,0.02,0.97)});
    const safe=pool.filter(x=>x.safe);const keepSafe=safe.length?U.pick(safe):null;
    // 정석(높은 확률) · 과감(낮은 확률) · 그 사이를 고르게 섞어 5개
    const risky=U.shuffle(pool.filter(x=>!x.safe)).sort((x,y)=>y.p-x.p);const want=5-sp.length-(keepSafe?1:0);const pick=[];
    if(risky.length){pick.push(risky.shift());if(risky.length&&want>1)pick.push(risky.pop());while(pick.length<want&&risky.length)pick.push(risky.splice(U.ri(0,risky.length-1),1)[0])}
    const o=pick.sort((x,y)=>y.p-x.p).concat(sp);if(keepSafe)o.push(keepSafe);
    // 우리가 압도적 우위일 때는 상대도 정석 수를 대비함 (강팀으로 너무 쉽게 이기지 않도록)
    if(i===this.cfg.userSide){const ed=this.pow(i,'mid')-this.pow(1-i,'mid')+(this.gold[i]-this.gold[1-i])/1000*0.3;if(ed>1.5)o.forEach(x=>{if(!x.safe&&!x.gamble)x.p-=Math.min(0.08,(ed-1.5)*0.03)})}
    o.forEach(x=>{if(!x.safe)x.p=U.clamp(x.p,0.08,0.85)});return o}
  
  
  
  decide(optId){
    if(!this.decision)return;const d=this.decision;const opt=d.options.find(o=>o.id===optId)||d.options[0];this.decision=null;
    this.resolve(d.slot,d.side,opt);this.rest();
  }
  // ---- 1분 진행
  
  
  
  finalize(){
    if(this.final)return;const dur=this.t;this.final=true;
    let best=null,bs=-1e9;
    this.ps.forEach((side,i)=>side.forEach(p=>{
      p.rating=Math.round(U.clamp(6+(p.k*0.24+p.a*0.1-p.d*0.3)*30/Math.max(25,dur)+(i===this.winner?0.6:-0.5),3,10)*10)/10;
      if(i===this.winner){const sc=p.k*3+p.a*1.1-p.d*1.5+(p.role==='SUP'?2:0)+U.r(0,1.5);if(sc>bs){bs=sc;best=p}}
    }));
    this.pog=best;
    if(best)best.rating=Math.max(best.rating,8.2);
  }
}

// ===== 경기 결과 반영 =====
function applyGame(sim,series){
  const ctx=sim.cfg.ctx||{};try{logPicks(sim)}catch(err){}
  sim.ps.forEach((side,i)=>side.forEach(ps=>{
    const p=P(ps.id);if(!p)return;const won=i===sim.winner;
    if(p.cu&&p.career.g===0&&isLCK(p.team)){news(`[데뷔] ${teamName(p.team)} ${p.name}, 1군 데뷔전${ps.rating>=7.5?` 평점 ${ps.rating.toFixed(1)} 맹활약!`:''}`,p.team===S.myTeam?'big':'league')}p.cu=false;
    [p.season,p.career].forEach(s=>{s.g++;s.k+=ps.k;s.d+=ps.d;s.a+=ps.a});p.season.rs+=ps.rating;
    p.picks=p.picks||{};if(ps.champ)p.picks[ps.champ]=(p.picks[ps.champ]||0)+1;if(p.scout!=null&&p.scout<100)p.scout=Math.min(100,p.scout+6);
    if(sim.pog&&sim.pog.id===p.id){p.season.pog++;p.career.pog++}
    const vol=U.clamp(1.3-(p.st.mental-70)/60,0.6,1.3);p.form=Math.round(U.clamp(p.form*0.7+(ps.rating-6.4)*1.4*vol,-10,10)*10)/10;
    p.cond=U.clamp(p.cond-U.ri(4,7),20,100);
    p.morale=U.clamp(p.morale+(won?3:-3),10,100);
  }));
  trackGame(sim);
  [0,1].forEach(i=>{const lu=sim.prof[i].lineup;CHEM_PAIRS.forEach(([a,b])=>{if(lu[a]&&lu[b])addChem(lu[a].id,lu[b].id,sim.winner===i?0.8:0.4)})});
  if(series){
    series.wins[sim.winner===0?series.sideIdx[0]:series.sideIdx[1]]++;
    ROLES.forEach(r=>{series.used.push(sim.cfg.picks[0][r],sim.cfg.picks[1][r])});
    series.games.push({blue:sim.codes[0],red:sim.codes[1],winner:sim.codes[sim.winner],dur:sim.t,gd15:sim.goldHist[15]||0,dr:[sim.drakes[0].length,sim.drakes[1].length],kills:sim.kills.slice(),pog:sim.pog?{name:sim.pog.name,champ:sim.pog.champ,k:sim.pog.k,d:sim.pog.d,a:sim.pog.a}:null,picks:[{...sim.cfg.picks[0]},{...sim.cfg.picks[1]}],ratings:Object.fromEntries(sim.ps.flat().filter(p=>p.id).map(p=>[p.id,p.rating]))});
  }
}
function newSeries(a,b,bo,stage){return {a,b,bo,stage,wins:[0,0],games:[],used:[],sideIdx:[0,1],done:false,winner:null}}
// 이번 세트의 진영: 1세트는 a 블루, 이후 직전 세트 패배팀이 블루
function seriesSides(s){
  if(!s.games.length)return [s.a,s.b];
  const lastW=s.games[s.games.length-1].winner;const loser=lastW===s.a?s.b:s.a;return [loser,loser===s.a?s.b:s.a];
}
function seriesNeed(s){return Math.ceil(s.bo/2)}
function seriesCtx(s){return {playoff:s.stage!=='RS',bo5:s.bo===5,final:s.stage==='F'||s.stage==='I-F',intl:!!s.intl,setNo:s.games.length+1,memo:typeof seriesMemo==='function'?seriesMemo(s):null}}
function playAutoGame(s){
  const [blue,red]=seriesSides(s);s.sideIdx=[blue===s.a?0:1,blue===s.a?1:0];
  const d=autoDraft(blue,red,fearlessOn(s)?s.used:[],s);
  const sim=new GameSim({blue,red,picks:d.picks,tactics:[aiTactic(d.picks[0]),aiTactic(d.picks[1])],focus:[null,null],userSide:null,ctx:seriesCtx(s),plans:[aiPlan(blue,red),aiPlan(red,blue)]});
  sim.runToEnd();applyGame(sim,s);return sim;
}
function finishSeriesIfDone(s){
  const need=seriesNeed(s);
  if(s.wins[0]>=need||s.wins[1]>=need){s.done=true;s.winner=s.wins[0]>=need?s.a:s.b;return true}return false;
}
function playSeriesAuto(s){while(!finishSeriesIfDone(s))playAutoGame(s);recordSeries(s);return s}
function recordSeries(s){
  if(s.recorded)return;s.recorded=true;
  const loser=s.winner===s.a?s.b:s.a;const ws=s.winner===s.a?s.wins[0]:s.wins[1];const ls=s.winner===s.a?s.wins[1]:s.wins[0];
  if(s.stage==='RS'){T(s.winner).w++;T(loser).l++;T(s.winner).pts=(T(s.winner).pts||0)+(isCup()&&s.bo===5?2:1);T(s.winner).sw+=ws;T(s.winner).sl+=ls;T(loser).sw+=ls;T(loser).sl+=ws;
    S.results.push({week:S.week,a:s.a,b:s.b,winner:s.winner,score:`${s.wins[0]}:${s.wins[1]}`})}
  T(s.winner).fans=U.clamp(T(s.winner).fans+0.6,10,150);
  roster(s.winner).forEach(p=>p.morale=U.clamp(p.morale+2,10,100));
  roster(loser).forEach(p=>p.morale=U.clamp(p.morale-2,10,100));
  try{recordH2H(s);recordRivals(s);if(s.a===S.myTeam||s.b===S.myTeam)checkMilestones(S.myTeam)}catch(err){}
  if(s.a===S.myTeam||s.b===S.myTeam){
    const won=s.winner===S.myTeam;const opp=s.a===S.myTeam?s.b:s.a;
    const gap=teamOvr(opp)-teamOvr(S.myTeam);
    S.trust=U.clamp(S.trust+(won?1.5+Math.max(0,gap)*0.2:-1.5-Math.max(0,-gap)*0.2),0,100);
    S.streak=won?Math.max(1,S.streak+1):Math.min(-1,S.streak-1);
    news(`${won?'승리':'패배'} · ${teamName(S.myTeam)} ${ws===undefined?'':(won?ws+':'+ls:ls+':'+ws)} ${teamName(opp)}`,won?'win':'loss');
  }
}

function standings(){
  if(isCup())return lckCodes().map(T).sort((a,b)=>(b.pts||0)-(a.pts||0)||(b.sw-b.sl)-(a.sw-a.sl)||b.sw-a.sw||teamOvr(b.code)-teamOvr(a.code)).map(t=>t.code);
  return lckCodes().map(T).sort((a,b)=>b.w-a.w||(b.sw-b.sl)-(a.sw-a.sl)||b.sw-a.sw||teamOvr(b.code)-teamOvr(a.code)).map(t=>t.code);

function doTraining(key){
  if(S.weekState.trained)return null;const tr=TRAINING[key];S.weekState.trained=key;
  const ups=[];const lu=starters(S.myTeam);const all=roster(S.myTeam);
  all.forEach(p=>{
    const isStarter=Object.values(lu).some(x=>x&&x.id===p.id);
    p.cond=U.clamp(p.cond+(tr.cond||0),15,100);if(tr.morale)p.morale=U.clamp(p.morale+tr.morale,10,100);if(tr.form)p.form=U.clamp(p.form+tr.form,-10,10);
    const mult=growMul(p,isStarter);
    const gain=(stat,amt)=>addExp(p,stat,amt,mult,ups);
    if(key==='meta'){Object.keys(p.mastery).forEach(c=>{const L=tierLetter(c);if(L==='S'||L==='A')p.mastery[c]=Math.min(99,p.mastery[c]+U.ri(6,11))});gain('pool',14)}
    else if(key==='scrim'){U.shuffle(STAT_KEYS).slice(0,3).forEach(s=>gain(s,U.ri(9,15)))}
    else if(tr.stat){gain(tr.stat,U.ri(18,30))}
    if(key!=='rest')focusTrain(p,U.ri(12,18),mult,ups);
  });
  if(tr.chem){const ids=all.map(p=>p.id);for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)addChem(ids[i],ids[j],tr.chem)}
  news(`주간 훈련: ${tr.name}${ups.length?' · ▲ '+ups.slice(0,4).join(', ')+(ups.length>4?` 외 ${ups.length-4}건`:''):''}`,'train');
  return ups;
}

function rollEvent(){
  if(S.phase!=='regular'){S.weekState.event=null;return}
  const pool=EVENTS.filter(e=>!e.cond||e.cond());const story=pool.filter(e=>e.story);const ev=story.length&&Math.random()<0.6?U.pick(story):U.pick(pool.filter(e=>!e.story).length?pool.filter(e=>!e.story):pool);
  const inst={id:ev.id,resolved:false};if(ev.setup)ev.setup(inst);
  S.weekState.event=inst;
}
function eventDef(inst){return EVENTS.find(e=>e.id===inst.id)}
// 주간 루틴 자동: 지난 훈련 반복 + 사소한 이슈는 코치 기본 선택 (선수 이야기 이벤트는 직접)
const AUTO_EV={ad:1,newchamp:0,conflict:0,fanmeet:1,intl:1,tired:0,scout:1,stream:0,bbq:0,tactic:0,academy:1,slump:0};
function autoRoutine(){if(!S.autoRoutine||S.phase!=='regular')return;const ws=S.weekState;const done=[];
  if(!ws.trained&&typeof applyPlan==='function'){applyPlan();done.push('주간 훈련 일정')}
  else if(S.lastTrain&&!ws.trained&&TRAINING[S.lastTrain]){doTraining(S.lastTrain);done.push(TRAINING[S.lastTrain].name)}
  const ev=ws.event;if(ev&&!ev.resolved&&AUTO_EV[ev.id]!=null){const def=eventDef(ev);resolveEvent(AUTO_EV[ev.id]);done.push(`이슈 '${def.opts[AUTO_EV[ev.id]].label}'`)}
  if(done.length)ws.autoDone=done.join(' · ')}
function fillEv(str,inst){const p=inst.pid?P(inst.pid):null;return str.replace(/\{p\}/g,p?p.name:'').replace(/\{c\}/g,inst.champ||'')}
function resolveEvent(idx){const inst=S.weekState.event;if(!inst||inst.resolved)return;const def=eventDef(inst);const o=def.opts[idx];o.run(inst);inst.resolved=true;inst.choice=idx;
  news(`${fillEv(def.title,inst)} → ${o.label}`,'event')}

// ---- 로드 투 MSI: 1·2위전 승자 1번 시드, 패자 vs 3·4위전 승자 → 2번 시드
function startRTM(){

  news(`1~2라운드 종료! 로드 투 MSI: ${abv(st[0])} vs ${abv(st[1])} (승자 MSI 직행) · ${abv(st[2])} vs ${abv(st[3])}`,'big');

function completeRTM(){
  const po=S.playoff;const r=po.rounds[po.round];r.matches.forEach(m=>{if(!m.done)playSeriesAuto(m)});
  if(po.round===0){const [m1,m2]=r.matches;const l1=m1.winner===m1.a?m1.b:m1.a;po.first=m1.winner;po.rounds[1].matches=[newSeries(l1,m2.winner,5,'RTM3')];po.round=1;

  const m=r.matches[0];S.msiSeeds=[po.first,m.winner];S.rtm={seeds:po.seeds,rounds:po.rounds,first:po.first,second:m.winner};S.rtmDone=true;S.playoff=null;
  if(S.msiSeeds.includes(S.myTeam))S.trust=U.clamp(S.trust+3,0,100);

function _completeRound(){
  if(S.playoff&&S.playoff.kind==='rtm'){completeRTM();return}
  const r=currentRound();r.matches.forEach(m=>{if(!m.done)playSeriesAuto(m)});
  const po=S.playoff;const seeds=po.seeds;
  if(po.round===0){
    const w=r.matches.map(m=>m.winner).sort((a,b)=>seeds.indexOf(a)-seeds.indexOf(b));
    po.rounds[1].matches=[newSeries(seeds[0],w[1],5,'SF'),newSeries(seeds[1],w[0],5,'SF')];
    news(`4강 대진: ${seeds[0]} vs ${w[1]}, ${seeds[1]} vs ${w[0]}`,'big');
  }else if(po.round===1){
    const w=r.matches.map(m=>m.winner);po.rounds[2].matches=[newSeries(w[0],w[1],5,'F')];
    news(`결승 대진 확정: ${teamName(w[0])} vs ${teamName(w[1])}`,'big');
  }else{
    S.champion=r.matches[0].winner;endSplit();return;
  }

function myPlace(){
  const po=S.playoff;if(!po)return 7;const me=S.myTeam;
  if(!po.seeds.includes(me))return 7;
  if(S.champion===me)return 1;
  const f=po.rounds[2].matches[0];if(f&&(f.a===me||f.b===me))return 2;
  if(po.rounds[1].matches.some(m=>m.a===me||m.b===me))return 3;
  return 5;
}

  const g=S.goal;let met=g.rank?rank<=g.rank||place<=5:place<=g.place;
  let dt=met?12:(place-g.place>=3?-22:-10);if(place===1)dt+=15;if(dt<0)dt=Math.round(dt*diff().trust);prizeLeague(place);
  S.trust=U.clamp(S.trust+dt,0,100);

}
function prepareOffseason(kind){

  fundsInit();negoReset();windowIncome();try{streamerIncome();scoutRefresh();S.scoutC.pts=Math.max(S.scoutC.pts,3)}catch(e){}makeCoachPool();if(kind!=='cup')rollOffers();
  const yearEnd=kind==='year';
  if(kind!=='cup')Object.values(S.players).forEach(p=>{if(!p.team&&!S.fa.includes(p.id))return;const g=grow(p,yearEnd);if(p.team===S.myTeam&&(g.dv||g.stage))S.offseason.growth.push([p.id,g.dv,g.stage])});
  if(kind!=='cup')try{s2Offseason(yearEnd?'year':kind)}catch(err){}
  Object.values(S.players).forEach(p=>{if(p&&p.team&&!p.retired)p.oh=(p.oh||[]).concat([[S.year,S.split,ovr(p)]]).slice(-14)});
  if(yearEnd){

      if(p.contract<=0){

        else if(tLv(p,'legend')||Math.random()<(typeof stayProb==='function'?stayProb(p):U.clamp(0.62+(ovr(p)-85)*0.04,0.4,0.95))){p.contract=U.ri(1,3);p.salary=salaryFor(ovr(p))}
        else{releasePlayer(p.id,true)}
      }});
  }
  if(yearEnd)S.offseason.retired=retirements();

    U.shuffle(ROLES).slice(0,3).forEach(r=>{const rk=makeRookie(r,q);rk.scout=U.ri(35,60);rk.potBias=Math.random();S.fa.push(rk.id)});

}

function growMul(p,isStarter){const st=stageOf(p);return (typeof hidGrow==='function'?hidGrow(p):1)*(p.team===S.myTeam&&typeof staffLv==='function'?1+staffLv('lane')*0.04+(p.squad==='academy'?facBonus('academy'):facBonus('train')):1)*(1+0.5*tLv(p,'prospect'))*(1+Math.max(0,p.pot-ovr(p))/20)*(isStarter?1:0.8)*({grow:1.3,prime:1,vet:0.6,twilight:0.4}[st])*(ovr(p)>=93?0.6:ovr(p)>=90?0.8:1)}

function trackGame(sim){
  const minFor=i=>Math.min(0,...sim.goldHist.map(v=>i===0?v:-v));
  sim.feed.forEach(e=>{const sk=e.d&&(e.d.kind==='solo'||(e.d.kind==='fb'&&e.d.ctx==='solo'));if(sk&&e.kills&&e.kills[0]){const r=e.kills[0];const p=P(sim.ps[r.side][r.k].id);if(p)p.season.solo++}});
  const w=sim.winner;const cb=minFor(w)<=-6000;
  sim.ps.forEach((side,i)=>side.forEach(ps=>{const p=P(ps.id);if(!p)return;migratePlayer(p);
    if(ps.rating<4.6)p.season.low++;if(ps.rating>=7.5)p.season.high++;
    if(i===w&&cb)p.season.cb++;
    if(sim.pog&&sim.pog.id===p.id&&sim.cfg.ctx&&sim.cfg.ctx.playoff)p.season.ppog++}));
}
function foreignSplit(){

  Object.values(S.players).forEach(p=>{if(!p.team||isLCK(p.team))return;migratePlayer(p);
    const strong=ovr(p)>=88;if(Math.random()<(strong?0.35:0.2)){const best=['laning','teamfight','macro','mental'].sort((a,b)=>p.st[b]-p.st[a])[0];

    if(Math.random()<0.25)bumpBest(p,1)});

function splitTraits(){
  foreignSplit();

    const need=(k,base)=>base*(1+0.5*tLv(p,k));
    if(s.g>=4&&s.solo>=need('laner',4))gainTrait(p,'laner',`시즌 솔로킬 ${s.solo}회`);

function grow(p,yearEnd){

}

function awardTo(p,label,fx,pts){if(!p)return;migratePlayer(p);p.awards.push(`${splitName()} ${label}`);p.yearPts+=pts||0;if(fx)fx(p);p.primeExt=Math.min(PRIME_CAP,p.primeExt)}

  const all=Object.values(S.players).filter(p=>p.team&&isLCK(p.team)&&p.season.g>0);all.forEach(migratePlayer);

    fmvp=roster(S.champion).filter(p=>cnt[p.id]).sort((a,b)=>sum[b.id]/cnt[b.id]-sum[a.id]/cnt[a.id])[0]||null}
  const roy=all.filter(p=>p.rookie&&p.yrs<=1&&p.season.g>=4&&!p.awards.some(a=>a.includes('신인상'))).sort((a,b)=>score(b)-score(a))[0]||null;
  // 보상
  all.forEach(p=>{p.yearPts+=Math.max(0,p.season.rs/p.season.g-6)});
  roster(S.champion).forEach(p=>p.yearPts+=2);
  if(mvp){mvp.career.mvp++;awardTo(mvp,'정규시즌 MVP',p=>{bumpBest(p,2);p.morale=Math.min(100,p.morale+10);p.primeExt++},5)}
  if(fmvp)awardTo(fmvp,'결승 MVP',p=>{p.st.mental=Math.min(99,p.st.mental+1);p.st.teamfight=Math.min(99,p.st.teamfight+1);p.primeExt++;gainTrait(p,'clutch','결승 MVP')},4);
  ROLES.forEach(r=>{if(allPro[r])awardTo(allPro[r],`올-LCK (${ROLE_KO[r]})`,p=>bumpBest(p,1),3)});
  if(pogKing)awardTo(pogKing,'POG 1위',null,2);
  if(roy)awardTo(roy,'신인상',p=>{p.pot=Math.min(99,p.pot+2)},2);
  let poy=null;
  const id=p=>p&&p.id;
  const res={mvp:id(mvp),allPro:Object.fromEntries(ROLES.map(r=>[r,id(allPro[r])])),pog:id(pogKing),kda:id(kdaKing),fmvp:id(fmvp),roy:id(roy),poy:id(poy)};
  S.awardHist=S.awardHist||[];S.awardHist.push({label:splitName(),champion:S.champion,mvp:mvp&&mvp.name,fmvp:fmvp&&fmvp.name,roy:roy&&roy.name,poy:poy&&poy.name,mvpT:mvp&&mvp.team,fmvpT:fmvp&&fmvp.team,poyT:poy&&poy.team});

}

  const groups={};active.forEach(c=>{const k=r.rec[c].join('-');(groups[k]=groups[k]||[]).push(c)});
  const keys=Object.keys(groups).sort((a,b)=>b.split('-')[0]-a.split('-')[0]||a.split('-')[1]-b.split('-')[1]);
  const pairs=[];let carry=[];const playedSet=new Set(r.played);
  keys.forEach(k=>{let pool=U.shuffle(carry.concat(groups[k]));carry=[];
    while(pool.length>1){const a=pool.shift();let j=pool.findIndex(b=>!playedSet.has([a,b].sort().join('|'))&&!(r.swiss.length===0&&intlRegionClash(a,b)));
      if(j<0)j=pool.findIndex(b=>!playedSet.has([a,b].sort().join('|')));if(j<0)j=0;const b=pool.splice(j,1)[0];pairs.push([a,b])}
    carry=pool});

function seedOrder(list){return [list[0],list[7],list[3],list[4],list[1],list[6],list[2],list[5]]}

  for(let i=0;i<8;i+=2){if(intlRegionClash(o[i],o[i+1])){for(let j=1;j<8;j+=2){if(j===i+1)continue;const ai=o[i],bj=o[j],pj=o[j-1];if(!intlRegionClash(ai,bj)&&!intlRegionClash(pj,o[i+1])){[o[i+1],o[j]]=[o[j],o[i+1]];break}}}}
  r.stage='ko';r.ko={cur:0,rounds:[{name:'8강',matches:[0,2,4,6].map(i=>intlSeries(o[i],o[i+1],5,'I-QF'))},{name:'4강',matches:[]},{name:'결승',matches:[]}]};

function tradeValue(p){const st=stageOf(p);return Math.pow(Math.max(1,ovr(p)-68),1.6)*({grow:1.25,prime:1,vet:0.78,twilight:0.5}[st])*(potRange(p)[1]>ovr(p)+5?1.12:1)*(p.contract<=1?0.9:1)}
function tradeCheck(their,give,cash){
  const code=P(their).team;const t=T(code);const me=T(S.myTeam);const tp=P(their);const gp=give.map(P);
  const vin=gp.reduce((s,p)=>s+tradeValue(p),0)+cash*2.2,vout=tradeValue(tp);
  const need=1.1+diff().trade+(tLv(tp,'legend')?0.25:0);
  const ratio=vin/Math.max(1,vout);
  // 포지션 공백 체크
  const theirAfter=t.roster.filter(x=>x!==their).map(P).concat(gp);const mineAfter=me.roster.filter(x=>!give.includes(x)).map(P).concat([tp]);
  const gap=ROLES.find(r=>!theirAfter.some(p=>p.pos===r));const myGap=ROLES.find(r=>!mineAfter.some(p=>p.pos===r));
  const capT=theirAfter.reduce((s,p)=>s+p.salary,0)+(t.academy||[]).map(P).reduce((s,p)=>s+(p.salary||0),0);const capM=payroll(S.myTeam)-gp.reduce((s,p)=>s+p.salary,0)+tp.salary;
  let reason=null;
  if(myGap)reason=`우리 팀 ${ROLE_KO[myGap]} 자리가 비게 됩니다.`;
  else if(gap)reason=`${teamName(code)}: "${ROLE_KO[gap]} 선수가 없어지면 경기를 못 치릅니다."`;
  else if(theirAfter.length>ROSTER_MAX)reason=`${teamName(code)}: "로스터 자리가 부족합니다."`;
  else if(capM>teamCap(S.myTeam))reason=`우리 팀 샐러리캡을 초과합니다.`;
  else if(capT>teamCap(code))reason=`${teamName(code)}: "샐러리캡이 감당이 안 됩니다."`;
  else if(cash>(S.funds||0))reason='구단 자금이 부족합니다.';
  return {ratio,need,reason,ok:!reason&&ratio>=need};
}
function proposeTrade(their,give,cash){
  fundsInit();const tp=P(their);const code=tp.team;S.tradeTries[code]=(S.tradeTries[code]||0)+1;
  if(S.tradeTries[code]>3)return {ok:false,msg:`${teamName(code)}: "이번 이적 시장에서는 더 이상 이야기하지 않겠습니다."`};
  const c=tradeCheck(their,give,cash);
  if(c.reason)return {ok:false,msg:c.reason};
  if(c.ratio<c.need){const gapTxt=c.ratio<c.need*0.7?'터무니없는 제안입니다.':c.ratio<c.need*0.9?'저희가 손해 보는 거래네요. 조금 더 얹어주셔야 합니다.':'거의 다 왔습니다. 조금만 더 맞춰주세요.';
    return {ok:false,msg:`${teamName(code)}: "${gapTxt}"`}}
  const t=T(code),me=T(S.myTeam);const gp=give.map(P);
  t.roster=t.roster.filter(x=>x!==their);Object.keys(t.lineup).forEach(r=>{if(t.lineup[r]===their)delete t.lineup[r]});
  me.roster=me.roster.filter(x=>!give.includes(x));Object.keys(me.lineup).forEach(r=>{if(give.includes(me.lineup[r]))delete me.lineup[r]});
  gp.forEach(p=>{p.team=code;p.promise=false;t.roster.push(p.id);t.roster.forEach(o=>{if(o!==p.id)S.chem[chemKey(o,p.id)]=U.ri(52,62)})});
  tp.team=S.myTeam;me.roster.push(their);me.roster.forEach(o=>{if(o!==their)S.chem[chemKey(o,their)]=U.ri(52,62)});
  if(cash)addFunds(-cash,'트레이드 현금');
  news(`[트레이드] ${teamName(S.myTeam)} ↔ ${teamName(code)}: ${tp.name} 영입, ${gp.map(p=>p.name).join('·')}${cash?` + ${cash}억`:''} 이적`,'transfer');
  return {ok:true};
}

  return U.shuffle(out).slice(0,5).map(c=>{const rich=regionOf(c)==='LPL'?1.3:isLCK(c)?1:0.85;const max=Math.round(v*rich*U.r(0.95,1.3));return {club:c,offer:Math.round(max*U.r(0.6,0.8)),max,patience:100,status:'open',log:[{w:'club',t:`${teamName(c)}: "${p.name} 선수 이적료로 ${0}억을 제시합니다."`}]}}).map(b=>{b.log[0].t=b.log[0].t.replace('0억',b.offer+'억');return b});
}
function saleStart(pid){const p=P(pid);if(!p||p.team!==S.myTeam)return {ok:false,msg:'우리 선수가 아닙니다.'};if(S.phase!=='offseason')return {ok:false,msg:'판매는 이적 시장이 열렸을 때만 가능해요.'};
  if(roster(S.myTeam).length<=5)return {ok:false,msg:'1군은 최소 5명이 필요해요.'};
  S.sales=S.sales||{};if(S.sales[pid]&&S.sales[pid].status==='open')return {ok:true};
  const buyers=saleBuyers(p);if(!buyers.length)return {ok:false,msg:`${p.name} 선수에게 관심을 보이는 구단이 없어요.`};
  S.sales[pid]={pid,status:'open',buyers,value:saleValue(p)};news(`[이적 시장] ${p.name} 선수 판매 협상 시작 · 관심 구단 ${buyers.length}곳`,'transfer');return {ok:true}}
function saleCounter(pid,ci,ask){const s=S.sales&&S.sales[pid];const p=P(pid);if(!s||s.status!=='open')return {ok:false,msg:'협상 중이 아닙니다.'};const b=s.buyers[ci];if(!b||b.status!=='open')return {ok:false,msg:'이 구단과는 협상이 끝났어요.'};
  b.log.push({w:'me',t:`이적료 ${ask}억 요구`});
  if(ask<=b.offer)return saleAccept(pid,ci,ask);
  if(ask<=b.max){if(Math.random()<0.75||ask<=b.max*0.9){b.offer=ask;return saleAccept(pid,ci,ask)}}
  b.patience-=ask>b.max*1.25?45:25;
  if(b.patience<=0){b.status='fail';b.log.push({w:'club',t:`${teamName(b.club)}: "그 금액이면 영입을 포기하겠습니다."`});return {ok:true}}
  b.offer=Math.min(b.max,Math.round(b.offer+(Math.min(ask,b.max)-b.offer)*U.r(0.35,0.6)));
  b.log.push({w:'club',t:`${teamName(b.club)}: "${b.offer}억까지는 올릴 수 있습니다.${b.patience<40?' 이게 마지막 제안입니다.':''}"`});return {ok:true}}
function saleAccept(pid,ci,fee){const s=S.sales[pid];const p=P(pid);const b=s.buyers[ci];fee=fee||b.offer;
  // 선수 동의: 한국 선수의 해외 이적은 가끔 거절
  if(!isLCK(b.club)&&natOf(p)==='KR'&&Math.random()<0.25&&p.morale>50){b.status='fail';b.log.push({w:'agent',t:`${p.name}: "해외 생활은 아직 자신이 없습니다. 이 이적은 원하지 않아요."`});return {ok:true,refused:true}}
  const from=T(S.myTeam);from.roster=from.roster.filter(x=>x!==pid);Object.keys(from.lineup).forEach(r=>{if(from.lineup[r]===pid)delete from.lineup[r]});
  const to=T(b.club);if(to.roster.length>=ROSTER_MAX){const worst=roster(b.club).filter(x=>x.pos===p.pos).sort((a,c)=>ovr(a)-ovr(c))[0]||roster(b.club).sort((a,c)=>ovr(a)-ovr(c))[0];if(worst)releasePlayer(worst.id,true)}
  p.team=b.club;p.squad='main';p.contract=Math.max(2,p.contract);p.promise=false;to.roster.push(pid);to.lineup[p.pos]=pid;
  to.roster.forEach(x=>{if(x!==pid)S.chem[chemKey(x,pid)]=U.ri(54,64)});addFunds(fee,`${p.name} 이적료 수입`);ensureLineup(S.myTeam);
  b.log.push({w:'club',t:`${teamName(b.club)}: "${fee}억, 좋습니다. 계약하죠."`});
  b.status='done';s.status='done';s.fee=fee;s.club=b.club;s.buyers.forEach(x=>{if(x!==b&&x.status==='open')x.status='fail'});
  news(`[이적] ${p.name} 선수, 이적료 ${fee}억에 ${(n=>{const c=n.charCodeAt(n.length-1);return n+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28&&(c-0xAC00)%28!==8)?'으로':'로')})(teamName(b.club))} 이적`,'big');return {ok:true,done:true}}

// ===== 공정한 연봉 요구: 시장가 × 활약 × 경력 단계, 현재 연봉에 묶어 급등·급락을 막음 =====
function perfOf(p){const s=p.season||{};const g=s.g||0;const rt=g?s.rs/g:null;let f=0;
  if(rt!=null&&g>=4)f+=U.clamp((rt-6.8)*0.12,-0.15,0.15);if((s.pog||0)>=3)f+=0.04;
  const st=stageOf(p);f+=({grow:0.02,prime:0,vet:-0.05,twilight:-0.14}[st]||0);
  const aw=(p.awards||[]).filter(a=>a.startsWith(String(S.year))).length;f+=Math.min(0.08,aw*0.03);return f}
function fairDemand(p,kind){const mk=salaryFor(ovr(p));const cur=p.salary||mk;let d=mk*(1+perfOf(p))*U.r(0.97,1.06);
  // 현재 연봉 기준 최대 +30%, 최소 -25% (기량이 떨어진 베테랑은 삭감 요구도 받아들임)
  d=U.clamp(d,cur*0.75,cur*1.3);if(kind==='extend')d=Math.max(d,cur*0.9);return Math.max(1,Math.round(d))}

const SUB_GROUP=Object.assign({},...Object.entries(SUBS).flatMap(([g,l])=>l.map(([k])=>({[k]:g}))),...Object.values(ROLE_SUBS).flat().map(([k,,g])=>({[k]:g})));
function subKeys(p){return Object.values(SUBS).flat().map(x=>x[0]).concat((ROLE_SUBS[p.pos]||[]).map(x=>x[0]))}

function sub(p,k){if(!p)return 75;if(!p.off)initSubs(p);const g=SUB_GROUP[k];if(!g)return 75;return U.clamp(Math.round(p.st[g]+(p.off[k]||0)),30,99)}
// 능력치 상승 시 세부 능력치 특화: 집중 항목은 편차 +1 (최대 +12)
function subGrow(p,g){if(!p.off)initSubs(p);const f=p.focus&&p.focus.startsWith('sub:')?p.focus.slice(4):null;
  if(f&&SUB_GROUP[f]===g){p.off[f]=Math.min(12,(p.off[f]||0)+1);return}
  if(Math.random()<0.25){const ks=subKeys(p).filter(k=>SUB_GROUP[k]===g);const k=U.pick(ks);p.off[k]=U.clamp((p.off[k]||0)+1,-12,12)}}

// ---- 경기 컨디션 화살표 (위닝일레븐 방식): -2 최악 ~ +2 최상
const ARROW=[{v:-2,n:'최악',c:'#8b7cf6',rot:90},{v:-1,n:'나쁨',c:'#4aa3ff',rot:45},{v:0,n:'보통',c:'#f2c94c',rot:0},{v:1,n:'좋음',c:'#ff9a3c',rot:-45},{v:2,n:'최상',c:'#ff4d5e',rot:-90}];
// 컨디션·폼·사기의 결정 부분은 전체 평균 대비로 계산해 화살표 분포가 한쪽으로 쏠리지 않게 합니다
function arrowBase(p){return (Math.min(p.cond,95)-75)/18+U.clamp(p.form,-6,6)/4.5+(Math.min(p.morale,90)-65)/28}
function rollArrow(p,mean=0){
  const sd=U.clamp(1.15-(sub(p,'consist')-78)*0.022,0.55,1.65);
  const sc=(arrowBase(p)-mean)*0.8+U.gauss()*sd;
  p.arrow=sc>=1.45?2:sc>=0.5?1:sc>-0.5?0:sc>-1.45?-1:-2;
}
function rollArrows(codes){const ps=[];(codes||Object.keys(S.teams)).forEach(c=>{const t=T(c);if(!t)return;t.roster.forEach(id=>ps.push(P(id)));(t.academy||[]).forEach(id=>ps.push(P(id)))});
  [true,false].forEach(lck=>{const g=ps.filter(p=>isLCK(p.team)===lck);const mean=g.length?U.avg(g.map(arrowBase)):0;g.forEach(p=>rollArrow(p,mean))})}
const ARROW_FX=1.0;const ARROW_TEAM=0.22;

// ---- 공략 지시 (경기 전 선택)
const PLANS={

  ace:{name:'에이스 봉쇄',desc:'상대 최고 선수에게 갱킹과 밴픽 압박을 집중합니다. 그 선수의 영향력은 줄지만 다른 라인은 손해를 감수합니다.'},

const PLAN_LANE={bot:'ADC',top:'TOP',mid:'MID'};
function laneDef(p,role){if(!p)return 75;return role==='ADC'?(sub(p,'survive')+sub(p,'wave'))/2:(sub(p,'wave')+sub(p,'posi'))/2}
// 상대 약점 분석 → 공략 추천과 근거
function lineupGap(a,b){return U.avg(ROLES.map(r=>a[r]?ovr(a[r]):75))-U.avg(ROLES.map(r=>b[r]?ovr(b[r]):75))}
function planInsight(me,opp){
  const a=starters(me),b=starters(opp);const out=[];const gap=lineupGap(a,b);
  const jg=a.JUG,ojg=b.JUG;
  const bot=b.ADC&&b.SUP?(laneDef(b.ADC,'ADC')+sub(b.SUP,'peel'))/2:80;const botAtk=jg&&a.SUP?(sub(jg,'gank')+sub(a.SUP,'hook')+sub(a.SUP,'sroam'))/3:80;
  out.push({k:'bot',v:botAtk-bot,why:`우리 ${jg?jg.name:'정글'} 갱킹 ${jg?sub(jg,'gank'):'-'} · ${a.SUP?a.SUP.name:'서폿'} CC 적중 ${a.SUP?sub(a.SUP,'hook'):'-'} vs 상대 ${b.ADC?b.ADC.name:'원딜'} 생존력 ${b.ADC?sub(b.ADC,'survive'):'-'}`});
  const top=b.TOP?laneDef(b.TOP,'TOP'):80;out.push({k:'top',v:(jg?sub(jg,'gank'):80)-top,why:`우리 정글 갱킹 ${jg?sub(jg,'gank'):'-'} vs 상대 ${b.TOP?b.TOP.name:'탑'} 웨이브 관리 ${b.TOP?sub(b.TOP,'wave'):'-'}`});
  const midv=(a.MID?sub(a.MID,'prio'):80)+(jg?sub(jg,'path'):80)-(b.MID?sub(b.MID,'prio'):80)-(ojg?sub(ojg,'path'):80);
  out.push({k:'mid',v:midv/2,why:`미드 주도권 ${a.MID?sub(a.MID,'prio'):'-'} vs ${b.MID?sub(b.MID,'prio'):'-'}, 정글 동선 ${jg?sub(jg,'path'):'-'} vs ${ojg?sub(ojg,'path'):'-'}`});
  const vis=U.avg(ROLES.map(r=>a[r]?sub(a[r],'vision'):75))-U.avg(ROLES.map(r=>b[r]?sub(b[r],'vision'):75));
  out.push({k:'vision',v:vis*1.2,why:`팀 시야 장악 평균 ${Math.round(U.avg(ROLES.map(r=>a[r]?sub(a[r],'vision'):75)))} vs ${Math.round(U.avg(ROLES.map(r=>b[r]?sub(b[r],'vision'):75)))}`});
  const ace=ROLES.map(r=>b[r]).filter(Boolean).sort((x,y)=>ovr(y)-ovr(x))[0];const sec=ROLES.map(r=>b[r]).filter(Boolean).sort((x,y)=>ovr(y)-ovr(x))[1];
  if(ace)out.push({k:'ace',v:(ovr(ace)-(sec?ovr(sec):ovr(ace)))*0.9-2,why:`상대 에이스 ${ace.name} (${ROLE_KO[ace.pos]} ${ovr(ace)}) 의존도가 높음`,ace:ace.id});
  const inv=U.avg(['SUP','MID','JUG'].map(r=>a[r]?sub(a[r],'engage'):75))-U.avg(['SUP','MID','JUG'].map(r=>b[r]?sub(b[r],'posi'):75));
  out.push({k:'invade',v:inv-4,why:`초반 이니시 판단 ${Math.round(U.avg(['SUP','MID','JUG'].map(r=>a[r]?sub(a[r],'engage'):75)))} vs 상대 포지셔닝 ${Math.round(U.avg(['SUP','MID','JUG'].map(r=>b[r]?sub(b[r],'posi'):75)))}`});
  out.forEach(x=>{if(x.k!=='ace')x.v-=gap});
  return out.sort((x,y)=>y.v-x.v);
}
function aiPlan(me,opp){const ins=planInsight(me,opp);const best=ins[0];return best&&best.v>3&&Math.random()<0.7?best.k:'none'}
// 공략 효과: 경기 시작 시 각 진영 보정 (반환: 초반/중반 보정, 갱킹 라인 가중치)
function planEffect(sim,i){
  const plan=sim.cfg.plans&&sim.cfg.plans[i]||'none';const e=1-i;const a=sim.prof[i].lineup,b=sim.prof[e].lineup;const fx={early:0,mid:0,late:0,lanes:{TOP:1,MID:1,ADC:1},invade:false,ace:null};
  const gap=lineupGap(a,b);const cl=v=>U.clamp(v,-3,3);// 전체 전력 차는 이미 반영되므로, 상대적 약점을 찌를수록 효과
  if(plan==='bot'){const d=(sub(a.JUG,'gank')+sub(a.SUP,'hook'))/2-(laneDef(b.ADC,'ADC')+sub(b.SUP,'peel'))/2-gap;fx.early+=cl(0.6+d*0.13);fx.mid+=cl(0.3+d*0.09);fx.lanes={TOP:0.4,MID:0.8,ADC:2.6}}
  if(plan==='top'){const d=sub(a.JUG,'gank')-laneDef(b.TOP,'TOP')-gap;fx.early+=cl(0.5+d*0.12);fx.mid+=cl(0.3+d*0.09);fx.lanes={TOP:2.6,MID:0.8,ADC:0.5}}
  if(plan==='mid'){const d=(sub(a.MID,'prio')+sub(a.JUG,'path')-sub(b.MID,'prio')-sub(b.JUG,'path'))/2-gap;fx.early+=cl(0.5+d*0.13);fx.mid+=cl(0.3+d*0.1);fx.lanes={TOP:0.8,MID:2.2,ADC:0.8}}
  if(plan==='vision'){const d=U.avg(ROLES.map(r=>sub(a[r],'vision')))-U.avg(ROLES.map(r=>sub(b[r],'vision')))-gap;fx.early-=0.5;fx.mid+=cl(0.7+d*0.13);fx.late+=cl(0.6+d*0.11);fx.vision=d}
  fx.early*=1.6;fx.mid*=1.6;fx.late*=1.6;
  if(plan==='invade')fx.invade=true;
  if(plan==='ace'){const ace=ROLES.map(r=>b[r]).filter(Boolean).sort((x,y)=>ovr(y)-ovr(x))[0];if(ace){fx.ace=ace.id;fx.early-=0.6;fx.mid-=0.2;fx.lanes={TOP:1,MID:1,ADC:1};fx.lanes[ace.pos==='SUP'?'ADC':ace.pos==='JUG'?'MID':ace.pos]=2.4}}
  return fx;
}

// ===== 리그 소식 (타 구단 뉴스) =====
function leagueWeekNews(){

  sim.feed.filter(e=>k(e)==='gamble').forEach(e=>out.push(e.d.ok?(e.side===ms?'감독 도박수 미쳤다 ㅋㅋ 강심장':'상대 도박수 맞아버렸네…'):(e.side===ms?'도박수는 왜 던졌냐고~':'상대 도박수 읽은 거 개좋았다')));
  sim.feed.filter(e=>k(e)==='collapse').forEach(e=>out.push(e.d.att===ms?`${LANE_KO[LANE_KEY[e.d.lane]]} 집중 공략 장인 ㅋㅋ 라인 박살`:`${LANE_KO[LANE_KEY[e.d.lane]]} 라인 그냥 터졌네… 정글 좀 와줘`));
  sim.feed.filter(e=>k(e)==='carry'&&e.d.ok).forEach(e=>out.push(e.side===ms?`${sim.ps[e.side][e.d.who].name}한테 몰아주니까 바로 답 나옴`:`${sim.ps[e.side][e.d.who].name} 혼자 게임함`));
  const gh=sim.goldHist||[0];const mx=Math.max(...gh),mn=Math.min(...gh);const swing=ms===0?mn:-mx;const comeback=won&&swing<-3000;if(comeback)out.push('역전 드라마 ㄹㅇ 소름 돋았다');
  if(won&&!comeback&&sim.t<=25)out.push('그냥 체급 차이. 압도적');if(!won&&sim.t<=25)out.push('오늘은 할 말이 없다… 다음 경기 보자');if(sim.t>=38)out.push('장기전 보다가 심장 멎는 줄');
  if(sim.pog&&sim.codes.indexOf(sim.codes[sim.winner])===ms)out.push(`오늘 POG ${sim.pog.name} 폼 미쳤음`);
  if(!out.length)out.push(won?'깔끔하게 잡았다 굿':'아쉽다 다음엔 이기자');return U.shuffle(out).slice(0,3)}

// ---------- 1. 1–20 속성 ----------
// 세부 능력치(30–99)를 FM식 1–20으로 보여줌. 포지션 전용 3개 포함 20개 + 숨은 속성 4개
const A20_GROUPS=[['라인·기술',['cs','trade','wave','skill','combo','reflex']],['교전',['posi','engage','target']],['운영',['vision','rotate','objective','shotcall']],['정신·폭',['clutch','consist','adapt','range']]];
function a20(v){return U.clamp(Math.round((v-55)/2.2),1,20)}
function attr(p,k){return a20(sub(p,k))}
function attrGroups(p){return A20_GROUPS.concat([['포지션 전용',(ROLE_SUBS[p.pos]||[]).map(x=>x[0])]])}
function a20Col(v){return v>=16?'#e9c46a':v>=11?'#e8ecf5':v>=6?'#9aa6c0':'#ff8a96'}
function a20Tier(v){return v>=16?'월드급':v>=11?'주전급':v>=6?'보통':'약점'}
// 같은 포지션 LCK 주전 평균(캐시)
function a20Avg(pos,k){const c=(V._a20c=V._a20c||{});const key=S.week+'|'+S.year+'|'+pos+'|'+k;if(c[key]!=null)return c[key];
  const ps=lckCodes().map(cd=>starters(cd)[pos]).filter(Boolean);const v=ps.length?U.avg(ps.map(p=>sub(p,k))):75;return c[key]=a20(v)}

const HID_KO={pro:'프로의식',amb:'야망',prs:'압박 대처',inj:'부상 내성'};
function initHid(p){const g=()=>U.clamp(Math.round(11+U.gauss()*3.6),2,20);const h={pro:g(),amb:g(),prs:g(),inj:g()};
  if(tLv(p,'iron'))h.prs=Math.min(20,h.prs+4);if(tLv(p,'clutch'))h.prs=Math.min(20,h.prs+4);if(tLv(p,'streaky'))h.prs=Math.max(2,h.prs-4);
  if(tLv(p,'steady'))h.pro=Math.min(20,h.pro+2);if(tLv(p,'legend')){h.pro=Math.max(h.pro,16);h.prs=Math.max(h.prs,16)}if(tLv(p,'prospect'))h.amb=Math.min(20,h.amb+3);
  if(p.legend||ovr(p)>=93)h.pro=Math.max(h.pro,14);else if(ovr(p)>=85)h.pro=Math.max(h.pro,9);p.hid=h;return h}
function hid(p){return p.hid||initHid(p)}
function personality(p){const h=hid(p);
  if(h.pro>=15&&h.amb>=15)return ['완벽주의자','훈련과 승리 모두에 철저해요. 성장이 빠르지만 대우에도 민감해요.'];
  if(h.prs>=16)return ['강심장','큰 경기일수록 강해요. 플레이오프·결승에서 능력이 올라요.'];
  if(h.amb>=15)return ['야심가','더 큰 무대와 주전 자리를 원해요. 벤치에 오래 두면 불만이 커져요.'];
  if(h.pro>=15)return ['모범생','묵묵히 훈련해요. 꾸준히 성장하고 노장이 돼도 덜 떨어져요.'];
  if(h.prs<=6)return ['긴장형','중요한 경기에서 흔들려요. 칭찬과 믿음이 필요해요.'];
  if(h.pro<=7)return ['자유로운 영혼','재능은 있지만 훈련을 게을리할 때가 있어요.'];
  if(h.amb<=7)return ['느긋함','욕심이 적어 갈등이 없지만 성장도 천천히 해요.'];
  return ['균형형','특별히 튀지 않는 무난한 성격이에요.']}
function hidWord(v){return v>=16?'매우 높음':v>=12?'높음':v>=8?'보통':v>=5?'낮음':'매우 낮음'}

// ---------- 3. 별점 (현재·잠재) ----------
function starVal(o){return U.clamp(Math.round((o-60)/8*2)/2,0.5,5)}
function starHtml(n,dim,compact){const f=Math.floor(n),h=n-f>=0.5;let s='';for(let i=0;i<5;i++)s+=i<f?'★':(i===f&&h?'<span class="hstar">★</span>':(compact?'':'☆'));return `<span class="stars${dim?' dim':''}" role="img" aria-label="별 5개 중 ${n}개">${s}</span>`}
function caStars(p){return starVal(ovr(p))}
function paStars(p){const [lo,hi]=potRange(p);return [starVal(lo),starVal(hi)]}
function paHtml(p,compact){const [a,b]=paStars(p);return a===b?starHtml(a,false,compact):`${starHtml(a,false,compact)}<small class="mute">~</small>${starHtml(b,true,compact)}`}

const S2ROLES={
