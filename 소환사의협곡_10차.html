  ADC:[{k:'hyper',n:'하이퍼캐리',a:['dps','cs','posi','survive'],ph:{early:-0.5,mid:0,late:0.9},d:'후반 지속 딜로 끝내는 원딜'},{k:'laner',n:'라인전형',a:['trade','kite','wave','combo'],ph:{early:0.8,mid:0.1,late:-0.4},d:'2대2에서 이득을 쌓는 원딜'},{k:'util',n:'유틸 원딜',a:['engage','target','adapt','consist'],ph:{early:0,mid:0.5,late:0.1},d:'조합을 받쳐 주는 원딜'}],
  SUP:[{k:'engage',n:'엔게이지',a:['hook','engage','reflex','clutch'],ph:{early:0.5,mid:0.3,late:-0.2},d:'이니시로 싸움을 여는 서폿'},{k:'enchanter',n:'인챈터',a:['peel','posi','vision','consist'],ph:{early:-0.3,mid:0,late:0.7},d:'딜러를 지키는 서폿'},{k:'roamsup',n:'로밍 서폿',a:['sroam','vision','rotate','shotcall'],ph:{early:0.1,mid:0.7,late:-0.2},d:'맵을 장악하는 운영형 서폿'}]};
function rolesOf(p){return S2ROLES[p.pos]||[]}
function roleFit(p,r){return Math.round(U.avg(r.a.map(k=>attr(p,k)))/20*5*2)/2}
function bestRole(p){return rolesOf(p).slice().sort((a,b)=>roleFit(p,b)-roleFit(p,a))[0]}
function roleOf(p){const rs=rolesOf(p);let r=p.role&&rs.find(x=>x.k===p.role);if(!r){r=bestRole(p);if(r)p.role=r.k}return r}
// 경기 반영: 역할 성향(구간별 강약) × 적합도
function roleFx(p,ph){const r=roleOf(p);if(!r)return 0;const fit=roleFit(p,r);return U.clamp((fit-3.5)*0.2,-0.5,0.3)+r.ph[ph]*0.8*Math.min(1.2,fit/4)}

// ---------- 5. 루키 세대 ----------
const CLASS_KO={1:'흉작',2:'평년 이하',3:'평년',4:'풍작',5:'황금 세대'};
function rollRookieClass(){const r=Math.random();const g=r<0.12?1:r<0.32?2:r<0.72?3:r<0.92?4:5;S.rookieClass={year:S.year,g};S.rcHist=(S.rcHist||[]).concat([{y:S.year,g}]).slice(-12);
  news(`[루키 세대] ${S.year}년 신인 세대 평가: ${CLASS_KO[g]} ${'★'.repeat(g)}${'☆'.repeat(5-g)}`,g>=4||g<=1?'big':'league');return S.rookieClass}
function rcGrade(){if(!S.rookieClass)rollRookieClass();return S.rookieClass.g}
// 잠재력: 대부분 80대에서 멈추고, 90 이상은 '대형 유망주'만
function s2Pot(o,kind){const g=rcGrade();const r=Math.random();
  if(r<[0,0.004,0.008,0.015,0.025,0.04][g])return U.ri(96,99);
  const big=r<[0,0.05,0.09,0.14,0.2,0.3][g];
  const gap=big?U.ri(16,26):U.ri(3,11)+(g-3);return U.clamp(o+gap,o+1,big?98:Math.min(91,o+14))}

// ---------- 6. 성장 보정 ----------
function hidGrow(p){const h=hid(p);let m=0.8+h.pro*0.011+h.amb*0.006;if(p.motiv&&p.motiv>0)m*=1.15;return m}
// 노장 하락: 프로의식이 높으면 덜 떨어짐, 낮으면 더 떨어짐
function s2Decline(p,st){const h=hid(p);if(st!=='vet'&&st!=='twilight')return;
  if(h.pro>=15&&Math.random()<0.6)p.st.mechanics=Math.min(99,p.st.mechanics+1);
  if(h.pro<=7&&Math.random()<0.5)p.st.mechanics=Math.max(40,p.st.mechanics-1);
  if(h.inj<=6&&Math.random()<0.35)p.st.laning=Math.max(40,p.st.laning-1)}
// 리그 평균 고정: 비시즌마다 LCK 주전 평균이 기준을 넘으면 전체를 조금 되돌림(순위는 그대로)
function lgStarterAvg(){const ps=lckCodes().flatMap(c=>Object.values(starters(c)).filter(Boolean));return ps.length?U.avg(ps.map(ovr)):85}
function leagueAnchor(){if(!S.s2base)S.s2base=Math.max(85,Math.min(85.5,Math.round(lgStarterAvg()*10)/10));const avg=lgStarterAvg();const over=avg-S.s2base;
  S.lgAvgHist=(S.lgAvgHist||[]).concat([{y:S.year,s:S.split,v:Math.round(avg*10)/10}]).slice(-24);
  if(over<0.6)return 0;const d=Math.min(1,over*0.6);
  Object.values(S.players).forEach(p=>{if(!p||p.retired)return;if(!p.team&&!S.fa.includes(p.id))return;
    STAT_KEYS.forEach(k=>{const n=Math.floor(d)+(Math.random()<d%1?1:0);p.st[k]=U.clamp(p.st[k]-n,40,99)});p.pot=Math.max(ovr(p),p.pot-Math.round(d))});
  return d}

// ---------- 7. 멘토링 ----------
const MENTOR_MAX=3;
function mentors(){return (S.mentors=(S.mentors||[]).filter(m=>{const a=P(m.m),b=P(m.s);return a&&b&&a.team===S.myTeam&&b.team===S.myTeam}))}
function canMentor(p){return p&&p.team===S.myTeam&&(p.yrs>=5||ovr(p)>=90)&&!mentors().some(m=>m.m===p.id)}
function canMentee(p){return p&&p.team===S.myTeam&&p.yrs<=3&&!mentors().some(m=>m.s===p.id)}
function mentorFit(a,b){const ha=hid(a),hb=hid(b);let f=0;if(ha.pro>=12)f+=1;if(ha.pro<=7)f-=1;if(ha.amb>=15&&hb.amb>=15)f-=1;if(a.pos===b.pos)f+=1;return f}
function setMentor(mid,sid){const a=P(mid),b=P(sid);if(!canMentor(a))return {ok:false,msg:'멘토는 5년차 이상이거나 능력 90 이상인 우리 선수만 가능해요.'};if(!canMentee(b))return {ok:false,msg:'멘티는 3년차 이하 우리 선수만 가능해요.'};
  if(a.id===b.id)return {ok:false,msg:'같은 선수예요.'};if(mentors().length>=MENTOR_MAX)return {ok:false,msg:`멘토링은 최대 ${MENTOR_MAX}쌍이에요.`};
  S.mentors.push({m:a.id,s:b.id,wk:0});news(`[멘토링] ${a.name} → ${b.name} 멘토링 시작 (궁합 ${['나쁨','보통','좋음','아주 좋음'][U.clamp(mentorFit(a,b)+1,0,3)]})`,'train');return {ok:true}}
function endMentor(sid){S.mentors=mentors().filter(m=>m.s!==sid)}
function mentorWeekly(){mentors().forEach(m=>{const a=P(m.m),b=P(m.s);m.wk++;const fit=mentorFit(a,b);
  if(fit<0&&Math.random()<0.25){a.morale=U.clamp(a.morale-3,10,100);b.morale=U.clamp(b.morale-3,10,100)}
  if(m.wk%3===0){const ks=subKeys(a).filter(k=>subKeys(b).includes(k)).sort((x,y)=>sub(a,y)-sub(a,x)).slice(0,3);const k=U.pick(ks);if(k&&sub(b,k)<sub(a,k)-2&&Math.random()<0.55+fit*0.15){b.off[k]=U.clamp((b.off[k]||0)+1,-14,14);news(`[멘토링] ${b.name}, ${a.name}에게 배운 ${SUB_KO[k]} ${attr(b,k)}`,'train')}
    const hb=hid(b),ha=hid(a);['pro','prs'].forEach(x=>{if(ha[x]>hb[x]+2&&Math.random()<0.35)hb[x]++})}
  if(b.yrs>3)endMentor(b.id)})}

// ---------- 8. 훈련 플래너 · 전술 숙련 ----------
const SESS={scrim:{n:'스크림',bg:'#1d2a48',fg:'#cfe0ff',cond:-5,fam:2,exp:7,chem:0.4,form:0.3},tac:{n:'전술 연습',bg:'#2a2414',fg:'#f3d98f',cond:-3,fam:5,exp:2,chem:0.6},
  ind:{n:'개인 훈련',bg:'#1f2d27',fg:'#b5f0d2',cond:-3,focus:9},vod:{n:'VOD·분석',bg:'#2c1f3a',fg:'#e0d0ff',cond:0,fam:1.5,macro:6,prep:1},
  solo:{n:'솔랭',bg:'#18304a',fg:'#bfe3ff',cond:-2,mech:6,champ:3},rest:{n:'휴식',bg:'#18223a',fg:'#9aa6c0',cond:7,morale:1.2}};
const SESS_ORDER=['scrim','tac','ind','vod','solo','rest'];
const DAYS=['월','화','수','목','금','토','일'],PSLOTS=['오전','오후','저녁'];
const PLAN_TPL={
  match:{n:'경기 주간',cells:[['rest','vod','solo'],['ind','tac','solo'],['vod','scrim','vod'],['ind','scrim','rest'],['tac','ind','rest'],['vod','rest','rest'],['rest','rest','solo']]},
  grow:{n:'성장 집중',cells:[['rest','vod','solo'],['ind','ind','solo'],['ind','scrim','vod'],['ind','scrim','solo'],['ind','tac','rest'],['vod','rest','rest'],['rest','ind','solo']]},
  tactic:{n:'전술 완성',cells:[['rest','vod','solo'],['tac','tac','vod'],['tac','scrim','vod'],['tac','scrim','rest'],['tac','ind','rest'],['vod','rest','rest'],['rest','rest','solo']]},
  recover:{n:'회복 주간',cells:[['rest','rest','solo'],['ind','vod','rest'],['rest','scrim','rest'],['vod','ind','rest'],['tac','rest','rest'],['vod','rest','rest'],['rest','rest','rest']]}};
const INT_KO=['낮음','보통','높음'];
function plan(){if(!S.plan||!S.plan.cells)S.plan={cells:JSON.parse(JSON.stringify(PLAN_TPL.match.cells)),int:1,tpl:'match',tac:'balanced'};return S.plan}
function planCounts(){const c={};plan().cells.forEach(d=>d.forEach(k=>c[k]=(c[k]||0)+1));return c}
function planPreview(){const c=planCounts(),pl=plan();const im=[0.75,1,1.3][pl.int];
  const cond=SESS_ORDER.reduce((s,k)=>s+(c[k]||0)*SESS[k].cond,0)*(pl.int===2?1.25:pl.int===0?0.7:1);
  const fam=SESS_ORDER.reduce((s,k)=>s+(c[k]||0)*(SESS[k].fam||0),0)*im;
  const growth=((c.ind||0)*9+(c.scrim||0)*7+(c.solo||0)*6+(c.vod||0)*6+(c.tac||0)*2)*im;
  const risk=U.clamp(Math.round((-cond-10)*1.6+(pl.int===2?6:0)),0,40);
  return {cond:Math.round(cond),fam:Math.round(fam),growth:Math.round(growth),risk}}
function tacFamOf(t){S.tfam=S.tfam||{};if(S.tfam[t]==null)S.tfam[t]=t==='balanced'?55:35;return S.tfam[t]}
// 경기 반영: 우리 팀은 숙련도에 따라 −0.8 ~ +0.8, AI 팀은 고정 +0.15
function tacFam(code,t){if(code!==S.myTeam)return 0.15;return (tacFamOf(t)-50)/50*0.8}
function applyPlan(){
  if(S.weekState.trained)return null;S.weekState.trained='plan';const pl=plan();const c=planCounts();const im=[0.75,1,1.3][pl.int];
  const all=roster(S.myTeam);const lu=starters(S.myTeam);const ups=[];const pv=planPreview();
  all.forEach(p=>{const isSt=Object.values(lu).some(x=>x&&x.id===p.id);const mult=growMul(p,isSt)*im;
    const ex=(st,amt)=>addExp(p,st,amt,mult,ups);
    if(c.scrim)U.shuffle(STAT_KEYS).slice(0,3).forEach(s=>ex(s,SESS.scrim.exp*c.scrim*0.5));
    if(c.vod)ex('macro',SESS.vod.macro*c.vod*0.6);
    if(c.solo){ex('mechanics',SESS.solo.mech*c.solo*0.5);ex('laning',SESS.solo.mech*c.solo*0.4);Object.keys(p.mastery).filter(k=>p.sig.includes(k)).slice(0,2).forEach(k=>p.mastery[k]=Math.min(99,p.mastery[k]+Math.round(c.solo*0.5)))}
    if(c.tac)ex('teamfight',SESS.tac.exp*c.tac);
    if(c.ind)focusTrain(p,SESS.ind.focus*c.ind*0.55,mult,ups);
    p.cond=U.clamp(p.cond+pv.cond*0.55,15,100);p.morale=U.clamp(p.morale+(c.rest||0)*0.25-(pl.int===2?1.5:0),10,100);if(c.scrim)p.form=U.clamp(p.form+0.15*c.scrim,-10,10);
    // 과부하: 부상 내성이 낮을수록 위험
    const h=hid(p);const risk=pv.risk*(1.4-h.inj*0.04)/100;if(Math.random()<risk){p.form=U.clamp(p.form-2.5,-10,10);p.cond=U.clamp(p.cond-10,15,100);news(`[의료] ${p.name} 선수 과훈련으로 피로 누적 · 컨디션 −10, 폼 ↓`,'event')}
    if(p.motiv>0)p.motiv--});
  if(c.scrim||c.tac){const ids=all.map(p=>p.id);const ch=(c.scrim||0)*SESS.scrim.chem+(c.tac||0)*SESS.tac.chem;for(let i=0;i<ids.length;i++)for(let j=i+1;j<ids.length;j++)addChem(ids[i],ids[j],ch*0.3)}
  // 전술 숙련: 연습한 전술은 오르고 나머지는 조금씩 잊음
  const t=pl.tac||'balanced';Object.keys(TACTICS).forEach(k=>{const v=tacFamOf(k);S.tfam[k]=k===t?Math.min(100,v+pv.fam*0.4):Math.max(20,v-1.5)});
  news(`주간 훈련 (${PLAN_TPL[pl.tpl]?PLAN_TPL[pl.tpl].n:'직접 구성'} · 강도 ${INT_KO[pl.int]}) · ${TACTICS[t].name} 숙련 ${Math.round(S.tfam[t])}%${ups.length?' · ▲ '+ups.slice(0,3).join(', ')+(ups.length>3?` 외 ${ups.length-3}건`:''):''}`,'train');
  return ups}

// ---------- 9. 면담 ----------
function benchWeekly(){const lu=starters(S.myTeam);const ids=new Set(Object.values(lu).filter(Boolean).map(p=>p.id));
  roster(S.myTeam).forEach(p=>{p.bench=ids.has(p.id)?0:(p.bench||0)+1;if(p.promiseStart&&S.week>p.promiseStart){if(!ids.has(p.id)){p.morale=U.clamp(p.morale-25,10,100);news(`[면담] ${p.name}: "약속하셨잖아요…" 출전 약속을 어겨 사기가 크게 떨어졌습니다`,'loss')}p.promiseStart=null}})}
function talkGen(){S.talks=(S.talks||[]).filter(t=>!t.done&&P(t.pid)&&P(t.pid).team===S.myTeam);if(S.talks.length>=2)return;
  const has=pid=>S.talks.some(t=>t.pid===pid);
  roster(S.myTeam).forEach(p=>{if(S.talks.length>=2||has(p.id))return;const h=hid(p);
    if((p.bench||0)>=(h.amb>=14?2:3)&&p.morale<70&&Math.random()<0.6)S.talks.push({id:S.nextId++,pid:p.id,kind:'playtime',w:S.week});
    else if(p.form<=-4&&Math.random()<0.4)S.talks.push({id:S.nextId++,pid:p.id,kind:'slump',w:S.week});
    else if(p.contract<=1&&ovr(p)>=85&&h.amb>=13&&Math.random()<0.2)S.talks.push({id:S.nextId++,pid:p.id,kind:'contract',w:S.week})})}
const TALK_TXT={playtime:p=>`감독님, ${p.bench}주째 출전을 못 하고 있어요. 제 자리가 어디인지 알고 싶습니다.`,slump:p=>`요즘 경기가 너무 안 풀려요. 뭘 바꿔야 할지 모르겠어요.`,contract:p=>`계약이 얼마 안 남았는데, 구단이 저를 어떻게 생각하는지 궁금해요.`};
function talkOpts(t){const p=P(t.pid);const h=hid(p);const amb=h.amb>=13,pro=h.pro>=13,prs=h.prs>=13;
  const O={playtime:[
    {k:'promise',t:'"다음 경기 선발로 쓸게. 약속할게."',fx:[['사기 ↑↑','up'],['어기면 사기 ↓↓','down'],['같은 포지션 주전 사기 ↓','down']]},
    {k:'prove',t:'"자리는 실력으로 따는 거야. 훈련에서 보여줘."',fx:amb||pro?[['동기 부여 · 성장 +15% (4주)','up'],['사기 ↑','up']]:[['사기 ↓','down'],['성격상 서운해할 수 있음','mid']]},
    {k:'cl',t:'"2군 CL에서 경기 감각부터 살려 보자."',fx:[['폼 회복','up'],['사기 ↓','down'],['2군행','mid']]},
    {k:'list',t:'"원하면 이적도 알아봐 줄게."',fx:[['사기 ↑','up'],['라커룸 동요','down'],['이적 시장 등록','mid']]}],
   slump:[
    {k:'rest',t:'"이번 주는 훈련 줄이고 머리 좀 식히자."',fx:[['컨디션 ↑↑','up'],['폼 ↑','up']]},
    {k:'trust',t:'"믿는다. 그대로 밀고 가."',fx:prs?[['사기 ↑','up'],['폼 ↑','up']]:[['부담감 · 폼 ↓','down'],['사기 ↑','up']]},
    {k:'vod',t:'"영상 같이 보면서 하나씩 고쳐 보자."',fx:[['폼 ↑','up'],['사기 ↑','up']]}],
   contract:[
    {k:'extend',t:'"너는 우리 핵심이야. 비시즌에 제일 먼저 재계약하자."',fx:[['사기 ↑↑','up'],['재계약 요구액 ↓','up']]},
    {k:'raise',t:'"지금 바로 연봉을 올려줄게."',fx:[['연봉 +20%','mid'],['사기 ↑↑','up'],['예산 ↓','down']]},
    {k:'wait',t:'"시즌 끝나고 성적 보고 얘기하자."',fx:amb?[['사기 ↓','down'],['이적 의지 ↑','down']]:[['사기 그대로','mid']]}]};
  return O[t.kind]||[]}
function talkAnswer(tid,k){const t=(S.talks||[]).find(x=>x.id===tid);if(!t)return null;const p=P(t.pid);const h=hid(p);const amb=h.amb>=13,pro=h.pro>=13,prs=h.prs>=13;let msg='';
  const mor=d=>p.morale=U.clamp(p.morale+d,10,100);
  if(k==='promise'){mor(25);p.promiseStart=S.week;const st=starters(S.myTeam)[p.pos];if(st&&st.id!==p.id)st.morale=U.clamp(st.morale-6,10,100);if(p.squad!=='academy'){T(S.myTeam).lineup[p.pos]=p.id}msg=`${p.name}: "감사합니다! 꼭 보여드릴게요."`}
  else if(k==='prove'){if(amb||pro){mor(8);p.motiv=4;msg=`${p.name}: "알겠습니다. 훈련에서 증명할게요."`}else{mor(-8);msg=`${p.name}: "…네, 알겠습니다."`}}
  else if(k==='cl'){const r=sendDown(p.id);mor(-5);p.form=U.clamp(p.form+1.5,-10,10);msg=r.ok?`${p.name} 선수가 2군에서 경기를 뛰게 됩니다.`:`${r.msg}`}
  else if(k==='list'){mor(6);p.listed=true;roster(S.myTeam).forEach(x=>{if(x!==p)x.morale=U.clamp(x.morale-2,10,100)});msg=`${p.name} 선수를 이적 시장에 올렸어요.`}
  else if(k==='rest'){p.cond=U.clamp(p.cond+20,15,100);p.form=U.clamp(p.form+2,-10,10);msg=`${p.name}: "감사해요. 재정비하고 올게요."`}
  else if(k==='trust'){mor(6);p.form=U.clamp(p.form+(prs?1.5:-1),-10,10);msg=prs?`${p.name}: "믿어주셔서 감사합니다!"`:`${p.name}: "…더 잘해야 한다는 생각뿐이에요."`}
  else if(k==='vod'){mor(3);p.form=U.clamp(p.form+1.2,-10,10);msg=`${p.name}: "어디서 꼬였는지 보이네요."`}
  else if(k==='extend'){mor(15);p.raise=Math.min(p.raise||1,0.9);msg=`${p.name}: "구단에 남고 싶어요!"`}
  else if(k==='raise'){mor(18);p.salary=Math.round(p.salary*1.2);msg=`${p.name} 연봉 ${p.salary}억으로 인상`}
  else if(k==='wait'){if(amb){mor(-10);p.raise=Math.max(p.raise||1,1.15)}msg=amb?`${p.name}: "다른 팀 얘기도 들어볼게요."`:`${p.name}: "네, 알겠습니다."`}
  t.done=true;t.ans=k;S.talkLog=(S.talkLog||[]).concat([{y:S.year,w:S.week,pid:p.id,kind:t.kind,ans:k}]).slice(-40);news(`[면담] ${msg}`,'event');return msg}

// 실제 LCK처럼: 계약 만료 FA와 바이아웃(이적료) 중심, 트레이드는 가끔
// =====================================================================

// ---------- 1. 선수의 마음 ----------
function eulo(n){n=String(n);const c=n.charCodeAt(n.length-1);return n+((c>=0xAC00&&c<=0xD7A3&&(c-0xAC00)%28&&(c-0xAC00)%28!==8)?'으로':'로')}
const MOT_KO={money:'연봉',win:'월즈 우승',play:'출전 시간',loy:'구단 충성'};
// 충성심: 타고난 성향 + 한 구단에서 보낸 해(최대 +6)
function loyOf(p){if(p.loyB==null)p.loyB=U.clamp(Math.round(8+U.gauss()*3.5),1,15);
  if(p.tteam!==p.team){const first=p.tteam===undefined;p.tteam=p.team;p.ten=first&&p.team?Math.min(p.yrs||0,U.ri(0,5)):0}
  const base=(p.legend&&p.legend.base)||p.name;return U.clamp(p.loyB+Math.min(6,p.ten||0)+(base==='Faker'?20:0),1,20)}
// 월즈 우승 열망: 야망 + 커리어 단계 + 아직 못 이룬 꿈
function wdOf(p){const h=hid(p);const won=(p.awards||[]).some(a=>/월즈|월드 챔피언십/.test(a))||(p.wtitles||0)>0;
  return U.clamp(Math.round(h.amb*0.55+({grow:1,prime:4,vet:6,twilight:7}[stageOf(p)])+(ovr(p)>=88?3:0)+(won?-3:2)),1,20)}
function motives(p){const w=wantsOf(p);return {money:w==='money'?15:U.clamp(Math.round(7+hid(p).amb*0.2),1,20),win:wdOf(p),play:U.clamp((w==='play'?14:7)+Math.min(5,p.bench||0)+(p.yrs<=2?2:0),1,20),loy:loyOf(p)}}
function motiveTop(p){const m=motives(p);return Object.keys(m).sort((a,b)=>m[b]-m[a])}
// 제안 하나에 대한 선수의 마음 점수 (높을수록 끌림)
function offerAppeal(p,o){const m=motives(p);const ask=Math.max(1,salaryFor(ovr(p)));
  let s=(o.sal/ask-1)*m.money*0.11+(o.start?1:-1)*m.play*0.05+((teamOvr(o.club)-84)/5)*m.win*0.045;
  if(o.club===p.lastTeam||o.club===p.team)s+=m.loy*0.035;
  if(!isLCK(o.club))s+=natOf(p)==='KR'?-0.35+(m.money>=14?0.25:0):0.2;
  return s+U.gauss()*0.08}

// 계약 만료 AI 선수의 잔류 확률: 충성심·우승 가능성·출전 시간
function stayProb(p){const m=motives(p);const st=starters(p.team)[p.pos];const starter=st&&st.id===p.id;
  return U.clamp(0.36+(m.loy-10)*0.035+(teamOvr(p.team)-84)*0.025*(m.win/10)-(starter?0:m.play*0.025)+(ovr(p)>=88?0.05:0),0.12,0.95)}
// ---------- 2. 구단 재정 ----------
function bankOf(c){const t=T(c);if(t.bank==null)t.bank=Math.round(18+Math.min(100,t.fans||50)*0.25);return t.bank}
function bankAdd(c,v){if(c===S.myTeam){addFunds(v);return}T(c).bank=Math.round((bankOf(c)+v)*10)/10}
function capInfo(c){const t=T(c);return {mul:t.capMul||1,until:t.capUntil||0,src:t.capSrc||''}}
// 상금 + 스폰서 인센티브 + 굿즈 (우리 팀은 내역을 소식으로)
const PRIZE2={league:{1:[3,10,0],2:[2,6,0],3:[1,4,0],5:[0,2,0]},worlds:{1:[8,25,12],2:[5,12,5],3:[3,6,2],4:[2,3,1],5:[1,1,0]},msi:{1:[4,12,4],2:[3,6,1],3:[2,3,0],4:[1,2,0],5:[1,0,0]},ewc:{1:[10,6,2],2:[6,3,0],3:[3,1,0],4:[2,0,0],5:[1,0,0]},fst:{1:[2,6,1],2:[1,3,0],3:[1,1,0],4:[0,1,0],5:[0,0,0]}};
// 상금의 절반은 관례대로 선수단 보너스로 나갑니다
function payPrize(c,kind,place,label){const row=(PRIZE2[kind]||{})[place];if(!row)return 0;const [pz0,inc,goods]=row;const bonus=Math.round(pz0*0.5*10)/10;const pz=pz0-bonus;const tot=pz+inc+goods;if(!tot)return 0;
  if(c===S.myTeam){addFunds(tot);news(`[구단 자금] ${label} · 상금 ${pz0}억(선수단 보너스 ${bonus}억 지급)${inc?` · 스폰서 인센티브 ${inc}억`:''}${goods?` · 굿즈 특수 ${goods}억`:''} (구단 +${Math.round(tot*10)/10}억)`,'info');
    if(bonus>0)roster(c).forEach(p=>p.morale=U.clamp((p.morale||70)+2,0,100));
    const fans=place===1?(kind==='worlds'?12:kind==='league'?6:4):place<=2?2:0;if(fans)T(c).fans=Math.min(100,(T(c).fans||50)+fans)}
  else bankAdd(c,tot);return tot}
// 재정 이벤트 (자본 유입 · 긴축)
const FIN_UP=[{n:'사우디 자본 투자',d:'중동 국부펀드 계열 투자사가 지분 투자를 제안했습니다.',cond:'worlds',bank:45,mul:1.35},
  {n:'글로벌 IT 기업 네이밍 스폰서',d:'글로벌 IT 기업이 구단 네이밍 스폰서를 제안했습니다.',cond:'playoff',bank:30,mul:1.25},
  {n:'모기업 투자 확대',d:'모기업이 e스포츠 투자를 늘리기로 했습니다.',cond:'none',bank:20,mul:1.15}];
const FIN_DOWN=[{n:'모기업 예산 삭감',d:'모기업 실적 악화로 구단 예산이 줄어듭니다.',mul:0.85,bank:-10},{n:'메인 스폰서 이탈',d:'메인 스폰서가 계약 연장을 하지 않기로 했습니다.',mul:0.9,bank:-15}];
const COND_KO={worlds:'2년 안에 월즈 진출',playoff:'다음 시즌 플레이오프 진출',none:'조건 없음'};
// 최근 성적 0~1: 우리 팀은 최근 2개 스플릿 순위·목표 달성, AI 팀은 최종 순위
function finSuccess(c){const pl2=x=>x==null?0.4:x<=1?1:x<=2?0.8:x<=3?0.6:x<=5?0.4:0.15;
  if(c===S.myTeam){const h=(S.history||[]).slice(-2);if(!h.length)return 0.5;return U.avg(h.map(x=>Math.min(1,pl2(x.place)+(x.met?0.15:-0.1))))}
  const fs=S.finalStand||[];const i=fs.indexOf(c);return i<0?0.4:pl2(i+1<=2?i+1:i+1<=4?3:i+1<=6?5:7)}
function finRoll(){const out=[];lckCodes().forEach(c=>{const t=T(c);if((t.capUntil||0)>S.year)return;
    if(t.capMul&&t.capMul!==1&&(t.capUntil||0)<=S.year){if(c!==S.myTeam&&t.capSrc)news(`[재정] ${teamName(c)} ${t.capSrc} 계약 종료 · 예산 원상 복귀`,'league');t.capMul=1;t.capSrc=''}
    // 성적 비례: 잘하면 투자 제안, 연달아 부진할 때만 긴축 (긴축은 3년에 한 번 이하)
    const sc=finSuccess(c);const pUp=0.03+0.1*sc;const recentDown=(t.lastDownY||-9)>=S.year-2;const pDown=recentDown?0:(sc<0.25?0.03+0.09*(0.25-sc)*4:sc<0.5?0.015:0);
    const r=Math.random();
    if(r<pDown){t.lastDownY=S.year}
    if(r<pUp&&r>=pDown){const e=U.pick(FIN_UP);if(c===S.myTeam){S.finEv={type:'up',...e,id:S.nextId++};return}
      t.capMul=e.mul;t.capUntil=S.year+2;t.capSrc=e.n;bankAdd(c,e.bank);out.push(c);news(`[재정] ${teamName(c)}, ${e.n} 유치! 예산 ${Math.round((e.mul-1)*100)}% 증액 · 스타 영입 경쟁에 뛰어듭니다`,'big')}
    else if(r<pDown){const e=U.pick(FIN_DOWN);if(c===S.myTeam){S.finEv={type:'down',...e,id:S.nextId++};return}
      t.capMul=e.mul;t.capUntil=S.year+1;t.capSrc=e.n;bankAdd(c,e.bank);news(`[재정] ${teamName(c)} ${e.n} · 고액 연봉 선수 정리가 불가피해 보입니다`,'league')}});
  return out}
function finAnswer(acc){const e=S.finEv;if(!e)return;const t=T(S.myTeam);
  if(e.type==='up'){if(acc){t.capMul=e.mul;t.capUntil=S.year+2;t.capSrc=e.n;addFunds(e.bank,`${e.n} 투자금`);S.finCond={cond:e.cond,until:S.year+(e.cond==='worlds'?2:1),src:e.n};news(`[재정] ${e.n} 유치! 샐러리캡 ${teamCap(S.myTeam)}억 · 조건: ${COND_KO[e.cond]}`,'big')}
    else news(`[재정] ${e.n} 제안을 거절했습니다`,'info')}
  else{if(acc){t.capMul=e.mul;t.capUntil=S.year+1;t.capSrc=e.n;addFunds(e.bank,e.n)}
    else{const cost=Math.round(Math.abs(e.bank)*2.2);addFunds(-cost,`${e.n} 공백을 구단 자금으로 메움`)}}
  e.done=true;S.finEv=null}
// 조건 확인: 시즌이 끝날 때
function finCheck(){const c=S.finCond;if(!c)return;const ok=c.cond==='none'||(c.cond==='playoff'&&S.lastPlace&&S.lastPlace<=5)||(c.cond==='worlds'&&(S.worldsIn||[]).includes(S.year));
  if(ok&&c.cond!=='none'){news(`[재정] ${c.src} 조건 달성! 투자가 이어집니다`,'big');S.finCond=null;return}
  if(S.year>=c.until){const t=T(S.myTeam);t.capMul=0.85;t.capUntil=S.year+1;t.capSrc=c.src+' 철수';S.trust=U.clamp(S.trust-10,0,100);news(`[재정] ${c.src} 조건(${COND_KO[c.cond]}) 미달로 투자 철수 · 다음 시즌 예산 15% 감축, 구단 신뢰 −10`,'loss');S.finCond=null}}

// ---------- 3. 스토브리그 일정 ----------
const MK_DAYS={year:10,mid:4,legacy:6,cup:3};
function mkStart(kind){const days=MK_DAYS[kind]||5;S.mk={kind,day:0,days,log:[],interest:{}};
  // 우승 상금 외 리그 순위 배당 (AI 구단)
  try{(S.finalStand||[]).forEach((c,i)=>{if(c!==S.myTeam)bankAdd(c,[12,8,6,5,4,3,2,2,1,1][i]||1)})}catch(e){}
  if(kind==='year'){try{finRoll()}catch(e){}lckCodes().forEach(c=>roster(c).forEach(p=>{if(p.tteam===p.team)p.ten=(p.ten||0)+1}))}
  mkLog(`${kind==='year'?'스토브리그':'이적 시장'} 개막 준비 · ${days}일 동안 열립니다`,'open')}
function mkLog(t,k,club){S.mk.log.push({d:S.mk.day,t,k:k||'info',c:club||null});if(S.mk.log.length>120)S.mk.log.shift()}
function mkPhase(){const m=S.mk;if(!m)return null;return m.day===0?'구상 기간':m.day>=m.days?'마감':m.day>=m.days-1?'마감 임박':'FA 개장'}
// AI 구단이 이 선수를 원할까?
function aiWants(c,p){if(c===p.team||!isLCK(c))return false;const t=T(c);const cur=starters(c)[p.pos];const sal=faDemand(p);
  if(payroll(c)+sal>(typeof aiSpendCap==='function'?aiSpendCap(c):teamCap(c)))return false;if(isImport(p)&&importCount(c)>=IMPORT_MAX)return false;
  if(t.roster.length>=ROSTER_MAX&&!(cur&&ovr(p)>=ovr(cur)+2))return false;
  return !cur||ovr(p)>=ovr(cur)+1||(roster(c).filter(x=>x.pos===p.pos).length<2&&ovr(p)>=ovr(cur)-4)}
function aiSign(c,p,sal){const t=T(c);if(t.roster.length>=ROSTER_MAX){const w=roster(c).filter(x=>x.pos===p.pos).sort((a,b)=>ovr(a)-ovr(b))[0]||roster(c).sort((a,b)=>ovr(a)-ovr(b))[0];if(w)releasePlayer(w.id,true)}
  p.lastTeam=p.team||p.lastTeam;S.fa=S.fa.filter(x=>x!==p.id);p.team=c;p.squad='main';p.salary=Math.round(sal);p.contract=U.ri(1,3);t.roster.push(p.id);
  t.roster.forEach(o=>{if(o!==p.id&&S.chem[chemKey(o,p.id)]==null)S.chem[chemKey(o,p.id)]=U.ri(52,62)});const cur=starters(c)[p.pos];if(!cur||ovr(p)>ovr(cur))t.lineup[p.pos]=p.id;
  if(S.negos&&S.negos[p.id]&&S.negos[p.id].status==='open'){S.negos[p.id].status='fail';S.negos[p.id].log.push({w:'agent',t:`${p.name} 선수는 ${teamName(c)}와 계약했습니다.`})}}
function mkWhy(p,c){const top=motiveTop(p)[0];return top==='win'?'우승 도전':top==='play'?'주전 보장':top==='money'?'최고 대우':'의리'}
// 하루 진행
function mkDay(){const m=S.mk;if(!m||m.day>=m.days)return;m.day++;const me=S.myTeam;const ev=[];
  if(m.day===1)mkLog('FA 시장 개장! 각 구단이 영입 제안을 넣기 시작합니다','open');
  // (1) FA: 관심 구단 제안 → 고민 → 결정
  const fas=S.fa.map(P).filter(p=>p&&!p.retired&&ovr(p)>=72).sort((a,b)=>ovr(b)-ovr(a)).slice(0,40);
  let signed=0;fas.forEach(p=>{const bids=lckCodes().filter(c=>c!==me&&aiWants(c,p)&&Math.random()<0.35).map(c=>({club:c,sal:faDemand(p)*U.r(0.92,1.12)*(capInfo(c).mul>1?1.12:1),start:wouldStart(p,c)}));
    // 해외 큰손 (스타 한정)
    if(ovr(p)>=87&&natOf(p)==='KR'&&Math.random()<0.12){const fc=U.pick(Object.keys(S.teams).filter(c=>regionOf(c)==='LPL'));if(fc)bids.push({club:fc,sal:faDemand(p)*U.r(1.3,1.7),start:true})}
    m.interest[p.id]=bids.length;if(S.negos&&S.negos[p.id])S.negos[p.id].rival=Math.min(0.3,bids.length*0.06);
    if(!bids.length)return;if(p.fad==null)p.fad=ovr(p)>=86?U.ri(2,4):ovr(p)>=80?U.ri(1,3):U.ri(0,2);
    const myNego=S.negos&&S.negos[p.id]&&S.negos[p.id].status==='open';if(myNego&&p.fad<=0&&m.day<m.days-1){p.fad=1;mkLog(`${p.name} · 우리 팀과의 협상 결과를 보고 결정하겠다며 시간을 끕니다`,'rumor')}
    if(signed>=5&&m.day<m.days-1)return;
    if(p.fad>0){p.fad--;if(ovr(p)>=84&&bids.length>=2&&Math.random()<0.5)mkLog(`${p.name}(${ROLE_KO[p.pos]} ${ovr(p)}) · ${bids.slice(0,3).map(b=>teamName(b.club)).join(', ')} 사이에서 고민 중`,'rumor');return}
    // 우리 팀 협상이 진행 중이면 그쪽도 비교
    const best=bids.map(b=>({...b,v:offerAppeal(p,b)})).sort((a,b)=>b.v-a.v)[0];if(best.v<-0.45&&m.day<m.days-1)return;
    const prev=p.lastTeam;aiSign(best.club,p,best.sal);p.fad=null;p.mkNew=1;signed++;
    mkLog(`${teamName(best.club)} ← ${p.name}(${ROLE_KO[p.pos]} ${ovr(p)}) · ${mkWhy(p,best.club)}${prev&&prev!==best.club&&S.teams[prev]?` · 전 소속 ${teamName(prev)}`:''}`,ovr(p)>=86?'big':'sign',best.club);
    if(ovr(p)>=86)news(`[이적] ${p.name}, ${teamName(best.club)}행 확정 (${mkWhy(p,best.club)})`,'transfer')});
  // (2) 강팀 식스맨 → 출전 기회를 찾아 약팀으로 (바이아웃)
  lckCodes().filter(c=>c!==me).forEach(c=>{const st=new Set(Object.values(starters(c)).filter(Boolean).map(x=>x.id));
    roster(c).filter(p=>!st.has(p.id)&&ovr(p)>=76&&!p.mkNew).forEach(p=>{const mv=motives(p);if(Math.random()>0.06+mv.play*0.01)return;
      const buyers=lckCodes().filter(b=>b!==c&&b!==me&&aiWants(b,p)&&wouldStart(p,b)&&bankOf(b)>=6);if(!buyers.length)return;
      const b=U.pick(buyers);const fee=Math.max(2,Math.round(saleValue(p)*U.r(0.55,0.85)));if(bankOf(b)<fee)return;
      bankAdd(b,-fee);bankAdd(c,fee);const t=T(c);t.roster=t.roster.filter(x=>x!==p.id);Object.keys(t.lineup).forEach(r=>{if(t.lineup[r]===p.id)delete t.lineup[r]});
      aiSign(b,p,Math.max(p.salary,faDemand(p)));p.ten=0;p.mkNew=1;mkLog(`${teamName(c)} 식스맨 ${p.name} → ${teamName(b)} · 출전 기회 (이적료 ${fee}억)`,'move',b);
      news(`[이적] ${teamName(c)} 식스맨 ${p.name}, 주전 자리를 찾아 ${eulo(teamName(b))} (이적료 ${fee}억)`,'transfer')})});
  // (3) 긴축 구단은 고액 연봉자를 내놓음 → 돈 있는 구단이 영입
  lckCodes().filter(c=>c!==me&&(payroll(c)>teamCap(c)||bankOf(c)<-15)).forEach(c=>{const p=roster(c).sort((a,b)=>b.salary-a.salary)[0];if(!p||Math.random()<0.5)return;
    const buyers=lckCodes().filter(b=>b!==c&&b!==me&&aiWants(b,p)&&bankOf(b)>=10);if(!buyers.length)return;const b=buyers.sort((x,y)=>bankOf(y)-bankOf(x))[0];const fee=Math.round(saleValue(p)*U.r(0.8,1.1));
    if(bankOf(b)<fee)return;bankAdd(b,-fee);bankAdd(c,fee);const t=T(c);t.roster=t.roster.filter(x=>x!==p.id);Object.keys(t.lineup).forEach(r=>{if(t.lineup[r]===p.id)delete t.lineup[r]});
    aiSign(b,p,p.salary);p.ten=0;mkLog(`${teamName(c)}(긴축) ${p.name} → ${teamName(b)} · 이적료 ${fee}억`,'big',b);news(`[이적] 긴축에 들어간 ${teamName(c)}, ${p.name} 선수를 ${eulo(teamName(b))} 이적시킵니다 (이적료 ${fee}억)`,'transfer');ensureLineup(c)});
  // (4) 우리 팀 식스맨에게 오는 제안
  const st=new Set(Object.values(starters(me)).filter(Boolean).map(x=>x.id));
  roster(me).filter(p=>p.listed?ovr(p)>=68:(!st.has(p.id)&&ovr(p)>=76)).forEach(p=>{if((S.offers||[]).some(o=>o.pid===p.id&&!o.done)||Math.random()>(p.listed?0.6:0.18))return;
    const buyers=lckCodes().filter(b=>b!==me&&(p.listed?(aiWants(b,p)||wouldStart(p,b)):(aiWants(b,p)&&wouldStart(p,b))));if(!buyers.length)return;const b=U.pick(buyers);
    const fee=Math.max(2,Math.round(saleValue(p)*(p.listed?U.r(0.7,1.05):U.r(0.6,0.95))));const mv=motives(p);S.offers=S.offers||[];
    S.offers.push({pid:p.id,club:b,fee,wants:(p.bench||0)>=3||(mv.play>=13&&!wouldStart(p))||(typeof stayFactor==='function'?Math.random()>stayFactor(p)+0.1:mv.play>=11),lck:true});mkLog(`${teamName(b)}, 우리 팀 ${p.name}에게 관심 · 이적료 ${fee}억 제시`,'offer',b)});
  // (5) 루머
  if(Math.random()<0.6){const p=U.pick(fas.filter(x=>ovr(x)>=84));if(p){const c=U.pick(lckCodes().filter(x=>x!==p.team));mkLog(`[루머] ${teamName(c)}, ${p.name} 영입에 공들이는 중이라는 소식`,'rumor')}}

// ===== 구단 재정 2: 선수 연봉은 구단 자금에서 나갑니다 =====
// 1년 = 이적 시장 3번(컵 대회 후 · 시즌 중반 · 연말). 시장이 열릴 때마다 그 기간 몫을 정산합니다.
const FIN_SHARE={cup:0.3,legacy:0.35,mid:0.35,year:0.35};
const LEAGUE_SHARE=8; // LCK 리그 분배금(연)
// 구단 운영 예산(연): 모기업·구단주 지원(승인 한도) + 스폰서·굿즈 + 리그 분배금
// 모기업은 연봉 중 스폰서·분배금으로 모자란 부분을 승인 한도까지 메워 주고, 아껴 쓴 구단엔 한도의 10%를 운영비로 남겨 줍니다.
function ownerCover(c,pay,sh){const b=clubBudget(c);return Math.min(b.owner*sh,Math.max(0,pay*sh-(b.goods+b.league)*sh)+b.owner*sh*0.1)}
function clubBudget(c){const t=T(c);const f=U.clamp(t.fans||50,10,100);const mul=t.capMul||1;
  const owner=Math.round((20+f*1.1)*mul);const goods=Math.round(f*0.18);return {owner,goods,league:LEAGUE_SHARE,total:owner+goods+LEAGUE_SHARE}}
// 연간 예상 수지 (상금 제외)
function finForecast(c){c=c||S.myTeam;const b=clubBudget(c);const inc=c===S.myTeam?(diff().inc||1):1;
  const pay=payroll(c);const rev=Math.round(b.goods*inc+b.league+ownerCover(c,pay,1));const staff=c===S.myTeam?Math.round(staffWages()*3):0;const fac=c===S.myTeam?Math.round(facUpkeep()*3):0;
  return {rev,pay,staff,fac,net:rev-pay-staff-fac,b}}
// AI 구단이 쓸 수 있는 연봉 한도: 샐러리캡과 실제 예산 중 작은 쪽
function aiSpendCap(c){const b=clubBudget(c);return Math.min(teamCap(c),Math.round(b.total*1.05+Math.max(0,bankOf(c))*0.3))}
function settleWindow(kind){
  const sh=FIN_SHARE[kind]||0.33;const me=S.myTeam;
  lckCodes().forEach(c=>{if(c===me)return;const b=clubBudget(c);const pay=payroll(c);const net=(b.goods+b.league)*sh+ownerCover(c,pay,sh)-pay*sh;bankAdd(c,Math.round(net*10)/10)});
  // 우리 구단: 항목별 정산 + 장부
  const b=clubBudget(me);const inc=diff().inc||1;
  const rows=[['모기업·구단주 지원금',Math.round(ownerCover(me,payroll(me),sh)*10)/10],['스폰서·굿즈',Math.round(b.goods*sh*inc*10)/10],['LCK 리그 분배금',Math.round(b.league*sh*10)/10],
    ['선수 연봉',-Math.round(payroll(me)*sh*10)/10],['코치진 급여',-staffWages()],['시설 유지비',-facUpkeep()]].filter(r=>r[1]);
  const before=S.funds||0;rows.forEach(r=>S.funds=Math.round(((S.funds||0)+r[1])*10)/10);
  const net=Math.round((S.funds-before)*10)/10;
  S.ledger=(S.ledger||[]).concat([{y:S.year,label:FIN_LABEL[kind]||'정산',rows,net,after:S.funds}]).slice(-9);
  news(`[구단 자금] ${FIN_LABEL[kind]||'정산'} 결산 ${net>=0?'+':''}${net}억 (연봉 ${Math.round(payroll(me)*sh)}억 지급) · 잔액 ${Math.round(S.funds)}억`,net>=0?'info':'loss');
  if(S.funds<0){S.trust=U.clamp(S.trust-4,0,100);news(`[재정 경고] 구단 자금이 바닥났습니다 (${Math.round(S.funds)}억). 자금이 회복될 때까지 새 선수 계약이 막히고 구단 신뢰가 떨어집니다. 고액 연봉 선수 정리를 검토하세요.`,'loss')}
}

  const sy=SYNERGIES.find(([a,b])=>(a===champ&&Object.values(d.picks[side]).includes(b))||(b===champ&&Object.values(d.picks[side]).includes(a)));
  if(sy)return `${code}, ${sy[0]}-${sy[1]} 조합 완성! ${josa(sy[2],'이','가')} 기대됩니다.`;
  if(p.sig.includes(champ))return `${code} ${ROLE_KO[role]}, ${p.name} 선수에게 ${champ}! 숙련도 ${m}의 주력 챔피언입니다.`;

// ===== 경기 흐름 2: 사실 기반 운영 · 구조물 · 상황별 작전 =====
// 협곡 타이머는 2026 시즌(26.1) 기준: 드래곤 5:00(5분 재생성) · 공허 유충 8:00 · 협곡의 전령 15:00~19:45 · 바론 20:00(6분 재생성)
// 장로 드래곤은 영혼 획득 6분 뒤 · 억제기 5분 뒤 재생성 · 쌍둥이 포탑 3분 뒤 재생성(체력 40%) · 첫 포탑 300골드
const KILL_CAL={early0:0.1,early:0.17,plan:0.14,wkLo:1,wkHi:3,bonus:0.36,late:0.5,lose:0.75};
const RIFT={drake:5,grubs:8,lane:11,herald:15,heraldEnd:19,baron:20,baronRe:6,elderRe:6,inhibRe:5,nexTRe:3};
const LANES3=['top','mid','bot'];
const SLOT_ONCE={grubs:1,lane:1,mid:1,baron:1,final:1,elder:1,siege:1};
const MAX_USER_CALLS=7;

// ---- 구조물: 같은 라인을 따라 순서대로 (외곽 → 내부 → 억제기 포탑 → 억제기 → 쌍둥이 포탑 → 넥서스)
GameSim.prototype.openLanes=function(v){const t=this.t,ahead=(this.gold[1-v]-this.gold[v])>6000;const maxL=t<13?1:t<20?2:t<(ahead?23:26)?3:4;return LANES3.filter(l=>this.lanes[v][l]<maxL)};
GameSim.prototype.deepLane=function(v){return LANES3.slice().sort((a,b)=>this.lanes[v][b]-this.lanes[v][a])[0]};
GameSim.prototype.push=function(side,n,why='',o={}){
  const v=1-side;const names=[],spots=[];let inhib=false,nexus=false,lane=null,taken=0;this.inhibRes=this.inhibRes||[{},{}];this.nexRes=this.nexRes||[[],[]];
  const X=()=>({plan:o.plan||null,who:o.who||null,def:o.def||null,from:o.from||null,lane});
  const spread=['split','131','trade','swap','plates'].includes(o.plan);
  const noNex=['split','plates','swap','trade','dive','131','herald','rotate'].includes(o.plan);
  const pref=(o.lanes||[]).filter(l=>LANES3.includes(l));
  const down=l=>this.lanes[v][l]>=4;const nexOk=()=>!noNex&&this.t>=24;
  const pick=k=>{const open=this.openLanes(v);
    if(lane&&!spread){if(open.includes(lane))return lane;if(down(lane)&&nexOk())return 'nexus'}
    const cand=spread&&pref.length?pref.slice(k%pref.length).concat(pref.slice(0,k%pref.length)):pref;
    for(const l of cand){if(open.includes(l))return l;if(down(l)&&nexOk()&&!spread)return 'nexus'}
    if(pref.length&&o.strict)return null;
    if(open.length)return this.t>=20?open.slice().sort((a,b)=>this.lanes[v][b]-this.lanes[v][a])[0]:U.wpick(open,open.map(x=>1+this.lanes[v][x]*1.2));
    if(nexOk()&&LANES3.some(down))return 'nexus';
    return null};
  // 1분 동안 한 팀이 깰 수 있는 구조물 한도 (시간대·골드 차·버프) → 한 번의 교전으로 본진까지 순식간에 무너지는 일 방지
  if(this._pmT!==this.t){this._pmT=this.t;this._pm=[0,0]}
  const force=this.t>=50||o.plan==='race';
  const gdw=this.gold[side]-this.gold[v];const hasBuff=this.buff.baron[side]>this.t||this.buff.elder[side]>this.t;
  let budget=(this.t<20?2:this.t<26?3:this.t<32?4:5)+(hasBuff?1:0)-(gdw<-6000?2:gdw<-3000?1:0);
  budget=Math.max(1,budget)-this._pm[side];if(!force)n=Math.min(n,budget);
  this.nexAt=this.nexAt||[-9,-9];
  for(let k=0;k<n&&!this.over;k++){
    const tg=pick(k);if(!tg)break;if(this.peStruct&&!this.peStruct(side,tg,o)){if(this._peNoTime&&!o._pend)(this.pePend=this.pePend||[]).push({side,n:n-k,why,o:Object.assign({},o,{_pend:1})});break}
    if(tg==='nexus'){
      // 쌍둥이 포탑을 막 깬 그 분에 바로 넥서스까지는 장로 버프가 있을 때만
      
      if(this.nexT[v]<2){if(this.nexT[v]===1)this.nexAt[v]=this.t;this._pm[side]++;this.nexT[v]++;this.towers[side]++;this.nexRes[v].push(this.t+RIFT.nexTRe);names.push('쌍둥이 포탑');spots.push({l:'nexus',v,n:this.nexT[v]});nexus=true;this.gold[side]+=250;taken++}
      else{if(names.length)this.log(side,`${this.name(side)}, ${names.join(' · ')} 파괴${why?' ('+why+')':''}`,'tower','base'+v,false,{kind:'tower',names:names.slice(),spots:spots.slice(),why,inhib,nexus,...X()});this.endGame(side);return {names,spots,lane,taken,ended:true}}
    }else{
      lane=spread?lane:tg;if(spread)lane=tg;const l=tg;const lv=this.lanes[v][l];this.lanes[v][l]++;this._pm[side]++;
      if(lv<3){this.towers[side]++;if(!this.firstTower){this.firstTower=side+1;this.gold[side]+=300;this.ps[side].forEach(p=>p.gold+=60)}}
      if(lv===3){inhib=true;this.inhibRes[v][l]=this.t+RIFT.inhibRe}
      names.push(`${LANE_KO[l]} ${STRUCT_NAMES[lv]}`);spots.push({l,lv,v});taken++;

    }
  }
  if(names.length&&!this.over)this.log(side,`${this.name(side)}, ${names.join(' · ')} 파괴${why?' ('+why+')':''}`,'tower',lane||'base',false,{kind:'tower',names,spots,why,inhib,nexus,...X()});
  return {names,spots,lane,taken,ended:this.over};
};
// 억제기·쌍둥이 포탑 재생성
GameSim.prototype.respawnStructs=function(){
  this.inhibRes=this.inhibRes||[{},{}];this.nexRes=this.nexRes||[[],[]];const t=this.t;
  for(let v=0;v<2;v++){
    LANES3.forEach(l=>{const at=this.inhibRes[v][l];if(at&&t>=at&&this.lanes[v][l]>=4){this.lanes[v][l]=3;delete this.inhibRes[v][l];
      this.log(v,`${this.name(v)} ${LANE_KO[l]} 억제기 재생성`,'info',l,false,{kind:'respawn',what:'inhib',lane:l,v})}});
    const due=this.nexRes[v].filter(x=>t>=x);if(due.length&&this.nexT[v]>0){this.nexT[v]=Math.max(0,this.nexT[v]-due.length);this.nexRes[v]=this.nexRes[v].filter(x=>t<x);
      this.log(v,`${this.name(v)} 쌍둥이 포탑 재생성`,'info','base'+v,false,{kind:'respawn',what:'nexus',v,n:this.nexT[v]})}
  }
};
GameSim.prototype.baseOpen=function(v){return LANES3.some(l=>this.lanes[v][l]>=4)};
// 교전 후 압박: 숫자 우위 × 사망 시간 = 밀 수 있는 구조물 수
GameSim.prototype.pushLanes=function(w,loc){const v=1-w;
  if(this.siege&&this.siege.side===w)return [this.siege.lane];
  const near=(NEAR_LANES[loc]||['mid']).slice();
  if(this.t>=20&&(String(loc).startsWith('base')||loc==='mid'))near.sort((a,b)=>this.lanes[v][b]-this.lanes[v][a]);
  return near};
GameSim.prototype.pushAfter=function(w,res){
  if(this.over||!res)return;const t=this.t,l=1-w;
  if(this.siege&&this.siege.side!==w&&(res.wk||0)>=2)this.siege=null;
  const adv=(res.wk||0)-(res.lk||0);
  if(t<12){if(adv>=2&&Math.random()<0.5)this.push(w,1,'',{lanes:NEAR_LANES[res.loc]||['mid'],plan:'after',from:res.loc,strict:true});return}
  const dt=t<16?0.4:t<24?0.6:t<32?0.9:1.2;
  const b=Math.max(0,adv)*dt*0.85+(res.ace?1.2+dt*1.4:0)+(this.buff.baron[w]>t?1.2:0)+(this.buff.elder[w]>t?1.8:0)+(res.wk>=3&&adv>=2?0.3:0);
  let n=Math.floor(b+U.r(0,0.45)-(t<24&&!res.ace&&adv<2?1:0));if(n<=0)return;
  // 현실적인 상한: 상대 부활 시간 안에 한 라인을 따라 밀 수 있는 구조물 수 (시간대·골드·버프 반영)
  const gdw=this.gold[w]-this.gold[l];let cap=t<20?1:t<26?2:t<32?3:t<38?4:5;
  if(this.buff.baron[w]>t||this.buff.elder[w]>t)cap++;
  if(gdw<-6000)cap-=2;else if(gdw<-3000)cap-=1;
  if(!res.ace)cap=Math.min(cap,adv>=3?cap:2);

  // 쌍둥이 포탑까지 다 깼고 상대가 아직 부활 대기 중이면 그대로 넥서스를 칩니다
  const startedDeep=r&&r.spots&&r.spots.length&&r.spots[0].l==='nexus';
  if(!this.over&&r&&r.nexus&&startedDeep&&this.nexT[l]>=2&&(res.ace||adv>=3||(adv===2&&Math.random()<0.6))){this.log(w,`${this.name(w)}, 상대 부활까지 시간이 남았습니다. 그대로 넥서스로!`,'info','base'+l,true,{kind:'assault',a:w,direct:true});this.endGame(w);return}
  this.afterPush(w,r,res.ace?'ace':'fight',res);

// 깊게 밀고 난 뒤: 넥서스까지 못 가면 이유를 밝히고 정비 → 다음 진입을 노림
GameSim.prototype.afterPush=function(w,r,why,res){
  if(this.over||!r||!r.names||!r.names.length)return;const l=1-w;const lane=r.lane||this.deepLane(l);
  const deep=this.nexT[l]>0||(lane&&this.lanes[l][lane]>=3);if(!deep)return;
  this.siege={side:w,lane,t:this.t};
  const t=this.t;const buff=this.buff.baron[w]>t||this.buff.elder[w]>t;
  const left=res?U.clamp(5-(res.wk||0),1,5):0;
  const reason=this.nexT[l]>=2?(why==='ace'?'넥서스를 치던 중 상대 선수들이 부활해 우물 앞을 막아서자':left?`우물 앞에 상대 ${left}명이 버티고 있어 무리하지 않고`:'넥서스 앞 수비가 단단해 정비를 위해')
    :why==='ace'?'상대가 부활하기 전에 억제기까지 챙기고':buff?'버프 미니언이 라인을 밀어주는 사이':'체력이 부족해';
  this.log(w,`${this.name(w)}, ${reason} 일단 빠집니다.`,'info','base'+w,false,{kind:'reset',side:w,lane,nexT:this.nexT[l],inhib:LANES3.filter(x=>this.lanes[l][x]>=4).length,why});
};
// 상대 넥서스가 열린 상태에서의 마무리 진입
GameSim.prototype.assault=function(a,bonus=0){
  const l=1-a;const inh=LANES3.filter(x=>this.lanes[l][x]>=4).length;
  const pr=this.p(a,'late',inh*0.5-0.8+bonus+(this.assaultB&&this.assaultB[a]||0));if(this.assaultB)this.assaultB[a]=0;
  this.log(a,`${this.name(a)}, 슈퍼 미니언과 함께 다시 본진으로 들어갑니다!`,'info','base'+l,false,{kind:'assault',a});
  const r=this.fight('late',{loc:'base'+l,p:pr,obj:'nexus'});
  if(r.w===a&&!this.over){this.endGame(a)}

GameSim.prototype.takeElder=function(w,how=''){this.buff.elder[w]=this.t+3;this.elderAt=this.t+RIFT.elderRe;this.elders=this.elders||[0,0];this.elders[w]++;
  this.log(w,`${this.name(w)}, 장로 드래곤 획득!${how?' '+how:''} 처형 버프로 마무리에 나섭니다.`,'obj','drag',true,{kind:'elder',how})};
GameSim.prototype.fightLoc=function(){const t=this.t;
  if(this.siege&&t-this.siege.t<=2&&Math.random()<0.55)return 'base'+(1-this.siege.side);
  const o=[['mid',3],['riverTop',1.5],['riverBot',1.5],['jg0',0.7],['jg1',0.7],['top',0.5],['bot',0.7]];
  if(t>=RIFT.baron&&this.nextBaron<=t)o.push(['baron',1.6]);
  if(!this.soul[0]&&!this.soul[1]&&this.nextDragon<=t)o.push(['drag',1.6]);
  return U.wpick(o.map(x=>x[0]),o.map(x=>x[1]))};

// ---- 작전 타임: 시점·상황에 따라 등장
GameSim.prototype.slot=function(){
  const t=this.t,d=this.done;const gd=Math.abs(this.gold[0]-this.gold[1]);
  if(t===RIFT.grubs&&!d.grubs)return {s:'grubs'};
  if(t===RIFT.lane&&!d.lane)return {s:'lane'};
  if(t===RIFT.herald&&!d.mid)return {s:'mid'};
  for(const a of [0,1])if(this.nexT[1-a]>=2&&!d['nexus'+a])return {s:'nexus',a};
  for(const a of [0,1]){const l=1-a;if(!d.siege&&t>=22&&LANES3.some(x=>this.lanes[l][x]>=2)&&(this.buff.baron[a]>t||this.buff.elder[a]>t))return {s:'siege',a}}
  if(this.elderAt&&t>=this.elderAt&&!d.elder)return {s:'elder'};
  if(t>=RIFT.baron+1&&!d.baron&&this.nextBaron<=t&&(gd>3500||t>=25))return {s:'baron'};
  if(t>=28&&!d.final&&d.baron)return {s:'final'};
  return null};
GameSim.prototype.step=function(){
  if(this.over||this.decision)return;
  this.t++;this.pings=[];this.busy=false;this.sec=0;if(this.ag)this.peTo(this.t*60,true);const t=this.t;if(this.peFlush)this.peFlush();
  for(let i=0;i<2;i++){const inc=1550+Math.min(t,30)*14+U.r(0,120);this.gold[i]+=inc;
    const sh=[0.22,0.18,0.23,0.25,0.12];this.ps[i].forEach((p,k)=>{p.gold+=inc*sh[k];const le=p.role==='JUG'||p.role==='SUP'?0:(i===0?1:-1)*this.laneAdv(p.role);p.cs+=({TOP:8.2,JUG:6.1,MID:8.6,ADC:9.3,SUP:1.3}[p.role])*U.r(0.85,1.08)*(t<=14?1+U.clamp(le,-8,8)*0.012:1)})}
  // 슈퍼 미니언: 억제기가 깨진 라인마다 매 웨이브 압박 골드
  for(let i=0;i<2;i++){const sm=LANES3.filter(l=>this.lanes[1-i][l]>=4).length;if(sm)this.gold[i]+=sm*90}
  if(t<=14){const e=['TOP','MID','ADC'].reduce((s,r)=>s+U.clamp(this.laneAdv(r),-8,8),0)*0.8+U.clamp(this.S(0,'JUG','path')-this.S(1,'JUG','path'),-8,8)*0.5+U.clamp(this.day[0]-this.day[1],-4,4)*3;this.gold[0]+=e;this.gold[1]-=e}
  this.respawnStructs();

    this.done[sl.s==='nexus'?'nexus'+sl.a:sl.s]=true;

    this.resolve(slot,i,this.aiChoose(opts),meta)}

    return [{k:'cr_now',t:'"그만한 자격이 있어. 지금 바로 올려줄게."',fx:[[`연봉 +${up}억`,'mid'],['사기 ↑↑','up'],[room<up?'샐러리캡 초과 위험':`캡 여유 ${room}억`,room<up?'down':'mid']]},
      {k:'cr_later',t:'"재계약 때 확실히 챙겨줄게. 약속해."',fx:[['사기 ↑','up'],['다음 재계약 요구액 ↑','down']]},
      {k:'cr_no',t:'"지금은 팀 사정상 어려워. 이해해 줘."',fx:[['사기 ↓↓','down'],['해외 이적 의지 ↑','down']]}]};
  const ANS0=talkAnswer;
  talkAnswer=function(tid,k){const t=(S.talks||[]).find(x=>x.id===tid);if(!t||t.kind!=='champraise')return ANS0(tid,k);const p=P(t.pid);let msg='';
    const mor=d=>p.morale=U.clamp(p.morale+d,10,100);
    if(k==='cr_now'){const up=Math.max(1,Math.round(p.salary*0.25));p.salary+=up;mor(16);msg=`${p.name} 연봉 ${p.salary}억으로 인상 (${payroll(S.myTeam)}/${teamCap(S.myTeam)}억)`}
    else if(k==='cr_later'){mor(6);p.raise=Math.max(p.raise||1,1.15);msg=`${p.name}: "믿겠습니다. 재계약 때 꼭 부탁드려요."`}
    else{mor(-16);p.raise=Math.max(p.raise||1,1.2);p.wantOut=(p.wantOut||0)+1;msg=`${p.name}: "…알겠습니다. 저도 제 미래를 생각해 볼게요."`}
    t.done=true;t.ans=k;S.talkLog=(S.talkLog||[]).concat([{y:S.year,w:S.week,pid:p.id,kind:t.kind,ans:k}]).slice(-40);news(`[면담] ${msg}`,'event');return msg};
  // 우승 후 새 스플릿: 스타들의 연봉 인상 요구 · 국제대회 피로
  const SS0=startSplit;
  startSplit=function(first){SS0(first);if(first||!S.myTeam)return;try{
    const dl=dynLevel();
    // 연봉 재협상 요구: 1년에 한 번(새 시즌 첫 스플릿), 시장가보다 확실히 적게 받는 우승 멤버만, 같은 선수는 2년에 한 번
    if(dl>=1&&S.split===0&&S._raiseY!==S.year){S._raiseY=S.year;const stars=roster(S.myTeam).filter(p=>ovr(p)>=88&&p.contract>=1&&(salaryFor(ovr(p))>=p.salary*1.1||(dl>=2&&ovr(p)>=92))&&(p._raiseAskY==null||S.year-p._raiseAskY>=2)&&!contractLocked(p)&&!(S.talks||[]).some(t=>!t.done&&t.pid===p.id)).sort((a,b)=>(salaryFor(ovr(b))-b.salary)-(salaryFor(ovr(a))-a.salary));let n=0;const cap=dl>=2?2:1;
      stars.forEach(p=>{if(n>=cap)return;if(Math.random()<0.5){p._raiseAskY=S.year;(S.talks=S.talks||[]).push({id:S.nextId++,pid:p.id,kind:'champraise',w:S.week});n++}});
      if(n)news(`[왕조의 무게] 우승 멤버 ${n}명이 연봉 재협상을 원합니다`,'info')}
    const il=S.intlLast;if(il&&il.myPlace&&S._fatigueFor!==il.label){S._fatigueFor=il.label;const drop=il.kind==='worlds'?14:10;
      Object.values(starters(S.myTeam)).filter(Boolean).forEach(p=>p.cond=U.clamp(p.cond-drop,40,100));
      news(`[강행군] ${il.label} 일정을 소화한 주전들의 컨디션이 떨어졌어요 (−${drop}). 초반 몇 주는 로테이션을 고려하세요`,'info')}
  }catch(e){}};
  // 강팀 스타를 노리는 해외 오퍼가 늘어납니다
  const RO0=rollOffers;
  rollOffers=function(){RO0();try{const dl=dynLevel();const k=strongK();if(dl<1&&k<0.75)return;
    const have=new Set((S.offers||[]).map(o=>o.pid));const cand=roster(S.myTeam).filter(p=>ovr(p)>=88&&!have.has(p.id)).sort((a,b)=>ovr(b)-ovr(a));
    if(!cand.length||Math.random()>0.12+0.08*dl+0.06*k)return;const p=cand[0];
    const club=U.pick(Object.keys(S.teams).filter(c=>!isLCK(c)&&['LPL','LEC','LCS'].includes(regionOf(c))));if(!club)return;
    const fee=Math.round((salaryFor(ovr(p))*1.5+Math.max(0,ovr(p)-80)*1.8)*U.r(1.0,1.35));
    S.offers.push({pid:p.id,club,fee,wants:Math.random()<0.3+0.12*dl+0.25*(p.wantOut?1:0),dyn:true});
    news(`[해외 러브콜] ${teamName(club)}, 우리 팀 ${p.name}에게 이적료 ${fee}억 제안. 우승 팀 스타를 노리는 손길이 늘어납니다`,'transfer')}catch(e){}};
})();

// 작전 타임 코치 한마디: 약팀은 판을 흔들고, 강팀은 굳힌다
function decisionHint(sim,i){const u=sim.und(i),f=sim.und(1-i);const gd=sim.gold[i]-sim.gold[1-i];let t='';
  if(u>=0.4)t=gd<-1500?'전력도 밀리고 골드도 뒤져요. 정석으로는 따라가기 어려워요. 리스크가 높은 기습 작전으로 흐름을 흔들 때예요.':'전력이 밀리는 경기예요. 상대는 우리를 얕보고 있어요. "상대 방심 노림" 작전이 평소보다 잘 통해요.';
  else if(f>=0.4)t=gd>1500?'우리가 앞선 경기예요. 리스크 높은 작전보다 성공 확률이 높은 작전으로 굳히는 게 정답이에요.':'전력은 우리가 위예요. 상대는 기습을 노려요. 확률이 높은 작전 위주로 하고, 리스크 높은 작전은 확실할 때만 쓰세요.';
  else t=gd>2500?'앞서 있어요. 성공 확률이 높은 작전으로 차이를 굳히세요.':gd<-2500?'뒤지고 있어요. 확률이 비슷하다면 리스크 높은 작전이 역전에 유리해요.':'';
  return t?`<div class="dhint"><span class="spk a">코치</span>${esc(t)}</div>`:''}

// 코치 한 줄 요약: 이번 경기의 핵심
function coachKeyLine(me,opp){try{const pw=preWinOf(me,opp);const ins=planInsight(me,opp).slice().sort((a,b)=>b.v-a.v);const b=ins[0];const pn=b&&b.v>1&&PLANS[b.k]?PLANS[b.k].name:null;
  const os=Object.values(starters(opp)).filter(Boolean).sort((a,b)=>ovr(b)-ovr(a))[0];const P_=Math.round(pw*100);
  const t=pw<=0.38?`예상 승률 ${P_}%. 정석으로는 어려운 상대예요. ${pn?`'${pn}' 쪽이 뚫을 구멍이고, `:''}경기 전 비책과 과감한 작전으로 판을 흔들어야 해요.`
    :pw>=0.62?`예상 승률 ${P_}%. 우리가 한 수 위지만 상대는 기습을 준비해 올 거예요.${os?` 경계 대상은 ${os.name}.`:''} 확률 높은 작전으로 굳히세요.`
    :`예상 승률 ${P_}%, 팽팽한 경기예요.${pn?` '${pn}' 공략이 승부처가 될 거예요.`:''}${os?` 상대 핵심은 ${os.name}.`:''}`;
  return `<div class="ckey"><span class="spk a">코치</span><span>${esc(t)}</span></div>`}catch(e){return ''}}

// ===== 구단 기대치 상승: 목표를 연달아 이루면 다음 목표가 한 단계 올라갑니다 =====
const GOAL_TIERS=[{place:7,rank:8,text:'정규시즌 8위 이상'},{place:5,text:'플레이오프 진출'},{place:3,text:'4강 진출'},{place:2,text:'결승 진출'},{place:1,text:'우승'}];
(function(){const SG0=setGoal;
  setGoal=function(){SG0();try{const h=(S.history||[]);let st=0;for(let k=h.length-1;k>=0&&h[k].met;k--)st++;
    if(st>=2&&S.goal){let idx=GOAL_TIERS.findIndex(g=>g.place===S.goal.place);if(idx<0)idx=0;const up=Math.min(GOAL_TIERS.length-1,idx+Math.floor(st/2));
      if(up>idx){S.goal=Object.assign({},GOAL_TIERS[up]);S.goal.raised=true;try{news(`[구단] 연속 목표 달성으로 기대치가 올라갔습니다. 이번 목표: ${S.goal.text}`,'info')}catch(e){}}}}catch(e){}};
  // 우승 보너스: 타이틀을 딸수록 선수단 보너스 지급
  const SS1=startSplit;
  startSplit=function(first){SS1(first);if(first||!S.myTeam)return;try{const h=(S.history||[]).slice(-1)[0];const il=S.intlLast;
    const won=(h&&h.place===1&&h.champion===S.myTeam?1:0)+(il&&il.myPlace===1&&S._bonusFor!==il.label?1:0);if(il)S._bonusFor=il.label;
    if(won){const b=Math.round(roster(S.myTeam).filter(p=>ovr(p)>=85).length*1.5*won+3);addFunds(-b,'우승 보너스 (선수단)');}}catch(e){}};
})();

// ===== 이적 제안 현실화: 충성도·팀 성적·대우로 '떠나고 싶은지' 결정, 해외 구단은 LPL 위주 상위권 =====
const LOYAL_BASE={faker:20,keria:15,oner:14,chovy:13,ruler:12,canyon:12,kiin:12,peyz:12,doran:11};
function stayFactor(p){let mv;try{mv=motives(p)}catch(e){mv={loy:10,money:10}}const nm=String(p.name||'').toLowerCase();const loy=Math.max(mv.loy||10,LOYAL_BASE[nm]||0);
  let s=0.38+(loy-9)*0.035;const ten=S.year-(p.teamSince||p.joined||S.year);s+=Math.min(0.2,ten*0.05);
  if(p.team===S.myTeam){s+=Math.min(2,dynLevel())*0.12+strongK()*0.12;const pl=S.lastPlace;if(pl&&pl<=2)s+=0.08}
  if(p.morale>=75)s+=0.1;else if(p.morale<45)s-=0.2;if(p.wantOut)s-=0.22*p.wantOut;
  if((mv.money||0)>=14&&salaryFor(ovr(p))>p.salary*1.2)s-=0.15;if((p.bench||0)>=3)s-=0.2;
  return U.clamp(s,0.03,0.97)}
function pickOfferClub(p){const reg=U.wpick(['LPL','LEC','LCS'],[0.74,0.17,0.09]);const cs=Object.keys(S.teams).filter(c=>!isLCK(c)&&regionOf(c)===reg).sort((a,b)=>teamOvr(b)-teamOvr(a));
  return cs.length?U.pick(cs.slice(0,ovr(p)>=90?3:5)):null}
(function(){const RO1=rollOffers;rollOffers=function(){const before=new Set((S.offers||[]).map(o=>o.pid+'|'+o.club));RO1();try{(S.offers||[]).forEach(o=>{if(before.has(o.pid+'|'+o.club)||o.done)return;const p=P(o.pid);if(!p)return;
    if(!o.lck){const c=pickOfferClub(p);if(c)o.club=c}o.wants=Math.random()>stayFactor(p)})}catch(e){}}})();

// 기존 세이브 정리: 한꺼번에 쌓인 연봉 재협상 면담은 가장 급한 1건만 남김
(function(){const MA=migrateAll;migrateAll=function(){MA();try{const open=(S.talks||[]).filter(t=>!t.done&&t.kind==='champraise');if(open.length>1){
    open.sort((a,b)=>{const pa=P(a.pid),pb=P(b.pid);return (pb?salaryFor(ovr(pb))-pb.salary:0)-(pa?salaryFor(ovr(pa))-pa.salary:0)});
    open.slice(1).forEach(t=>{t.done=true;t.ans='auto';const p=P(t.pid);if(p)p._raiseAskY=S.year});S._raiseY=S.year}}catch(e){}}})();

// ===== 계약 존중: 재계약·연장·인상에 합의한 선수는 계약 기간 동안 다시 돈 얘기를 꺼내지 않아요 =====
function markSigned(p){if(!p)return;p.signedY=S.year;p.signedSplit=S.split;p.raise=null;p.wantOut=0;p._raiseAskY=S.year}
function contractLocked(p){return p&&p.signedY!=null&&(p.contract||0)>=2}
(function(){
  const SD=signDone;signDone=function(p,n,o){const r=SD(p,n,o);try{if(p&&p.team===S.myTeam)markSigned(p)}catch(e){}return r};
  const RS=resign;resign=function(id){const r=RS(id);try{if(r&&r.ok)markSigned(P(id))}catch(e){}return r};
  const TA=talkAnswer;talkAnswer=function(tid,k){const t=(S.talks||[]).find(x=>x.id===tid);const r=TA(tid,k);try{if(t&&['raise','cr_now'].includes(k))markSigned(P(t.pid))}catch(e){}return r};
  // 주간 면담 생성 뒤: 계약 기간이 남은 재계약 선수의 계약·연봉 면담은 지움
  const TG=talkGen;talkGen=function(){const r=TG.apply(this,arguments);try{S.talks=(S.talks||[]).filter(t=>t.done||!['contract','champraise'].includes(t.kind)||!contractLocked(P(t.pid)))}catch(e){}return r};
  // 이적 의사: 막 재계약한 선수는 떠나려 하지 않음
  const SF=stayFactor;stayFactor=function(p){let v=SF(p);if(contractLocked(p)&&!p.listed)v=Math.min(0.97,v+0.25);if(p.listedBy==='me')v=Math.max(0.03,v-0.3);return v};
})();
// 기존 세이브: 이미 시장가 이상으로 2년 넘게 묶어 둔 선수는 '재계약 완료'로 보고 요구를 멈춤
(function(){const MA=migrateAll;migrateAll=function(){MA();try{if(!S||!S.myTeam||S._signMig)return;S._signMig=1;
  roster(S.myTeam).forEach(p=>{if(p.signedY==null&&(p.contract||0)>=2&&p.salary>=Math.round(salaryFor(ovr(p))*0.95))p.signedY=S.year});
  (S.talks||[]).forEach(t=>{if(!t.done&&['contract','champraise'].includes(t.kind)&&contractLocked(P(t.pid))){t.done=true;t.ans='auto'}})}catch(e){}}})();
// 이적 명단: 해외 구단 제안도 더 자주 (명단에 오른 선수는 떠날 마음도 커짐)
(function(){const RO=rollOffers;rollOffers=function(){RO();try{const have=new Set((S.offers||[]).filter(o=>!o.done).map(o=>o.pid));
  roster(S.myTeam).filter(p=>p.listed&&ovr(p)>=80&&!have.has(p.id)).forEach(p=>{if(Math.random()>0.45)return;const club=pickOfferClub(p);if(!club)return;
    const fee=Math.round(saleValue(p)*U.r(0.85,1.15));S.offers.push({pid:p.id,club,fee,wants:Math.random()>stayFactor(p),listed:true});news(`[이적 명단] ${teamName(club)}, ${p.name} 선수에게 이적료 ${fee}억 제안`,'transfer')})}catch(e){}}})();

// ---- 선수 프로필 (정육각형 능력치)
function radarSvg(p){
  const keys=STAT_KEYS;const N=6;const cx=120,cy=112,R=82;const pt=(i,f)=>{const a=-Math.PI/2+i*2*Math.PI/N;return [cx+Math.cos(a)*R*f,cy+Math.sin(a)*R*f]};
  const norm=v=>U.clamp((v-60)/39,0.06,1);
  const peers=lckCodes().flatMap(c=>Object.values(starters(c)).filter(x=>x&&x.pos===p.pos));
  const avg=keys.map(k=>U.avg(peers.map(x=>x.st[k])));
  const poly=vals=>vals.map((v,i)=>pt(i,norm(v)).map(n=>n.toFixed(1)).join(',')).join(' ');
  const grid=[0.25,0.5,0.75,1].map(f=>`<polygon points="${keys.map((_,i)=>pt(i,f).join(',')).join(' ')}" fill="none" stroke="#2a3654" stroke-width="1"/>`).join('');
  const axes=keys.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#2a3654"/>`}).join('');
  const labels=keys.map((k,i)=>{const [x,y]=pt(i,1.24);return `<text x="${x}" y="${y}" text-anchor="middle" dominant-baseline="middle" class="rl">${STAT_KO[k]}</text><text x="${x}" y="${y+13}" text-anchor="middle" dominant-baseline="middle" class="rv">${p.st[k]}</text>`}).join('');
  return `<svg class="radar" viewBox="0 0 240 236" role="img" aria-label="${esc(p.name)} 능력치 육각형">${grid}${axes}
    <polygon points="${poly(avg)}" fill="rgba(63,140,255,.10)" stroke="#5a8dff" stroke-width="1.2" stroke-dasharray="4 3"/>
    <polygon points="${poly(keys.map(k=>p.st[k]))}" fill="rgba(233,196,106,.28)" stroke="#e9c46a" stroke-width="2"/>
    ${keys.map((k,i)=>{const [x,y]=pt(i,norm(p.st[k]));return `<circle cx="${x}" cy="${y}" r="3" fill="#e9c46a"/>`}).join('')}${labels}</svg>
    <div class="rleg"><span><i style="background:#e9c46a"></i>${esc(p.name)}</span><span><i style="background:#5a8dff"></i>LCK ${ROLE_KO[p.pos]} 주전 평균</span></div>`;
}

// ===== 인게임 에디터 (FM 에디터 방식): 선수 능력치·계약·컨디션 수정, 자유 이적, 선수 생성 =====
const ED_TIERS={prospect:['유망주',58,68,14,28,0,0],rookie:['신인',68,76,8,18,0,1],regular:['주전급',78,84,2,8,1,4],ace:['에이스',86,91,1,5,2,6],world:['월드클래스',92,96,0,3,3,6]};
const ED_TF=[['ALL','전체'],['MY','우리 팀'],['LCK','LCK'],['INTL','해외'],['FA','FA'],['FREE','소속 없음']];
function edState(){if(!V.cr)V.cr={mode:'random',pos:'MID',tier:'rookie',team:S.myTeam,name:'',nat:'KR',hide:true,pot:92,yrs:0,trait:'steady',sig:['',''],st:{laning:80,mechanics:80,teamfight:80,macro:80,pool:80,mental:80}};return V.cr}
function edWhere(p){if(p.team&&S.teams[p.team])return p.squad==='academy'?'2군':'';if(S.fa.includes(p.id))return 'FA';if(p.retired||(S.legends||[]).includes(p.id))return '은퇴';return '소속 없음'}
function edMatch(p){const q=(V.edQ||'').trim().toLowerCase();if(q&&!p.name.toLowerCase().includes(q)&&!(p.team&&teamName(p.team).toLowerCase().includes(q)))return false;
  const tf=V.edTF||'ALL';if(tf==='MY'&&p.team!==S.myTeam)return false;if(tf==='LCK'&&!(p.team&&isLCK(p.team)))return false;if(tf==='INTL'&&!(p.team&&S.teams[p.team]&&!isLCK(p.team)))return false;
  if(tf==='FA'&&!S.fa.includes(p.id))return false;if(tf==='FREE'&&p.team&&S.teams[p.team])return false;
  const rf=V.edRF||'ALL';if(rf!=='ALL'&&p.pos!==rf)return false;return true}
function edListRows(){const all=Object.values(S.players).filter(p=>p&&edMatch(p)).sort((a,b)=>ovr(b)-ovr(a));const list=all.slice(0,120);
  if(!list.length)return '<div class="mute" style="padding:14px;font-size:13px">검색 결과가 없어요.</div>';
  return list.map(p=>{const w=edWhere(p);return `<button class="edrow ${V.edP===p.id?'on':''}" data-a="edtPick" data-v="${p.id}"><span class="mute edpos">${ROLE_KO[p.pos]}</span><span class="edn"><b>${esc(p.name)}</b>${w?` <span class="chip">${w}</span>`:''}</span>${p.team&&S.teams[p.team]?tb(p.team):'<span class="tb" style="--tc:#555">—</span>'}<b class="num">${ovr(p)}</b></button>`}).join('')+(all.length>120?`<div class="mute" style="padding:8px;font-size:12px">상위 120명만 표시 · 검색으로 좁혀 보세요 (총 ${all.length}명)</div>`:'')}
function edTeamOpts(sel,withFree){const groups=[['LCK',lckCodes()]].concat(['LPL','LEC','LCS','LCP','CBLOL'].map(r=>[r,Object.keys(S.teams).filter(c=>!isLCK(c)&&regionOf(c)===r)])).concat([['기타',Object.keys(S.teams).filter(c=>!isLCK(c)&&!['LPL','LEC','LCS','LCP','CBLOL'].includes(regionOf(c)))]]);
  return (withFree?`<option value="FA" ${sel==='FA'?'selected':''}>FA (자유계약)</option><option value="RET" ${sel==='RET'?'selected':''}>은퇴 처리</option>`:'')+groups.filter(g=>g[1].length).map(([g,cs])=>`<optgroup label="${g}">${cs.map(c=>`<option value="${c}" ${sel===c?'selected':''}>${esc(teamName(c))}${c===S.myTeam?' (우리 팀)':''} · ${T(c).roster.length}명</option>`).join('')}</optgroup>`).join('')}
function edNum(field,val,min,max,step=1){return `<span class="edn2"><button class="btn sm" data-a="edtAdj" data-v="${field}:${-step}" aria-label="감소">−</button><input class="edin num" type="number" inputmode="numeric" min="${min}" max="${max}" value="${val}" data-ch="edtF" data-v="${field}"><button class="btn sm" data-a="edtAdj" data-v="${field}:${step}" aria-label="증가">+</button></span>`}

  const traits=Object.entries(TRAITS).map(([k,t])=>{const lv=tLv(p,k);return `<button class="btn sm ${lv?'on':''}" data-a="edtTrait" data-v="${k}" title="${esc(t.desc)}">${t.name}${lv?` Lv${lv}`:''}</button>`}).join('');
  const dest=V.edDest||(p.team&&S.teams[p.team]?p.team:'FA');const dfull=dest!=='FA'&&dest!=='RET'&&S.teams[dest]&&dest!==p.team;
  const swapOpts=dfull?roster(dest).sort((a,b)=>(a.pos===p.pos?-1:1)-(b.pos===p.pos?-1:1)||ovr(b)-ovr(a)).map(q=>`<option value="${q.id}" ${+V.edSwap===q.id?'selected':''}>${ROLE_KO[q.pos]} ${esc(q.name)} (${ovr(q)})</option>`).join(''):'';
  return `<div class="edhead" style="--tc:${p.team&&TEAM_META[p.team]?TEAM_META[p.team].color:'#556'}">

    <div style="min-width:0;flex:1"><div class="eyebrow">${ROLE_KO[p.pos]} · ${STAGE_KO[st]} · 경력 ${p.yrs}년차</div><div class="edname">${esc(p.name)} ${gradeB(p)}</div><div class="mute" style="font-size:12.5px">${where} · 계약 ${p.contract}년 · 연봉 ${p.salary}억</div></div>
    <div class="edovrs"><div class="edovr"><b class="num">${ovr(p)}</b><small>능력</small></div><div class="edovr"><b class="num gold">${p.pot}</b><small>잠재</small></div></div></div>
   <div class="edsec"><h4>빠른 수정</h4><div class="row" style="gap:6px;flex-wrap:wrap"><button class="btn sm" data-a="edtAll" data-v="-1">전체 능력 −1</button><button class="btn sm" data-a="edtAll" data-v="1">전체 능력 +1</button><button class="btn sm" data-a="edtAll" data-v="5">전체 능력 +5</button><button class="btn sm" data-a="edtMax">능력 = 잠재력</button><button class="btn sm" data-a="edtFit">최상 컨디션</button><button class="btn sm" data-a="edtRevealPot">${p.scout!=null&&p.scout<100?'잠재력 공개':'잠재력 공개됨'}</button></div></div>
   <div class="edsec"><h4>기본 정보</h4><div class="edgrid">
     <label class="edf"><span>이름</span><input class="edin wide" type="text" maxlength="16" value="${esc(p.name)}" data-ch="edtF" data-v="name"></label>
     <label class="edf"><span>포지션</span><select class="edin wide" data-ch="edtF" data-v="pos">${ROLES.map(r=>`<option value="${r}" ${p.pos===r?'selected':''}>${ROLE_KO[r]}</option>`).join('')}</select></label>
     <label class="edf"><span>국적</span><select class="edin wide" data-ch="edtF" data-v="nat"><option value="KR" ${natOf(p)==='KR'?'selected':''}>한국</option><option value="FOR" ${natOf(p)!=='KR'?'selected':''}>외국인</option></select></label>
     <div class="edf"><span>경력 연차</span>${edNum('yrs',p.yrs,0,16)}</div>
     <div class="edf"><span>잠재력</span>${edNum('pot',p.pot,40,99)}</div>
   </div></div>
   <div class="edsec"><h4>계약</h4><div class="edgrid"><div class="edf"><span>계약 기간(년)</span>${edNum('contract',p.contract,0,5)}</div><div class="edf"><span>연봉(억)</span>${edNum('salary',p.salary,0,120)}</div></div></div>
   <div class="edsec"><h4>능력치 <span class="mute" style="font-weight:500;font-size:12px">· 6개 능력치 평균이 종합 능력이 돼요</span></h4><div class="edgrid">${stats}</div>
     <button class="btn sm" style="margin-top:8px" data-a="edtSub">${V.edSub?'세부 능력치 접기':'세부 능력치 펼치기'}</button>${subs}</div>
   <div class="edsec"><h4>컨디션</h4><div class="edgrid"><div class="edf"><span>체력</span>${edNum('cond',Math.round(p.cond),15,100,5)}</div><div class="edf"><span>사기</span>${edNum('morale',Math.round(p.morale),10,100,5)}</div><div class="edf"><span>폼</span>${edNum('form',Math.round(p.form),-10,10)}</div>
     <div class="edf"><span>컨디션 화살표</span><span class="row" style="gap:4px">${arrows}</span></div></div><p class="mute" style="font-size:11.5px;margin:6px 0 0">화살표는 매주 다시 정해져요. 체력·사기·폼이 높을수록 좋은 화살표가 나와요.</p></div>
   <div class="edsec"><h4>특성 <span class="mute" style="font-weight:500;font-size:12px">· 누를 때마다 Lv1→2→3→해제 (최대 3개)</span></h4><div class="row" style="gap:6px;flex-wrap:wrap">${traits}</div></div>
   <div class="edsec"><h4>자유 이적</h4><div class="edgrid">
     <label class="edf"><span>보낼 곳</span><select class="edin wide" data-ch="edtDest" data-v="d">${edTeamOpts(dest,true)}</select></label>
     ${dfull?`<label class="edf"><span>맞교환 선수</span><select class="edin wide" data-ch="edtSwap" data-v="s"><option value="">${T(dest).roster.length>=ROSTER_MAX?'선택 필요 (정원 가득)':'맞교환 없음'}</option>${swapOpts}</select></label>`:''}
   </div><div class="row" style="gap:6px;margin-top:8px"><button class="btn sm primary" data-a="edtMove">${dest==='RET'?'은퇴 처리':dest==='FA'?'FA로 풀기':'이적 실행'}</button><span class="mute" style="font-size:12px">이적료·샐러리캡·외국인 제한 없이 즉시 이동해요.</span></div></div>`}
function edCreatePanel(){const c=edState();const custom=c.mode==='custom';
  const champs=CHAMP_LIST.filter(x=>canRole(x,c.pos));
  const sigSel=i=>`<select class="edin wide" data-ch="edtC" data-v="sig${i}"><option value="">랜덤</option>${champs.map(x=>`<option value="${esc(x)}" ${c.sig[i]===x?'selected':''}>${esc(cn(x))}</option>`).join('')}</select>`;
  const o=Math.round(U.avg(STAT_KEYS.map(k=>c.st[k])));
  return `<div class="edsec"><h4>선수 생성</h4><div class="row" style="gap:6px"><button class="btn sm ${!custom?'on':''}" data-a="edtCMode" data-v="random">랜덤 포텐 선수</button><button class="btn sm ${custom?'on':''}" data-a="edtCMode" data-v="custom">나만의 선수</button></div>
    <p class="mute" style="font-size:12px;margin:8px 0 0">${custom?'이름·능력치·잠재력·특성·주력 챔피언을 직접 정해서 만들어요.':'등급만 고르면 능력치와 잠재력이 무작위로 정해져요. 잠재력을 숨기면 스카우팅처럼 범위로만 보여요.'}</p></div>
   <div class="edsec"><div class="edgrid">
    <label class="edf"><span>이름</span><input class="edin wide" type="text" maxlength="16" placeholder="비우면 자동 생성" value="${esc(c.name)}" data-ch="edtC" data-v="name"></label>
    <label class="edf"><span>포지션</span><select class="edin wide" data-ch="edtC" data-v="pos">${ROLES.map(r=>`<option value="${r}" ${c.pos===r?'selected':''}>${ROLE_KO[r]}</option>`).join('')}</select></label>

    ${custom?`<div class="edf"><span>경력 연차</span>${edNum('c.yrs',c.yrs,0,16)}</div><div class="edf"><span>잠재력</span>${edNum('c.pot',c.pot,40,99)}</div>
     <label class="edf"><span>특성</span><select class="edin wide" data-ch="edtC" data-v="trait">${Object.entries(TRAITS).map(([k,t])=>`<option value="${k}" ${c.trait===k?'selected':''}>${t.name}</option>`).join('')}</select></label>
     <label class="edf"><span>주력 챔프 1</span>${sigSel(0)}</label><label class="edf"><span>주력 챔프 2</span>${sigSel(1)}</label>`
    :`<div class="edf"><span>등급</span><span class="row" style="gap:4px;flex-wrap:wrap">${Object.entries(ED_TIERS).map(([k,t])=>`<button class="btn sm ${c.tier===k?'on':''}" data-a="edtCTier" data-v="${k}">${t[0]}</button>`).join('')}<button class="btn sm ${c.tier==='any'?'on':''}" data-a="edtCTier" data-v="any">완전 랜덤</button></span></div>
     <div class="edf"><span>잠재력</span><span class="row" style="gap:4px"><button class="btn sm ${c.hide?'on':''}" data-a="edtCHide" data-v="1">숨김 (랜덤 포텐)</button><button class="btn sm ${!c.hide?'on':''}" data-a="edtCHide" data-v="0">공개</button></span></div>`}
   </div></div>
   ${custom?`<div class="edsec"><h4>능력치 <span class="mute" style="font-weight:500;font-size:12px">· 종합 ${o}</span></h4><div class="edgrid">${STAT_KEYS.map(k=>`<div class="edf"><span>${STAT_KO[k]}</span>${edNum('c.st.'+k,c.st[k],30,99)}</div>`).join('')}</div></div>`:''}
   <div class="edsec"><button class="btn primary" data-a="edtCreate">${custom?'이 선수 만들기':'랜덤 선수 생성'}</button></div>`}
function edModal(){if(!V.ed||!S)return '';const tab=V.edTab||'edit';const p=V.edP&&P(V.edP);

     <div class="rtabs edrt">${['ALL',...ROLES].map(r=>`<button class="${(V.edRF||'ALL')===r?'on':''}" data-a="edtRF" data-v="${r}">${r==='ALL'?'전체':ROLE_KO[r]}</button>`).join('')}</div></div>`;

function edSetPos(p,pos){if(p.pos===pos)return;p.pos=pos;const champs=CHAMP_LIST.filter(c=>canRole(c,pos));
  champs.forEach(c=>{if(p.mastery[c]==null)p.mastery[c]=Math.round(U.clamp(50+(p.st.pool-75)*0.9+U.r(-8,12),35,88))});
  let sig=p.sig.filter(c=>canRole(c,pos));if(sig.length<2){const add=champs.filter(c=>!sig.includes(c)).sort((a,b)=>(p.mastery[b]||0)-(p.mastery[a]||0)).slice(0,3-sig.length);add.forEach((c,i)=>p.mastery[c]=Math.max(p.mastery[c]||0,94-i*2));sig=sig.concat(add)}
  p.sig=sig;initSubs(p);if(p.team&&S.teams[p.team]){const t=T(p.team);Object.keys(t.lineup||{}).forEach(r=>{if(t.lineup[r]===p.id)delete t.lineup[r]});if(p.squad!=='academy')ensureLineup(p.team)}}
function edSet(p,field,val){
  if(field==='name'){const n=String(val).trim().slice(0,16);if(!n)return '이름을 입력하세요';if(Object.values(S.players).some(q=>q!==p&&q.name.toLowerCase()===n.toLowerCase()))return '같은 이름의 선수가 이미 있어요';p.name=n;return}
  if(field==='pos'){if(ROLES.includes(val))edSetPos(p,val);return}
  if(field==='nat'){p.nat=val==='KR'?'KR':'FOR';return}
  const n=Math.round(+val);if(!isFinite(n))return '숫자를 입력하세요';
  if(field.startsWith('st.')){const k=field.slice(3);if(STAT_KEYS.includes(k))p.st[k]=U.clamp(n,30,99);return}
  if(field.startsWith('sub.')){const k=field.slice(4);const g=SUB_GROUP[k];if(g){if(!p.off)initSubs(p);p.off[k]=U.clamp(U.clamp(n,30,99)-p.st[g],-25,25)}return}
  const lim={yrs:[0,16],pot:[40,99],contract:[0,5],salary:[0,120],cond:[15,100],morale:[10,100],form:[-10,10]}[field];
  if(lim){p[field]=U.clamp(n,lim[0],lim[1]);if(field==='pot'){p.scout=100}return}}
function edAdjVal(p,field){if(field.startsWith('st.'))return p.st[field.slice(3)];if(field.startsWith('sub.'))return sub(p,field.slice(4));return p[field]}
function edDetach(p){if(p.team&&S.teams[p.team]){const t=T(p.team);t.roster=t.roster.filter(x=>x!==p.id);if(t.academy)t.academy=t.academy.filter(x=>x!==p.id);Object.keys(t.lineup||{}).forEach(r=>{if(t.lineup[r]===p.id)delete t.lineup[r]})}
  S.fa=S.fa.filter(x=>x!==p.id);if(S.legends)S.legends=S.legends.filter(x=>x!==p.id);const c=S.scoutC;if(c){['solo','streamers'].forEach(k=>{if(c[k])c[k]=c[k].filter(x=>x!==p.id)})}
  if(S.negos)delete S.negos[p.id];if(S.sales)delete S.sales[p.id];if(S.offseason&&S.offseason.expiring)S.offseason.expiring=S.offseason.expiring.filter(x=>x!==p.id);p.promise=false}
function edPlace(p,dest){
  if(dest==='FA'){p.team=null;p.squad=null;p.contract=0;p.retired=false;if(!S.fa.includes(p.id))S.fa.push(p.id);return}
  if(dest==='RET'){p.team=null;p.squad=null;p.contract=0;p.retired=true;return}
  const t=T(dest);p.team=dest;p.squad='main';p.retired=false;p.contract=Math.max(1,p.contract||0);if(!p.salary)p.salary=salaryFor(ovr(p));t.roster.push(p.id);
  t.roster.forEach(o=>{if(o!==p.id&&S.chem[chemKey(o,p.id)]==null)S.chem[chemKey(o,p.id)]=U.ri(55,65)});
  const cur=starters(dest)[p.pos];if(!cur||ovr(p)>ovr(cur)){t.lineup=t.lineup||{};t.lineup[p.pos]=p.id}}
function edMove(pid,dest,swapId){const p=P(pid);if(!p)return {ok:false,msg:'선수를 찾을 수 없어요'};const src=p.team&&S.teams[p.team]?p.team:null;
  if(dest===src&&p.squad!=='academy')return {ok:false,msg:'이미 그 팀 소속이에요'};
  const team=dest!=='FA'&&dest!=='RET';if(team&&!S.teams[dest])return {ok:false,msg:'팀을 찾을 수 없어요'};
  const q=swapId?P(+swapId):null;
  if(team&&!q&&T(dest).roster.length>=ROSTER_MAX&&dest!==src)return {ok:false,msg:`${teamName(dest)} 1군이 가득 찼어요 (${ROSTER_MAX}명). 맞교환 선수를 고르세요.`};
  edDetach(p);if(q&&q.team===dest){edDetach(q);edPlace(q,src||'FA')}
  edPlace(p,dest);
  [src,dest,q&&q.team].forEach(c=>{if(c&&S.teams[c]&&c!=='FA'&&c!=='RET')ensureLineup(c)});
  const msg=dest==='FA'?`${p.name} → FA`:dest==='RET'?`${p.name} 은퇴 처리`:`${p.name} → ${teamName(dest)}${q?` (맞교환: ${q.name} → ${src?teamName(src):'FA'})`:''}`;
  return {ok:true,msg}}
function edGenStats(o,pos){const b=()=>U.clamp(o+U.ri(-5,5),40,99);const st={laning:b(),mechanics:b(),teamfight:b(),macro:b(),pool:b(),mental:b()};
  // 평균이 목표 능력과 맞도록 보정
  const d=o-Math.round(U.avg(STAT_KEYS.map(k=>st[k])));STAT_KEYS.forEach(k=>st[k]=U.clamp(st[k]+d,40,99));return st}
function edCreate(){const c=edState();const custom=c.mode==='custom';const dest=c.team||'FA';
  if(dest!=='FA'&&S.teams[dest]&&T(dest).roster.length>=ROSTER_MAX)return {ok:false,msg:`${teamName(dest)} 1군이 가득 찼어요 (${ROSTER_MAX}명). FA로 만들거나 자리를 비워 주세요.`};
  let name=(c.name||'').trim().slice(0,16);if(name&&Object.values(S.players).some(q=>q.name.toLowerCase()===name.toLowerCase()))return {ok:false,msg:'같은 이름의 선수가 이미 있어요'};
  if(!name)name=typeof proLikeId==='function'?proLikeId():uniqueName();
  let o,pot,st,yrs,trait;
  if(custom){st={...c.st};STAT_KEYS.forEach(k=>st[k]=U.clamp(Math.round(st[k]),30,99));o=Math.round(U.avg(STAT_KEYS.map(k=>st[k])));pot=Math.max(o,U.clamp(c.pot,40,99));yrs=U.clamp(c.yrs,0,16);trait=c.trait}
  else{const tk=c.tier==='any'?U.pick(['prospect','prospect','rookie','rookie','rookie','regular','regular','ace','world']):c.tier;const t=ED_TIERS[tk];o=U.ri(t[1],t[2]);pot=U.clamp(o+U.ri(t[3],t[4]),o,99);yrs=U.ri(t[5],t[6]);st=edGenStats(o,c.pos);
    trait=pot-o>=8&&Math.random()<0.6?'prospect':U.pick(['laner','fighter','brain','streaky','steady','iron','clutch','pool'])}
  const p=makePlayer(null,name,c.pos,o,pot,st,{rookie:yrs===0,trait});
  p.yrs=yrs;p.primeExt=0;p.nat=c.nat==='KR'?'KR':'FOR';p.morale=75;p.cond=95;
  if(!custom&&c.hide){p.scout=U.ri(10,30);p.potBias=Math.random()}else p.scout=100;
  if(custom){const sig=c.sig.filter(x=>x&&CHAMPS[x]&&canRole(x,c.pos));if(sig.length){sig.forEach((x,i)=>p.mastery[x]=97-i*2);p.sig=[...new Set(sig.concat(p.sig))].slice(0,3)}}
  p.salary=salaryFor(o);p.contract=2;
  edPlace(p,dest);if(dest!=='FA')ensureLineup(dest);
  return {ok:true,id:p.id,msg:`${p.name} 생성 완료 (${ROLE_KO[p.pos]} · 능력 ${o}${!custom&&c.hide?' · 잠재력 비공개':` · 잠재 ${pot}`})`}}

function edAct(a,v){const p=V.edP&&P(V.edP);const c=V.cr;
  switch(a){
    case 'edtOpen':V.gear=false;V.ed=true;V.edTab=V.edTab||'edit';edState();break;
    case 'edtClose':V.ed=false;break;
    case 'edtTab':V.edTab=v;break;
    case 'edtTF':V.edTF=v;break;
    case 'edtRF':V.edRF=v;break;
    case 'edtPick':V.edP=+v;V.edDest=null;V.edSwap=null;{const el=document.querySelector('.edright');if(el)el.scrollTop=0}break;
    case 'edtBack':V.edP=null;break;
    case 'edtSub':V.edSub=!V.edSub;break;
    case 'edtF':{const i=v.indexOf('|');const f=v.slice(0,i),val=v.slice(i+1);if(f.startsWith('c.')){edCSet(f.slice(2),val);break}if(!p)return false;const e=edSet(p,f,val);if(e)toast(e);save();break}
    case 'edtAdj':{const [f,d]=v.split(':');if(f.startsWith('c.')){const k=f.slice(2);const cur=k.startsWith('st.')?c.st[k.slice(3)]:c[k];edCSet(k,cur+(+d));break}if(!p)return false;edSet(p,f,edAdjVal(p,f)+(+d));save();break}
    case 'edtAll':if(!p)return false;STAT_KEYS.forEach(k=>p.st[k]=U.clamp(p.st[k]+(+v),30,99));save();break;
    case 'edtMax':if(!p)return false;{const d=p.pot-ovr(p);if(d>0){STAT_KEYS.forEach(k=>p.st[k]=U.clamp(p.st[k]+d,30,99));let g=0;while(ovr(p)<p.pot&&g++<12)STAT_KEYS.forEach(k=>p.st[k]=U.clamp(p.st[k]+1,30,99))}save()}break;
    case 'edtFit':if(!p)return false;p.cond=100;p.morale=100;p.form=6;p.arrow=2;save();break;
    case 'edtRevealPot':if(!p)return false;p.scout=100;save();break;
    case 'edtArrow':if(!p)return false;p.arrow=U.clamp(+v,-2,2);save();break;
    case 'edtTrait':{if(!p)return false;migratePlayer(p);const t=p.traits.find(x=>x.k===v);if(t){if(t.lv<3)t.lv++;else p.traits=p.traits.filter(x=>x.k!==v)}else{if(p.traits.length>=TRAIT_MAX){toast(`특성은 최대 ${TRAIT_MAX}개예요`);break}p.traits.push({k:v,lv:1})}if(!p.traits.length)p.traits.push({k:'steady',lv:1});p.trait=p.traits[0].k;save();break}
    case 'edtDest':V.edDest=v.split('|')[1];V.edSwap=null;break;
    case 'edtSwap':V.edSwap=v.split('|')[1]||null;break;
    case 'edtMove':{if(!p)return false;const r=edMove(p.id,V.edDest||(p.team||'FA'),V.edSwap);toast(r.msg);if(r.ok){V.edDest=null;V.edSwap=null;save()}break}
    case 'edtC':{const i=v.indexOf('|');edCSet(v.slice(0,i),v.slice(i+1));break}
    case 'edtCMode':c.mode=v;break;
    case 'edtCTier':c.tier=v;break;
    case 'edtCHide':c.hide=v==='1';break;
    case 'edtCreate':{const r=edCreate();toast(r.msg);if(r.ok){V.edTab='edit';V.edP=r.id;V.edQ='';V.edTF='ALL';V.edRF='ALL';c.name='';save()}break}
    default:return false}
  return true}
function edCSet(k,val){const c=edState();
  if(k==='name'){c.name=String(val).slice(0,16);return}
  if(k==='pos'){c.pos=val;c.sig=['',''];return}
  if(k==='nat'||k==='team'||k==='trait'){c[k]=val;return}
  if(k==='sig0'||k==='sig1'){c.sig[+k.slice(3)]=val;return}
  const n=Math.round(+val);if(!isFinite(n))return;
  if(k.startsWith('st.')){c.st[k.slice(3)]=U.clamp(n,30,99);return}
  if(k==='pot')c.pot=U.clamp(n,40,99);if(k==='yrs')c.yrs=U.clamp(n,0,16)}

function edLegendPool(){if(V._rvPool)return V._rvPool;const map={};
  const add=(n,pos,pk,yr,team)=>{if(!n||yr<2012||(typeof FOREIGN_LEGENDS!=='undefined'&&FOREIGN_LEGENDS.has(n)))return;const k=n.toLowerCase()+'|'+yr;if(!map[k]||map[k].pk<pk)map[k]={n,pos,pk,yr,team,key:n+'|'+yr}};
  LCK_ERA.forEach(([n,pos,pk,yr,team])=>add(n,pos,pk,yr,team));
  LEGENDS.forEach(L=>add(L[0],L[1],L[2],legendYear(L[0]),L[4]));
  LCK_TEAM_KEYS.forEach(k=>{const t=LEGEND_TEAMS[k];if(t)t.ros.forEach(([n,pk],i)=>add(n,ROLES[i],pk,t.yr,`${t.name}`))});
  return V._rvPool=Object.values(map).sort((a,b)=>a.yr-b.yr||ROLES.indexOf(a.pos)-ROLES.indexOf(b.pos)||b.pk-a.pk)}

function edRvAct(a,v){switch(a){

    ${ms.length?ms.map(m=>{const a=P(m.m),b=P(m.s);const f=mentorFit(a,b);return `<div class="mrow"><b>${esc(a.name)}</b><span class="mute">${ROLE_KO[a.pos]}</span><span class="gold" aria-hidden="true">→</span><b>${esc(b.name)}</b><span class="mute">${ROLE_KO[b.pos]} · ${m.wk}주째</span><span class="sp"></span><span class="chip ${f>=1?'gold':f<0?'neg':''}">궁합 ${['나쁨','보통','좋음','아주 좋음'][U.clamp(f+1,0,3)]}</span><button class="btn sm ghost" data-a="mentorEnd" data-v="${b.id}">종료</button></div>`}).join(''):'<p class="mute" style="margin:0 0 8px;font-size:13px">아직 멘토링이 없어요. 베테랑(5년차 이상 또는 능력 90 이상)과 3년차 이하 유망주를 짝지어 보세요.</p>'}

const SQ_VIEWS=['개요','속성','경기','계약'];
function viewSquadS2(){const code=S.myTeam;const lu=starters(code);const sIds=new Set(Object.values(lu).filter(Boolean).map(p=>p.id));const view=V.sqView||'개요';
  const all=roster(code).concat(academy(code)).sort((a,b)=>(sIds.has(b.id)-sIds.has(a.id))||(a.squad==='academy')-(b.squad==='academy')||ROLES.indexOf(a.pos)-ROLES.indexOf(b.pos));

  const gAvg=(p,keys)=>Math.round(U.avg(keys.map(k=>attr(p,k))));
  const cells=p=>{const h=hid(p);if(view==='개요'){const r=roleOf(p);return [starHtml(caStars(p),false,true),paHtml(p,true),`${r?esc(r.n):'-'}`,`<b class="num">${avgF(p)}</b>`,`<span class="num ${p.cond<60?'warn':''}">${Math.round(p.cond)}</span>`,`<span class="num ${p.morale<45?'bad':p.morale>=80?'good':''}">${Math.round(p.morale)}</span>`,`<span class="mute" style="font-size:12px">${esc(personality(p)[0])}</span>`]}

    return [`<span class="num">${p.salary}억</span>`,`<span class="num ${p.contract<=1?'warn':''}">${p.contract>=9?'연습생':contractTxt(p)}</span>`,`<span class="num">${Math.round(typeof tradeValue==='function'?tradeValue(p):0)}</span>`,`<span class="${p.morale<45||(h.amb>=15&&p.bench>=3)?'bad':'good'}">${p.morale<45||(h.amb>=15&&p.bench>=3)?'낮음':'높음'}</span>`,`${p.listed?'<span class="chip neg">이적 희망</span>':''}${p.motiv>0?'<span class="chip gold">동기 부여</span>':''}${canExtend(p)?`<button class="btn sm" data-a="extNego" data-v="${p.id}">연장 계약</button>`:''}`]};

  const other=P(V.cmpB)||all.find(x=>x!==sel&&x.pos===sel.pos)||Object.values(lu).filter(Boolean).map(x=>x).find(x=>x!==sel);
  const rows=all.map(p=>`<tr class="${p===sel?'me':''}" data-a="cmpPick" data-v="${p.id}" tabindex="0"><td class="mute">${ROLE_KO[p.pos]}${p.squad==='academy'?' <span class="chip" style="font-size:10.5px">2군</span>':''}</td><td>${pl(p)} ${sIds.has(p.id)?'<span class="chip gold" style="font-size:10.5px">주전</span>':''}<div class="mute" style="font-size:11.5px">${STAGE_KO[stageOf(p)]} · ${p.yrs}년차</div></td>${cells(p).map(c=>`<td>${c}</td>`).join('')}</tr>`).join('');

  const mode=V.rosterView==='table'?'table':'depth';
  const head=`<div class="row section" style="gap:8px;flex-wrap:wrap"><h2 class="disp" style="font-size:26px;margin:0">${esc(teamName(code))} 선수단</h2><span class="sp"></span>
    <div class="seg"><button class="${mode==='depth'?'on':''}" data-a="rosterView" data-v="squad">편성</button><button class="${mode==='table'?'on':''}" data-a="rosterView" data-v="table">상세 표</button><button class="${V.rosterView==='card'?'on':''}" data-a="rosterView" data-v="card">카드 · 육성</button></div></div>`+(typeof squadSummary==='function'?squadSummary(code):'');
  const nego=V.nego&&S.negos&&S.negos[V.nego]&&S.negos[V.nego].kind==='extend'?negoPanel():'';

   ${ws.autoDone?`<div class="cdone"><span class="spk a">수석코치</span>${esc(ws.autoDone)}</div>`:''}

   ${g}</section>`}
// 남은 일을 수석코치가 처리 (경기 시작 · 다음 주 진행 때 자동)

// ===== 다듬기: 세부 속성 개성 · 비시즌 한 번에 맡기기 =====
// 1) 세부 속성 개성: 같은 능력치 묶음 안에서도 강점·약점이 뚜렷하게 (평균은 그대로)
function initSubs(p){
  p.off=p.off||{};const rnd=()=>Math.round(U.gauss()*5.6);
  Object.entries(SUBS).forEach(([g,l])=>{const vals=l.map(()=>rnd());const m=Math.round(vals.reduce((a,b)=>a+b,0)/vals.length);l.forEach(([k],i)=>{if(p.off[k]==null)p.off[k]=U.clamp(vals[i]-m,-14,14)})});
  (ROLE_SUBS[p.pos]||[]).forEach(([k])=>{if(p.off[k]==null)p.off[k]=U.clamp(Math.round(U.gauss()*6.5),-15,15)});
  if(tLv(p,'laner')){p.off.trade=(p.off.trade||0)+3;p.off.prio=(p.off.prio||0)+3}
  if(tLv(p,'fighter')){p.off.posi=(p.off.posi||0)+3;p.off.engage=(p.off.engage||0)+2}
  if(tLv(p,'brain')){p.off.shotcall=(p.off.shotcall||0)+4;p.off.vision=(p.off.vision||0)+2}
  if(tLv(p,'clutch'))p.off.clutch=(p.off.clutch||0)+5;
  if(tLv(p,'streaky'))p.off.consist=(p.off.consist||0)-8;
  if(tLv(p,'steady'))p.off.consist=(p.off.consist||0)+5;
  if(tLv(p,'iron'))p.off.consist=(p.off.consist||0)+3;
  p.offV2=1}
// 기존 세이브: 편차를 넓혀 개성을 살림 (한 번만)
function offWiden(p){if(!p||!p.off||p.offV2)return;Object.keys(p.off).forEach(k=>p.off[k]=U.clamp(Math.round(p.off[k]*1.7),-15,15));p.offV2=1}
(function(){const _ma=migrateAll;migrateAll=function(){_ma();try{Object.values(S.players).forEach(offWiden)}catch(e){}}})();

// 2) 비시즌 한 번에: 수석코치가 재계약·제안·이적 시장을 처리하고 바로 다음 일정으로
function offAuto(){if(S.phase!=='offseason')return [];const me=S.myTeam;const out=[];const os=S.offseason||{};
  if(S.finEv){const e=S.finEv;const up=e.type==='up';const cost=Math.round(Math.abs(e.bank||0)*2.2);
    if(up){finAnswer(true);out.push('투자 제안 수락')}else if((S.funds||0)-cost>=30){finAnswer(false);out.push(`예산 감축 거절 (자금 ${cost}억으로 메움)`)}else{finAnswer(true);out.push('예산 감축 수용')}}
  const lu=starters(me);const isKey=p=>{const cur=lu[p.pos];return (cur&&cur.id===p.id)||!cur||ovr(p)>=ovr(cur)-2||((p.pot||0)>=ovr(p)+8&&(p.age||30)<=21)};
  const ex=(os.expiring||[]).map(P).filter(Boolean);
  ex.filter(p=>!isKey(p)).forEach(p=>{os.expiring=os.expiring.filter(x=>x!==p.id);releasePlayer(p.id,true);out.push(`${p.name} 결별`)});
  ex.filter(isKey).sort((a,b)=>ovr(b)-ovr(a)).forEach(p=>{const d=Math.round((p.demand||salaryFor(ovr(p)))*(p.raise||1));
    const room=teamCap(me)-(payroll(me)-p.salary);let pay=d,cut=false;
    if(d>room&&room>=Math.round(d*0.85)){pay=Math.max(1,room);cut=true}
    if(pay<=room){p.salary=pay;p.raise=null;p.contract=Math.max(1,yrsPrefOf(p));if(typeof markSigned==='function')markSigned(p);os.expiring=os.expiring.filter(x=>x!==p.id);p.morale=U.clamp(p.morale+(cut?-3:4),0,100);out.push(`${p.name} 재계약 ${pay}억${cut?' (캡 맞춰 소폭 양보)':''}`)}
    else{os.expiring=os.expiring.filter(x=>x!==p.id);releasePlayer(p.id,true);out.push(`${p.name} 결별 (캡 초과)`)}});
  ROLES.forEach(r=>{if(starters(me)[r])return;const c=(S.fa||[]).map(P).filter(x=>x&&x.pos===r&&!S.faTried[x.id]).sort((a,b)=>ovr(b)-ovr(a)).slice(0,6);
    for(const x of c){const res=trySign(x.id,1.1);if(res&&res.ok){out.push(`${x.name} 영입 (${r})`);break}}});
  try{if(S.mk)mkSkip()}catch(e){}
  if(out.length)news(`[수석코치] 비시즌 업무 처리: ${out.join(' · ')}`,'info');
  return out}

function offerPending(){return (S.offers||[]).filter(o=>!o.done).length}
function offerInit(o){if(o.max)return;const p=P(o.pid);const base=o.fee;

function offerVoice(o){const p=P(o.pid),c=teamName(o.club);const n=k=>({play:[`감독님, 벤치에서 보내기엔 지금이 제일 중요한 시기예요. ${c}에서는 주전으로 뛸 수 있다고 들었습니다. 보내주셨으면 해요.`,`경기에 나가고 싶어요. 여기서 기회를 기다리는 것보다 ${c}에서 증명해 보고 싶습니다.`],
  money:[`솔직하게 말씀드릴게요. ${c} 조건이 제 커리어와 가족한테 정말 큰 도움이 돼요. 이번엔 놓치고 싶지 않습니다.`,`프로 생활이 길지 않잖아요. ${c}에서 제시한 조건, 저한테는 쉽게 오지 않는 기회예요.`],
  win:[`우승할 수 있는 곳에서 뛰고 싶어요. ${c}라면 그 기회가 있다고 생각합니다.`,`더 큰 무대에서 트로피를 들고 싶습니다. ${c} 제안, 꼭 가고 싶어요.`],
  stay:[`저는 여기 남고 싶어요. 아직 이 팀에서 이루고 싶은 게 있습니다.`,`제안 온 건 들었는데요, 저는 이 팀이 좋아요. 감독님 결정 따를게요.`]}[k]);
  const a=n(o.why);return a[(p.id+o.fee)%a.length]}
function offerCounter(i,lvl){const o=S.offers[i];if(!o||o.done)return;offerInit(o);const p=P(o.pid);
  const ask=Math.round(o.fee*(lvl===2?1.35:1.15));o.rounds++;

  else if(o.rounds>=2||Math.random()<(ask>o.max*1.2?0.4:0.12)){o.log.push(`우리: ${ask}억 요구 → ${teamName(o.club)}: "그 금액이면 협상을 접겠습니다."`);o.done=true;o.walked=true;
    if(o.wants){p.morale=U.clamp(p.morale-10,0,100);news(`${josa(teamName(o.club),'이','가')} ${p.name} 영입을 포기했습니다 (이적료 이견). 선수가 실망했어요 (사기 -10)`,'loss')}else news(`${josa(teamName(o.club),'이','가')} ${p.name} 영입을 포기했습니다 (이적료 이견)`,'info')}
  else{const mid=Math.round((o.fee+Math.min(ask,o.max))/2);o.log.push(`우리: ${ask}억 요구 → ${teamName(o.club)}: "${ask}억은 어렵고, ${mid}억까지는 가능합니다."`);o.fee=mid}}
function offerPersuade(i,how){const o=S.offers[i];if(!o||o.done||!o.wants)return;offerInit(o);const p=P(o.pid);o.pers++;
  const mv=typeof motives==='function'?motives(p):{loy:10};let ch=0.25+(mv.loy||10)*0.02,txt='';
